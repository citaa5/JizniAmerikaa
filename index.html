0 druhů rostlin, asi 400 druhů ptáků (harpyje), vřešťani, kajmani (UNESCO)", "https://whc.unesco.org/en/list/303/"], ["Los Glaciares: ledovce na polovině parku, Jižní patagonské ledové pole, Perito Moreno hradí rameno jezera Argentino, kry padají s hromovým rachotem (UNESCO)", "https://whc.unesco.org/en/list/145/"], ["Argentina – největší vývozce sójového šrotu a sójového oleje na světě (USDA FAS, Oilseeds and Products Annual 2025)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Oilseeds+and+Products+Annual_Buenos+Aires_Argentina_AR2025-0006"], ["Maté: nápoj z listů stromu Ilex paraguariensis (12–16 m, prales u řeky Paraná), pije se z kalabasy brčkem bombilla; Argentina největší producent a vývozce yerby maté; zákon 26.871 z roku 2013 – národní nápoj (vláda Argentiny)", "https://www.argentina.gob.ar/pais/mate"], ["Vývoz Argentiny 2025: sójový komplex 21 442 mil. USD = 24,6 % vývozu, největší položka (INDEC, Complejos exportadores 2025)", "https://www.indec.gob.ar/uploads/informesdeprensa/complejos_03_2686A1604947.pdf"], ["Poloostrov Valdés: přes 1 500 velryb jižních ročně, nejdůležitější místo pro jejich rozmnožování; desítky tisíc hnízdících tučňáků magellanských (UNESCO)", "https://whc.unesco.org/en/list/937/"], ["Nandu pampový – největší pták Jižní Ameriky, neumí létat, žije na pampách (National Geographic)", "https://www.nationalgeographic.com/animals/birds/facts/greater-rhea"], ["Tango – vytvořili ho chudší obyvatelé měst Buenos Aires a Montevideo; hudba, tanec a poezie; nehmotné dědictví UNESCO 2009", "https://ich.unesco.org/en/RL/tango-00258"], ["Asado – hlavní jídlo argentinské kuchyně, neděle s rodinou u roštu (parrilla); pampa je kolébkou kultury gaučů, kde asado nesmí chybět (vláda Argentiny)", "https://www.argentina.gob.ar/jefatura/turismo/viaja-por-argentina/asado"], ["Mistři světa ve fotbale: Uruguay 1930 (finále s Argentinou 4 : 2) a 1950 (Brazílie 2 : 1 na Maracanã), Argentina 1978, 1986 a 2022 (penalty s Francií, Zlatý míč Messi, stejně jako 2014); MS 2026 vyhrálo Španělsko ve finále s Argentinou 1 : 0 po prodloužení (Britannica)", "https://www.britannica.com/sports/World-Cup-football"], ["Slunce května (Sol de Mayo) na argentinské vlajce: 32 paprsků, podle první argentinské mince z roku 1813; Slunce května je i na vlajce Uruguaye (vláda města Buenos Aires)", "https://buenosaires.gob.ar/gcaba_historico/noticias/dia-de-la-bandera-como-debe-representarse-el-sol-de-mayo-en-la-insignia"], ["Muzikál Evita – premiéra v Londýně 21. 6. 1978, film 1996 s Madonnou (Andrew Lloyd Webber, oficiální stránky)", "https://www.andrewlloydwebber.com/show/evita"], ["Ohňová země – jméno dali mořeplavci podle ohňů, které pálili původní obyvatelé Yámanové (Národní parky Argentiny)", "https://www.argentina.gob.ar/parquesnacionales/tierradelfuego"], ["Pampy: nandu (Rhea americana), jelenec pampový, na které číhali jaguáři a pumy (vláda města Buenos Aires)", "https://buenosaires.gob.ar/contenidos-educativos/fauna-pampeana-pasado-presente-y-futuro"], ["Maté – nápoj z listů Ilex paraguariensis, běžný hlavně v Argentině, Paraguayi, Uruguayi a jižní Brazílii; pije se z tykve kovovým brčkem bombilla (Britannica)", "https://www.britannica.com/topic/mate-beverage"], ["Messi – Zlatý míč pro nejlepšího hráče MS 2022 v Kataru, podruhé po Brazílii 2014; finále s Francií vyhráno na penalty (Argentinský fotbalový svaz AFA)", "https://www.afa.com.ar/Sitio/posts/messi-distinguido-por-la-fifa-con-el-balon-de-oro-de-qatar-2022"], ["Kongres v Tucumánu 9. 7. 1816 vyhlásil rozchod se španělskou monarchií; stalo se to v Casa de Tucumán (vláda Argentiny)", "https://www.argentina.gob.ar/noticias/9-de-julio-de-1816-declaracion-de-la-independencia-de-la-argentina"]], "hesla": ["TUČŇÁK 80", "PAMPA 47", "TANGO 56", "GAUČO 28", "ASADO 60", "TANGO 35", "ASADO 91", "TANGO 12", "KŮŇ 88", "PAMPA 72", "VELRYBA 65", "PAMPA 97", "LASO 79", "GAUČO 32", "KŮŇ 77", "LEDOVEC 14", "ASADO 33", "KONDOR 51", "KŮŇ 99", "LASO 29", "TUČŇÁK 31", "VELRYBA 84", "LEDOVEC 25", "GAUČO 76", "LASO 11", "KONDOR 58", "VELRYBA 15", "LEDOVEC 34", "KONDOR 30", "TUČŇÁK 24"]}, {"k": "uruguay", "n": "Uruguay", "ne": "Uruguay", "x": 606.9, "y": 803.6, "obl": "jih", "povinny": false, "rodic": "argentina", "prechod": 0, "typicky": "Malá země pastvin a stád u La Platy – první mistr světa ve fotbale.", "hm": "Montevideo", "hmk": "Montevideo", "obyv": "asi 3,5 milionu", "obyvRok": 2023, "jazyk": "španělština", "mena": "uruguayské peso", "poloha": "Malá země mezi Brazílií a Argentinou, na břehu La Platy a Atlantského oceánu.", "podnebi": "", "srovnani": null, "pojem": "kreol – potomek evropských, hlavně španělských osadníků, který se narodil už v Americe.", "rozloha": "asi 175 000 km²", "rozlohaCz": "2× větší než Česko", "uvidis": [{"nazev": "Pastviny a stáda", "druh": "priroda", "text": "Když projíždíš Uruguayem, uvidíš na pastvinách spoustu krav a býků. V roce 2024 tu bylo přes 11 milionů kusů hovězího dobytka – víc než třikrát víc, než je v zemi lidí. Hovězí maso je pro Uruguay nejdůležitější zboží, které prodává do ciziny. V roce 2025 tvořilo pětinu celého vývozu. Maso odsud putuje do Evropy už od roku 1865."}, {"nazev": "Cabo Polonio", "druh": "priroda", "text": "Na východním pobřeží leží národní park Cabo Polonio. Jsou tu pohyblivé písečné duny vyšší než 20 m, maják a vesnička, kde žije jen asi 70 lidí. Na skalách u majáku a na ostrůvcích před pobřežím odpočívají lachtani. Žije tu skoro polovina všech lachtanů Uruguaye. V létě, kdy mají mláďata, je kolonie opravdu hlučná."}, {"nazev": "Montevideo", "druh": "mesto", "text": "Hlavní město leží na břehu La Platy. Podle sčítání z roku 2023 žije v departementu Montevideo, tedy ve městě a jeho okolí, 1 302 954 lidí – skoro 4 z každých 10 obyvatel Uruguaye. O nedělích a svátcích tu ve čtvrtích Sur, Palermo a Cordón duní bubny candombe."}, {"nazev": "Colonia del Sacramento", "druh": "pamatka", "text": "Městečko leží na malém poloostrově na břehu La Platy, přímo naproti Buenos Aires. Založili ho Portugalci v roce 1680 a Portugalsko a Španělsko se o ně dlouho přetahovaly. Ulice tu nevedou v pravidelné šachovnici jako ve španělských městech, ale kroutí se podle terénu. Dlážděné uličky s nízkými domky a starý maják jsou dnes památkou UNESCO."}], "zvirata": [{"nazev": "Lachtani", "text": "Na skalách u Cabo Polonio žijí dva druhy lachtanů. Je tu i jediná kolonie lachtanů jihoamerických na pevnině celé Uruguaye.", "foto": {"src": "img/d_jiz_lachtani.jpg", "autor": "Okta30", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Sea-lions-Cabo-Polonio-Tania-Malrechauffe.jpg"}}, {"nazev": "Hovězí dobytek", "text": "Kusů hovězího dobytka je v Uruguayi přes 11 milionů – víc než třikrát víc než lidí.", "foto": {"src": "img/d_jiz_uru_skot.jpg", "autor": "Vqs", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Campo_-_Paso_de_los_Toros_-_panoramio.jpg"}}], "zivi": "Nejvíc vydělá Uruguay na hovězím mase – v roce 2025 tvořilo 20 % vývozu. Druhá je celulóza (17 %), surovina ze dřeva na výrobu papíru, a třetí sója (11 %). Skoro všechnu elektřinu (99 % v roce 2024) vyrábí z obnovitelných zdrojů – z vody, větru, slunce a zbytků rostlin.", "kultura": ["V roce 1930 pořádal Uruguay úplně první mistrovství světa ve fotbale a ve finále porazil Argentinu 4 : 2.", "Candombe je bubnování potomků Afričanů v Montevideu. Průvody bubeníků procházejí ulicemi o nedělích a svátcích. Od roku 2009 je candombe nehmotným dědictvím UNESCO.", "Tango vzniklo mezi chudšími obyvateli Montevidea a Buenos Aires. Uruguay se o ně dělí s Argentinou."], "zapamatuj": ["Montevideo – hlavní město", "víc hovězího dobytka než lidí", "první mistr světa (1930)", "bubny candombe a tango"], "vic": ["Uruguay je dvojnásobným mistrem světa. Druhý titul vybojoval v roce 1950 v Brazílii, když v rozhodujícím zápase porazil domácí Brazílii 2 : 1 na stadionu Maracanã.", "Na uruguayské vlajce svítí Slunce května – stejný symbol jako na vlajce Argentiny.", "Ve městě Fray Bentos stojí stará továrna na maso. Od roku 1865 odsud do Evropy putoval masový výtažek a hovězí konzervy. Dnes je z ní muzeum a památka UNESCO."], "ukoly": [{"typ": "vyber", "otazka": "Proč Uruguay vydělá nejvíc na vývozu hovězího masa?", "moznosti": ["Je tam moc zima, než aby tam rostla tráva", "Krávy sem každý rok připlavou z Argentiny", "Nemá moře, a nemůže tedy lovit ryby", "Většinu země pokrývají pastviny pro dobytek"], "spravne": 3, "napoveda": "Přečti si první tři věty „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "V Uruguayi žije víc kusů hovězího dobytka než lidí.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "vyber", "otazka": "Co se stalo v Uruguayi v roce 1930?", "moznosti": ["první mistrovství světa ve fotbale", "první olympijské hry v Jižní Americe", "velké zemětřesení u Montevidea", "stavba obří přehrady na řece"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“ a zápis."}], "hadanka": ["Na mé vlajce svítí Slunce května, stejně jako na vlajce Argentiny.", "Mám víc než třikrát víc kusů hovězího dobytka než lidí.", "V roce 1930 jsem pořádal a vyhrál první mistrovství světa ve fotbale."], "par": {"vec": "bubny candombe", "zvire": "lachtani z Cabo Polonio"}, "fotky": [{"src": "img/ju_centenario.jpg", "autor": "Ismael Cordero", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AEstadio_Centenario%2C_Montevideo%2C_Uruguay.JPG", "cap": "Stadion Centenario v Montevideu"}, {"src": "img/d_jiz_uru_skot.jpg", "autor": "Vqs", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Campo_-_Paso_de_los_Toros_-_panoramio.jpg", "cap": "Hovězí dobytek na uruguayské pastvině"}, {"src": "img/d_jiz_lachtani.jpg", "autor": "Okta30", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Sea-lions-Cabo-Polonio-Tania-Malrechauffe.jpg", "cap": "Lachtani v Cabo Polonio"}, {"src": "img/c_uru_colonia.jpg", "autor": "Photograph by Mike Peel ( www.mikepeel.net ).", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AColonia_del_Sacramento_2016_039.jpg", "cap": "Colonia del Sacramento u La Platy"}, {"src": "img/c_uru_rambla.jpg", "autor": "Ermell", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AMontevideo_Rambla-20110506-RM-120836.jpg", "cap": "Nábřeží v Montevideu"}], "kratce": ["Uruguay je malá země pastvin u La Platy a Atlantského oceánu.", "Hovězího dobytka je tu přes 11 milionů kusů – přes třikrát víc než lidí.", "Nejvíc Uruguay vydělá na vývozu hovězího masa.", "V roce 1930 pořádal a vyhrál úplně první mistrovství světa ve fotbale.", "U Cabo Polonio odpočívají lachtani a v Montevideu duní bubny candombe."], "zapis": ["[Montevideo] – hlavní město", "víc [dobytka] než lidí", "[1930] – první mistrovství světa ve fotbale", "bubny [candombe]"], "temata": {"priroda": {"polozky": [{"nazev": "Cabo Polonio", "text": "Na východním pobřeží leží národní park Cabo Polonio. Jsou tu pohyblivé písečné duny vyšší než 20 m, maják a vesnička, kde žije jen asi 70 lidí."}, {"nazev": "Lachtani", "text": "Na skalách u majáku a na ostrůvcích před pobřežím odpočívají lachtani dvou druhů. Žije tu skoro polovina všech lachtanů Uruguaye. V létě, kdy mají mláďata, je kolonie opravdu hlučná."}], "otazka": {"typ": "vyber", "otazka": "Proč je v létě kolonie lachtanů u Cabo Polonio tak hlučná?", "moznosti": ["Protože lachtani mají v létě mláďata", "Protože se tam v létě konají koncerty", "Protože v létě přilétají hejna racků", "Protože v létě fouká silný vítr"], "spravne": 0, "napoveda": "Přečti si položku „Lachtani“."}}, "hospodarstvi": {"polozky": [{"nazev": "Dobytek a hovězí maso", "text": "V roce 2024 bylo v Uruguayi přes 11 milionů kusů hovězího dobytka – víc než třikrát víc než lidí. Hovězí maso je nejdůležitější zboží, které země prodává do ciziny: v roce 2025 tvořilo 20 % vývozu. Do Evropy odsud maso putuje už od roku 1865."}, {"nazev": "Celulóza a sója", "text": "Na druhém místě ve vývozu je celulóza (17 %) – surovina ze dřeva na výrobu papíru. Třetí je sója (11 %)."}, {"nazev": "Elektřina z přírody", "text": "Skoro všechnu elektřinu (99 % v roce 2024) vyrábí Uruguay z obnovitelných zdrojů. Využívá k tomu vodu, vítr, slunce a zbytky rostlin."}], "otazka": {"typ": "pravda", "tvrzeni": "Uruguay vyrábí skoro všechnu elektřinu z uhlí.", "pravda": false, "napoveda": "Přečti si položku „Elektřina z přírody“."}}, "kultura": {"polozky": [{"nazev": "Candombe", "text": "Candombe je bubnování potomků Afričanů v Montevideu. Průvody bubeníků procházejí ulicemi čtvrtí Sur, Palermo a Cordón o nedělích a svátcích. Od roku 2009 je candombe nehmotným dědictvím UNESCO."}, {"nazev": "Tango", "text": "Tango vzniklo mezi chudšími obyvateli Montevidea a Buenos Aires. Uruguay se o ně dělí s Argentinou a od roku 2009 patří k nehmotnému dědictví UNESCO."}, {"nazev": "Montevideo", "text": "Hlavní město leží na břehu La Platy. Podle sčítání z roku 2023 žije v departementu Montevideo, tedy ve městě a jeho okolí, 1 302 954 lidí – skoro 4 z každých 10 obyvatel Uruguaye."}], "otazka": {"typ": "pravda", "tvrzeni": "Candombe je bubnování, které patří k nehmotnému dědictví UNESCO.", "pravda": true, "napoveda": "Přečti si položku „Candombe“."}}, "sport": {"polozky": [{"nazev": "První mistr světa", "text": "V roce 1930 pořádal Uruguay úplně první mistrovství světa ve fotbale. Hrálo se v Montevideu a ve finále Uruguay porazil Argentinu 4 : 2."}, {"nazev": "Zázrak na Maracanã", "text": "Druhý titul mistra světa vybojoval Uruguay v roce 1950 v Brazílii. V rozhodujícím zápase porazil domácí Brazílii 2 : 1 na stadionu Maracanã."}], "otazka": {"typ": "vyber", "otazka": "Kolikrát se Uruguay stal mistrem světa ve fotbale?", "moznosti": ["jednou", "dvakrát", "třikrát", "čtyřikrát"], "spravne": 1, "napoveda": "Přečti si obě položky o fotbale."}}, "historie": {"polozky": [{"nazev": "Nezávislost 1825", "text": "Dne 25. srpna 1825 se ve městě Florida sešli zástupci Východní provincie, jak se tehdy dnešní Uruguay jmenoval. Prohlásili, že neuznávají připojení své země k Portugalsku a Brazílii. Tento den se dnes slaví jako vyhlášení nezávislosti. Samostatným státem se Uruguay stal v roce 1828."}, {"nazev": "Colonia del Sacramento", "text": "Městečko leží na břehu La Platy přímo naproti Buenos Aires. Založili ho Portugalci v roce 1680 a Portugalsko a Španělsko se o ně dlouho přetahovaly. Dlážděné uličky s nízkými domky a starý maják jsou dnes památkou UNESCO."}, {"nazev": "Fray Bentos", "text": "Ve městě Fray Bentos stojí stará továrna na maso. Od roku 1865 odsud do Evropy putoval masový výtažek a hovězí konzervy. Dnes je z ní muzeum a památka UNESCO."}, {"nazev": "Slunce května", "text": "Na uruguayské vlajce svítí Slunce května – stejný symbol jako na vlajce Argentiny. Poprvé se objevilo na argentinských mincích z roku 1813."}], "otazka": {"typ": "vyber", "otazka": "Ke kterým zemím byl Uruguay připojený, než v roce 1825 vyhlásil nezávislost?", "moznosti": ["k Portugalsku a Brazílii", "ke Španělsku a Francii", "k Argentině a Chile", "k Anglii a Nizozemsku"], "spravne": 0, "napoveda": "Přečti si položku „Nezávislost 1825“."}}}, "zdroje": [["Sčítání 2023: Uruguay 3 499 451 obyvatel, departement Montevideo 1 302 954 (OPP, vláda Uruguaye)", "https://www.opp.gub.uy/es/noticias/censo-nacional-2023-contabilizo-3499451-habitantes-en-uruguay"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Stav skotu v červnu 2024: 11,32 mil. kusů (MGAP, ministerstvo zemědělství Uruguaye)", "https://descargas.mgap.gub.uy/OPYPA/Anuarios/Anuarioopypa2024/CP/2/CP2web/CP2-Cadenadelacarne.pdf"], ["Vývoz Uruguaye 2025: hovězí maso 20 %, celulóza 17 %, sója 11 % (Prezidentský úřad Uruguaye podle Uruguay XXI)", "https://www.gub.uy/presidencia/comunicacion/noticias/exportaciones-bienes-alcanzaron-su-mayor-nivel-decada"], ["Průmyslová krajina Fray Bentos: vývoz masového výtažku a konzerv do Evropy od 1865 (UNESCO)", "https://whc.unesco.org/en/list/1464/"], ["NP Cabo Polonio: pohyblivé duny přes 20 m, na ostrovech skoro polovina uruguayských lachtanů, jediná pevninská kolonie lachtanů jihoamerických, vesnice asi 70 lidí (ministerstvo životního prostředí Uruguaye)", "https://www.gub.uy/ministerio-ambiente/politicas-y-gestion/parque-nacional-cabo-polonio-rocha"], ["Lachtani u majáku Cabo Polonio, dva druhy, v létě v době mláďat velmi hluční (turistický portál departementu Rocha)", "https://turismorocha.gub.uy/atractivos/naturaleza/reserva-de-lobos-marinos"], ["Sčítání 2023: Uruguay 3 499 451 obyvatel, Montevideo 1 302 954 (OPP, vláda Uruguaye)", "https://www.opp.gub.uy/es/noticias/censo-nacional-2023-contabilizo-3499451-habitantes-en-uruguay"], ["Tango – vytvořili ho chudší obyvatelé měst Buenos Aires a Montevideo; hudba, tanec a poezie; nehmotné dědictví UNESCO 2009", "https://ich.unesco.org/en/RL/tango-00258"], ["Candombe – bubnování ve čtvrtích Sur, Palermo a Cordón v Montevideu, tradice rodin afrického původu, UNESCO 2009", "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182"], ["Mistři světa ve fotbale: Uruguay 1930 (finále s Argentinou 4 : 2) a 1950 (Brazílie 2 : 1 na Maracanã), Argentina 1978, 1986 a 2022 (penalty s Francií, Zlatý míč Messi, stejně jako 2014); MS 2026 vyhrálo Španělsko ve finále s Argentinou 1 : 0 po prodloužení (Britannica)", "https://www.britannica.com/sports/World-Cup-football"], ["Colonia del Sacramento: založena Portugalci 1680, naproti Buenos Aires, památka UNESCO", "https://whc.unesco.org/en/list/747/"], ["Energetická bilance 2024: 99 % elektřiny z obnovitelných zdrojů – voda, vítr, biomasa, slunce (Prezidentský úřad Uruguaye)", "https://www.gub.uy/presidencia/comunicacion/noticias/industria-presento-balance-energetico-nacional-2024"], ["Slunce května (Sol de Mayo) na argentinské vlajce: 32 paprsků, podle první argentinské mince z roku 1813; Slunce května je i na vlajce Uruguaye (vláda města Buenos Aires)", "https://buenosaires.gob.ar/gcaba_historico/noticias/dia-de-la-bandera-como-debe-representarse-el-sol-de-mayo-en-la-insignia"], ["25. 8. 1825 ve Floridě: zákon o nezávislosti prohlásil za neplatné připojení Východní provincie k Portugalsku a Brazílii (ministerstvo školství a kultury Uruguaye)", "https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/25-agosto-1825-declaratoria-independencia-0"], ["Uruguay slaví výročí Declaratoria de la Independencia z 25. 8. 1825 (Prezidentský úřad Uruguaye)", "https://www.gub.uy/presidencia/comunicacion/noticias/declaratoria-independencia-2025"], ["Uruguay se stal samostatným státem v roce 1828 (Britannica)", "https://www.britannica.com/place/Uruguay"]], "hesla": ["STADION 58", "TROFEJ 56", "DRES 69", "FANOUŠEK 92", "DRES 97", "TRIBUNA 81", "BRANKA 71", "HŘIŠTĚ 85", "KOPAČKA 50", "FANOUŠEK 35", "STADION 31", "TRIBUNA 63", "TROFEJ 30", "FANOUŠEK 73", "PÍŠŤALKA 11", "HŘIŠTĚ 98", "GÓL 77", "PÍŠŤALKA 88", "BRANKA 15", "TROFEJ 33", "DRES 21", "GÓL 49", "TRIBUNA 99", "KOPAČKA 44", "GÓL 28", "BRANKA 23", "HŘIŠTĚ 68", "PÍŠŤALKA 12", "KOPAČKA 45", "STADION 24"]}, {"k": "paraguay", "n": "Paraguay", "ne": "Paraguay", "x": 590.3, "y": 646.4, "obl": "jih", "povinny": false, "rodic": "argentina", "prechod": 0, "typicky": "Vnitrozemský stát bez moře s obří přehradou Itaipú, dvěma úředními jazyky a studeným tereré.", "hm": "Asunción", "hmk": "Asunción", "obyv": "asi 6 milionů", "obyvRok": 2022, "jazyk": "španělština a guaraní", "mena": "guaraní", "poloha": "Vnitrozemský stát bez moře mezi Argentinou, Brazílií a Bolívií; protéká jím řeka Paraguay a část hranic tvoří řeka Paraná.", "podnebi": "", "srovnani": null, "pojem": "", "rozloha": "asi 407 000 km²", "rozlohaCz": "5× větší než Česko", "uvidis": [{"nazev": "Řeky Paraguay a Paraná", "druh": "priroda", "text": "Paraguay nemá moře. Jeho cestou k oceánu jsou dvě velké řeky – Paraguay a Paraná. Hlavní město Asunción leží přímo na břehu řeky Paraguay. Po řekách plují nákladní čluny se sójou a dalším zbožím do přístavů, odkud pokračuje do světa. Když je sucho a hladina řek klesne, naloží čluny jen asi 70 % nákladu, aby nenajely na dno. Pro celou zemi je to pak problém."}, {"nazev": "Gran Chaco", "druh": "priroda", "text": "Západ Paraguaye zabírá Chaco – rozlehlá rovina se suchými lesy a křovinami. Lidí tu žije málo. Velký kus severu UNESCO v roce 2005 vyhlásilo biosférickou rezervací, tedy chráněným územím. Žijí tu ohrožená zvířata, například jaguár, tapír, pásovec velký nebo guanako. V posledních letech ale v Chaku přibývá farem s dobytkem."}, {"nazev": "Přehrada Itaipú", "druh": "technika", "text": "Na řece Paraná, na hranici s Brazílií, stojí obrovská vodní elektrárna Itaipú. Postavily ji společně Paraguay a Brazílie. Hlavní hráz je vysoká 196 m – jako dům s 65 patry. Betonu se na stavbu spotřebovalo tolik, že by z něj šlo postavit 210 stadionů velkých jako slavná Maracanã v Riu de Janeiro. Elektřinu vyrábí 20 obřích turbín a Paraguayi pokryje skoro čtyři pětiny (78 %) spotřeby."}], "zvirata": [{"nazev": "Jaguár", "text": "Největší kočkovitá šelma Ameriky se skvrnitou srstí. V suchých lesích Chaka patří k ohroženým zvířatům.", "foto": {"src": "img/d_jiz_jaguar.jpg", "autor": "Charles J. Sharp", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Jaguar_(Panthera_onca_palustris)_male_Three_Brothers_River_2.jpg"}}, {"nazev": "Tapír", "text": "Velký býložravec s krátkým pohyblivým chobotem. I on je v Chaku ohrožený."}, {"nazev": "Cesmína paraguayská", "text": "Strom, z jehož listů se dělá maté i tereré. Vědecky se jmenuje Ilex paraguariensis – „paraguayská“. Roste v pralesích v povodí řeky Paraná a ve volné přírodě dorůstá 12 až 16 m."}], "zivi": "Paraguay pěstuje hlavně sóju – v sezoně 2025/26 sklidil rekordních asi 12 milionů tun a většinu prodal do ciziny. Chová také skoro 13 milionů kusů hovězího dobytka a vyváží hovězí maso. Elektřinu mu dodává hlavně přehrada Itaipú.", "kultura": ["Pije se tu tereré: maté se nezalévá horkou vodou, ale studenou vodou s léčivými bylinkami rozdrcenými v hmoždíři. Od roku 2020 je tereré nehmotným dědictvím UNESCO.", "Guaraní, jazyk původních obyvatel, je v Paraguayi úředním jazykem vedle španělštiny a mluví jím víc lidí než španělsky. Guaraní se jmenují i zdejší peníze."], "zapamatuj": ["Asunción – hlavní město", "vnitrozemský stát bez moře", "guaraní – jazyk i peníze", "Itaipú – obří přehrada"], "vic": ["Ze železa a oceli, které se spotřebovaly na stavbu Itaipú, by šlo postavit 380 Eiffelových věží.", "Ústava z roku 1992 říká, že Paraguay je dvojjazyčná země: úředními jazyky jsou španělština a guaraní.", "V Paraguayi stojí zříceniny jezuitských misií Trinidad a Jesús. V 17. a 18. století tu kněží z řádu jezuitů žili s indiány Guaraní. Dnes jsou misie památkou UNESCO."], "ukoly": [{"typ": "vyber", "otazka": "Proč jsou pro Paraguay tak důležité řeky Paraguay a Paraná?", "moznosti": ["Země nemá moře, a tak po nich vozí zboží k oceánu", "Těží se v nich měď a lithium pro celý svět", "Žijí v nich velryby, za kterými jezdí turisté", "Vede po nich hranice s Chile a s Peru"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "V Paraguayi je jediným úředním jazykem španělština.", "pravda": false, "napoveda": "Podívej se do základních údajů a do zápisu."}, {"typ": "vyber", "otazka": "Proč mohla na řece Paraná vzniknout obří vodní elektrárna Itaipú?", "moznosti": ["Nad řekou stále fouká silný vítr", "Řekou teče obrovské množství vody", "Řekou teče horká voda ze sopek", "Řeku každý den zvedá mořský příliv"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“ – větu o elektrárně Itaipú."}], "hadanka": ["Moje peníze se jmenují stejně jako jeden z mých úředních jazyků.", "S Brazílií se dělím o obří vodní elektrárnu Itaipú.", "Nemám moře a piju studené tereré."], "par": {"vec": "tereré", "zvire": "tapír z Chaka"}, "fotky": [{"src": "img/c_par_itaipu.jpg", "autor": "International Hydropower Association (IHA)", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AItaipu_Aerea.jpg", "cap": "Přehrada Itaipú na řece Paraná"}, {"src": "img/d_jiz_terere.jpg", "autor": "TitiNicola", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Terer%C3%A9_-_infusi%C3%B3n_2.jpg", "cap": "Tereré – studené maté s bylinkami"}, {"src": "img/c_par_reka.jpg", "autor": "P. S. F. Freitas", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AAsunci%C3%B3n_skyline_from_Chaco%27i.jpg", "cap": "Asunción od řeky Paraguay"}, {"src": "img/d_jiz_chaco.jpg", "autor": "Ilosuna", "lic": "CC BY 1.0", "page": "https://commons.wikimedia.org/wiki/File:Chaco_Boreal_Paraguay.jpg", "cap": "Krajina Gran Chaco"}, {"src": "img/c_par_asuncion.jpg", "autor": "Stefano Vigorelli", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File%3APalacio_de_los_Lopez%2C_Asunci%C3%B3n_PAR%281%29.jpg", "cap": "Palác López v Asunciónu"}], "kratce": ["Paraguay je vnitrozemský stát bez moře.", "Zboží vozí čluny po řekách Paraguay a Paraná směrem k oceánu.", "Na řece Paraná, kterou teče obrovské množství vody, postavil Paraguay s Brazílií obří vodní elektrárnu Itaipú.", "Na západě leží suchá rovina Chaco, kde žijí jaguár a tapír.", "Pije se tu tereré – maté se studenou vodou a léčivými bylinkami."], "zapis": ["[Asunción] – hlavní město", "[vnitrozemský] stát bez moře", "[guaraní] – jazyk i peníze", "přehrada [Itaipú] na řece Paraná"], "temata": {"priroda": {"polozky": [{"nazev": "Řeky Paraguay a Paraná", "text": "Paraguay nemá moře, a tak je jeho cestou k oceánu dvojice velkých řek. Hlavní město Asunción leží přímo na břehu řeky Paraguay. Když je sucho a hladina klesne, naloží nákladní čluny jen asi 70 % nákladu, aby nenajely na dno."}, {"nazev": "Gran Chaco", "text": "Západ země zabírá Chaco – rozlehlá rovina se suchými lesy a křovinami. Velký kus severu vyhlásilo UNESCO v roce 2005 biosférickou rezervací, tedy chráněným územím. Žijí tu ohrožená zvířata, například jaguár, tapír, pásovec velký nebo guanako."}, {"nazev": "Cesmína paraguayská", "text": "Z listů tohoto stromu se dělá maté i tereré. Vědecky se jmenuje Ilex paraguariensis – „paraguayská“. Roste v pralesích v povodí řeky Paraná a ve volné přírodě dorůstá 12 až 16 m."}], "otazka": {"typ": "pravda", "tvrzeni": "V Chaku žijí ohrožená zvířata, třeba jaguár a tapír.", "pravda": true, "napoveda": "Přečti si položku „Gran Chaco“."}}, "hospodarstvi": {"polozky": [{"nazev": "Sója", "text": "Paraguay pěstuje hlavně sóju – v sezoně 2025/26 sklidil rekordních asi 12 milionů tun. Většinu prodá do ciziny, nejvíc do Argentiny. Náklad vozí čluny po řekách."}, {"nazev": "Dobytek", "text": "V Paraguayi se chová skoro 13 milionů kusů hovězího dobytka a země vyváží hovězí maso. V posledních letech přibývá farem s dobytkem v Chaku."}, {"nazev": "Přehrada Itaipú", "text": "Na řece Paraná stojí vodní elektrárna Itaipú, kterou postavily společně Paraguay a Brazílie. Hlavní hráz je vysoká 196 m – jako dům s 65 patry. Z oceli na její stavbu by šlo postavit 380 Eiffelových věží. Elektřina z jejích 20 obřích turbín pokryje skoro čtyři pětiny (78 %) spotřeby Paraguaye."}], "otazka": {"typ": "vyber", "otazka": "Jakou část elektřiny Paraguaye vyrobí přehrada Itaipú?", "moznosti": ["skoro čtyři pětiny", "asi jednu desetinu", "přesně polovinu", "úplně všechnu"], "spravne": 0, "napoveda": "Přečti si položku „Přehrada Itaipú“."}}, "kultura": {"polozky": [{"nazev": "Tereré", "text": "Pije se tu tereré: maté se nezalévá horkou vodou, ale studenou vodou s léčivými bylinkami rozdrcenými v hmoždíři. Od roku 2020 je tereré nehmotným dědictvím UNESCO."}, {"nazev": "Guaraní", "text": "Guaraní je jazyk původních obyvatel a mluví jím většina lidí v Paraguayi – víc než španělsky. Podle ústavy z roku 1992 je Paraguay dvojjazyčná země: úředními jazyky jsou španělština a guaraní. Guaraní se jmenují i zdejší peníze."}], "otazka": {"typ": "pravda", "tvrzeni": "Tereré je horký nápoj, který se pije hlavně v zimě.", "pravda": false, "napoveda": "Přečti si položku „Tereré“."}}, "sport": {"polozky": [{"nazev": "Copa América", "text": "Paraguay vyhrál Copa América, mistrovství Jižní Ameriky ve fotbale, dvakrát. Poprvé se mu to podařilo v roce 1953 v Peru, podruhé v roce 1979."}, {"nazev": "Muzeum fotbalu", "text": "Ve městě Luque stojí muzeum jihoamerického fotbalu. Patří konfederaci CONMEBOL, která pořádá Copa América."}], "otazka": {"typ": "vyber", "otazka": "Ve kterých letech vyhrál Paraguay Copa América?", "moznosti": ["1953 a 1979", "1930 a 1950", "2015 a 2016", "1978 a 1986"], "spravne": 0, "napoveda": "Přečti si položku „Copa América“."}}, "historie": {"polozky": [{"nazev": "Nezávislost 1811", "text": "V noci ze 14. na 15. května 1811 povstali v Asunciónu paraguayští důstojníci a obsadili kasárna. Španělského guvernéra Velasca donutili, aby se vzdal moci. Skončilo tak 276 let španělské vlády."}, {"nazev": "Jezuitské misie", "text": "V Paraguayi stojí zříceniny jezuitských misií Trinidad a Jesús. V 17. a 18. století tu kněží z řádu jezuitů žili s indiány Guaraní. Dnes jsou misie památkou UNESCO."}], "otazka": {"typ": "pravda", "tvrzeni": "Paraguay se zbavil španělské vlády v roce 1811.", "pravda": true, "napoveda": "Přečti si položku „Nezávislost 1811“."}}}, "zdroje": [["INE Paraguay, sčítání 2022 (6 109 903 lidí)", "https://www.ine.gov.py/noticias/2101/principales-resultados-finales-del-censo-2022"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Laplatská nížina mezi Andami, Brazilskou vysočinou a Atlantským oceánem, v povodí Paraná a Uruguay (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/Laplatsk%C3%A1+n%C3%AD%C5%BEina"], ["povodí La Platy tvoří řeky Paraná, Paraguay a Uruguay; patří do něj celá Paraguay; povodí řeky Paraguay zahrnuje roviny Chaco (OAS, La Plata River Basin, 2005)", "https://www.oas.org/en/sedi/dsd/iwrm/Past_Projects/Documents/LaPlata_Brochure.pdf"], ["Chaco – suché lesy, biosférická rezervace UNESCO (převzato ze hry)", "https://www.unesco.org/en/mab/el-chaco"], ["Paraguay: sója 2025/26 asi 10,9 mil. t, vývoz 7,2 mil. t; vnitrozemský stát vozí zboží čluny po řekách Paraguay a Paraná, při nízké vodě náklad jen 70 % (USDA FAS, Oilseeds and Products Annual 2025)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Oilseeds+and+Products+Annual_Buenos+Aires_Paraguay_PA2025-0001.pdf"], ["Paraguay: vnitrozemský stát; lodě na řece Paraguay v Asunciónu; guaraní úředním jazykem od ústavy 1992 a v zemi rozšířenější než španělština (Britannica)", "https://www.britannica.com/place/Paraguay"], ["Biosférická rezervace El Chaco (2005): 4,6 mil. ha suchých lesů na severu Paraguaye; ohrožený jaguár, tapír, pásovec velký, guanako (UNESCO, program Člověk a biosféra)", "https://www.unesco.org/en/mab/el-chaco"], ["Paraguay: 12,83 mil. kusů skotu (SENACSA 2025), vývozce hovězího, nové farmy v Chaku (USDA FAS, Livestock and Products Annual 2025)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Livestock+and+Products+Annual_Buenos+Aires_Paraguay_PA2025-0003.pdf"], ["Itaipu em números – hráz 196 m (65 pater), beton na 210 stadionů Maracanã, ocel na 380 Eiffelových věží (Itaipu Binacional)", "https://www.itaipu.gov.br/sala-de-imprensa/itaipu-em-numeros"], ["Itaipú: 20 turbín, dodává 77,9 % elektřiny Paraguaye a 6,7 % Brazílie (Itaipu Binacional)", "https://www.itaipu.gov.br/energia/geracao"], ["Itaipú: přehrada na řece Paraná na hranici Brazílie a Paraguaye, postavená společně oběma zeměmi, 20 turbín, hráz 196 m (Britannica)", "https://www.britannica.com/topic/Itaipu-Dam"], ["Paraguay: rekordní sklizeň sóji 2025/26 asi 12,1 mil. t; vývoz 2026/27 odhadem 7,3 mil. t, o 1 mil. t méně než v roce 2025/26 (USDA FAS, Oilseeds and Products Annual 2026)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Oilseeds+and+Products+Annual_Buenos+Aires_Paraguay_PA2026-0002.pdf"], ["Paraguay: stádo skotu v roce 2026 odhadem 12,8 mil. kusů (USDA FAS, Livestock and Products Annual 2026)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Livestock+and+Products+Annual_Buenos+Aires_Paraguay_PA2026-0004.pdf"], ["Jaguár – největší kočkovitá šelma Ameriky, skvrnitá srst (National Geographic)", "https://www.nationalgeographic.com/animals/mammals/facts/jaguar"], ["Tapíři – býložravci s krátkým pohyblivým chobotem z nosu a horního pysku (National Geographic)", "https://www.nationalgeographic.com/animals/mammals/facts/tapirs"], ["Maté: nápoj z listů stromu Ilex paraguariensis (12–16 m, prales u řeky Paraná), pije se z kalabasy brčkem bombilla; Argentina největší producent a vývozce yerby maté; zákon 26.871 z roku 2013 – národní nápoj (vláda Argentiny)", "https://www.argentina.gob.ar/pais/mate"], ["Tereré – studená voda s léčivými bylinami Pohã Ñana drcenými v hmoždíři, zalévá se jí yerba maté; nehmotné dědictví UNESCO 2020", "https://ich.unesco.org/en/RL/practices-and-traditional-knowledge-of-terere-in-the-culture-of-poha-nana-guarani-ancestral-drink-in-paraguay-01603"], ["Ústava Paraguaye 1992, čl. 140: dvojjazyčná země, úřední jazyky španělština a guaraní (Constitute Project)", "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"], ["Jezuitské misie Trinidad a Jesús – památka UNESCO", "https://whc.unesco.org/en/list/648/"], ["Zákon o jazycích 4251/2010: guaraní je dorozumívacím jazykem většiny obyvatel Paraguaye (Observatorio Legislativo CELE, neúřední překlad)", "https://observatoriolegislativocele.com/en/paraguay-law-n4-251-promotion-of-the-two-languages-%E2%80%8B%E2%80%8Bof-paraguay-2010/"], ["Paraguay: hlavní město Asunción, úřední jazyky španělština a guaraní, měna guaraní (Britannica, Paraguay Facts)", "https://www.britannica.com/facts/Paraguay"], ["Paraguay mistrem Jižní Ameriky (Peru, 1953) (CONMEBOL, historická galerie)", "https://www.conmebol.com/galeria-historica/paraguay-campeon-de-america-peru1953-arriba-heribrto-herrera-angel-berni-atilio-lopez-ruben/"], ["Paraguay mistrem Jižní Ameriky 1979 (CONMEBOL, historická galerie)", "https://www.conmebol.com/galeria-historica/paraguay-campeon-de-america-1979-juan-espinola-juan-b-torales-flaminio-sosa-carlos-kiese/"], ["Paraguay získal v roce 1979 druhý titul Copa América (CONMEBOL Copa América)", "https://copaamerica.com/es/novedades/paraguay-conquista-su-segundo-titulo-en-1979"], ["Museo CONMEBOL – Luque, Paraguay (CONMEBOL)", "https://www.conmebol.com/museo-conmebol/"], ["V noci ze 14. na 15. 5. 1811 vyzvali povstalci guvernéra Velasca ke vzdání se moci; konec 276 let španělské vlády (město Asunción)", "https://www.asuncion.gov.py/historia-de-mis-calles/la-calle-independencia-nacional-rinde-homenaje-a-la-gesta-del-14-y-15-de-mayo-de-1811-poniendo-fin-a-doscientos-setenta-y-seis-anos-de-dominacion-espanola-en-paraguay"]], "hesla": ["JELEN 85", "HARFA 27", "ZVON 56", "MATÉ 64", "JELEN 60", "ČÁP 59", "HARFA 41", "PROUD 96", "VĚŽ 39", "PŘEHRADA 98", "PROUD 34", "ČÁP 80", "PROUD 14", "MATÉ 88", "TURBÍNA 82", "TURBÍNA 61", "JELEN 43", "TURBÍNA 29", "ČÁP 40", "PŘEHRADA 13", "ZVON 86", "VĚŽ 46", "MOST 72", "ZVON 92", "MOST 44", "MATÉ 51", "HARFA 19", "MOST 71", "VĚŽ 74", "PŘEHRADA 48"]}, {"k": "brazilie", "n": "Brazílie", "ne": "Brazil", "x": 745.9, "y": 497.5, "obl": "bra", "povinny": true, "rodic": null, "prechod": 0, "typicky": "Obří země s Amazonií, karnevalem v Riu, fotbalem a kávou.", "hm": "Brasília", "hmk": "Brasília", "obyv": "asi 213 milionů", "obyvRok": 2025, "jazyk": "portugalština", "mena": "brazilský real", "poloha": "Největší stát Jižní Ameriky; na východě ji omývá Atlantský oceán a severem prochází rovník.", "podnebi": "", "srovnani": null, "pojem": "favela – chudinská čtvrť v brazilských městech, často na svazích kopců, kde často chybí pitná voda, kanalizace nebo elektřina. Ve favelách žije asi 16 milionů Brazilců.", "rozloha": "8,5 mil. km²", "rozlohaCz": "108× větší než Česko", "uvidis": [{"nazev": "Amazonie a Amazonka", "druh": "priroda", "text": "Amazonie je největší tropický deštný les na světě. Protéká jí Amazonka – řeka, která odnese do oceánu 18 % vody ze všech řek světa. Žádná jiná řeka nemá tolik vody. Území, ze kterého voda do Amazonky stéká, zabírá asi třetinu Jižní Ameriky a leží v osmi státech. V pralese rostou vzácné stromy, například mahagon, který dorůstá výšky až kolem 70 m. V Brazílii je mahagon ohrožený, protože z lesů mizí."}, {"nazev": "Pantanal – říše zvířat", "druh": "priroda", "text": "Na jihozápadě Brazílie leží Pantanal – jeden z největších mokřadů světa. Měří asi 140 000 km², skoro dvakrát víc než Česko. Od října do dubna se řeky vylévají z břehů a zaplaví obrovské plochy. Žijí tu jaguáři, kajmani, mravenečníci velcí, vydry obrovské a také ara hyacintový, nejdelší papoušek na světě. Část Pantanalu chrání UNESCO jako světové dědictví."}, {"nazev": "Socha Krista Spasitele", "druh": "pamatka", "text": "Nad Riem de Janeiro stojí na hoře Corcovado socha Krista Spasitele s rozpaženýma rukama. I s podstavcem měří 38 m a stojí ve výšce 710 m nad mořem, a tak ji vidíš z mnoha míst ve městě. Sochu odhalili 12. 10. 1931. Pohled na zátoku, Cukrovou homoli a sochu Krista zná celý svět. Krajina Ria je od roku 2012 památkou UNESCO."}, {"nazev": "Rio de Janeiro a Copacabana", "druh": "mesto", "text": "Rio de Janeiro má 6,2 milionu obyvatel a je druhým největším městem Brazílie. Větší je jen São Paulo s 11,5 milionu. Rio leží mezi zalesněnými horami a Atlantským oceánem. Pod horami se táhnou pláže, nejslavnější z nich je Copacabana. Hlavním městem ale Rio není. Tím je Brasília, kterou postavili v letech 1956–1960 uprostřed země, daleko od pobřeží."}], "zvirata": [{"nazev": "Ara hyacintový", "text": "Nejdelší papoušek na světě. Je celý modrý, jen kolem oka má žlutý kroužek. Žije hlavně v Brazílii.", "foto": {"src": "img/d_bra_arahyacint.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Hyacinth_Macaw_(Anodorhynchus_hyacinthinus)_(27569556513).jpg"}}, {"nazev": "Tukan obrovský", "text": "Jeho zobák může být až čtyřikrát větší než hlava. Přesto je lehký, protože je uvnitř dutý, a tukan s ním dosáhne na ovoce i na tenkých větvičkách.", "foto": {"src": "img/d_bra_tukan.jpg", "autor": "AntanO", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Toco_toucan_(Ramphastos_toco)_close-up.jpg"}}, {"nazev": "Lenochod", "text": "Visí v korunách stromů hlavou dolů a prospí 15 až 18 hodin denně. V jeho srsti rostou řasy, a proto bývá nazelenalý.", "foto": {"src": "img/st_lenochod.jpg", "autor": "Charles J. Sharp", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3ABrown-throated_three-toed_sloth_female.JPG"}}], "zivi": "Brazílie vypěstuje skoro 40 % veškeré kávy na světě. Nejvíc peněz jí ale přináší vývoz ropy a sóji, na třetím místě je železná ruda. V letech 2024 a 2025 vydělala nejvíc na ropě, v roce 2026 zatím vede sója.", "kultura": ["Na karnevalu v Riu procházejí městem obrovské průvody škol samby – tanečních spolků, které se na karneval připravují celý rok. Každá škola si pro svůj průvod složí vlastní sambu, která vypráví jeho příběh.", "Brazílie vyhrála mistrovství světa ve fotbale pětkrát – nejvíc ze všech zemí. Slavný Pelé je jediný hráč, který se stal mistrem světa třikrát: v letech 1958, 1962 a 1970."], "zapamatuj": ["Brasília – hlavní město", "portugalština – úřední jazyk", "Amazonka – nejvodnatější řeka světa", "5× mistr světa ve fotbale"], "vic": ["Brazílie měří 8 510 420 km² a je pátým největším státem světa. Větší jsou jen Rusko, Kanada, USA a Čína. Druhou největší zemi Jižní Ameriky, Argentinu, by pojala víc než třikrát.", "Plán Brasílie navrhl Lúcio Costa a budovy architekt Oscar Niemeyer. Půdorys města se často přirovnává k letícímu ptákovi.", "Pelé vyhrál svůj první titul mistra světa 29. 6. 1958 ve Švédsku. Bylo mu teprve 17 let."], "ukoly": [{"typ": "vyber", "otazka": "Proč roste na severu Brazílie deštný prales?", "moznosti": ["Leží vysoko v horách, kde často sněží", "Je tam nejsušší podnebí Jižní Ameriky", "U rovníku je stále teplo a často prší", "Prales tam vysadili Portugalci kvůli dřevu"], "spravne": 2, "napoveda": "Přečti si „Ve zkratce“ – větu o Amazonii."}, {"typ": "pravda", "tvrzeni": "Rio de Janeiro je hlavní město Brazílie.", "pravda": false, "napoveda": "Podívej se do základních údajů – jak se jmenuje hlavní město?"}, {"typ": "vyber", "otazka": "Co je favela?", "moznosti": ["Tanec z karnevalu v Riu", "Druh papouška z Amazonie", "Chudinská čtvrť v brazilských městech", "Brazilské jídlo z fazolí"], "spravne": 2, "napoveda": "Přečti si rámeček „Nové slovo“."}], "hadanka": ["Mistrovství světa ve fotbale jsem vyhrála pětkrát.", "Pěstuji skoro 40 % kávy na světě, ale víc vydělám na vývozu ropy a sóji.", "Mluví se u mě portugalsky a slavný je můj karneval v Riu."], "par": {"vec": "karneval v Riu", "zvire": "ara hyacintový"}, "fotky": [{"src": "img/ju_rio.jpg", "autor": "Wilfredor", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File%3AChrist_the_Redeemer_on_Corcovado_Mountain%2C_Rio_de_Janeiro%2C_Brazil.jpg", "cap": "Kristus Spasitel nad Riem"}, {"src": "img/ju_amazonie.jpg", "autor": "Neil Palmer", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AAmazon_CIAT.jpg", "cap": "Amazonský prales z letadla"}, {"src": "img/d_bra_copacabana.jpg", "autor": "Wilfredor", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Copacabana,_Rio_de_Janeiro,_Brazil.jpg", "cap": "Pláž Copacabana v Riu"}, {"src": "img/d_bra_karneval.jpg", "autor": "Tim Fearn", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Carnival_in_Sambadrome_Rio_09s.jpg", "cap": "Karnevalový vůz školy samby"}, {"src": "img/d_bra_arahyacint.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Hyacinth_Macaw_(Anodorhynchus_hyacinthinus)_(27569556513).jpg", "cap": "Ara hyacintový, nejdelší papoušek"}], "kratce": ["Brazílie je největší stát Jižní Ameriky a slavný je tu karneval v Riu.", "Většina lidí žije blízko pobřeží, kde leží největší města São Paulo a Rio de Janeiro.", "Hlavní město Brasília postavili v letech 1956–1960 uprostřed země, daleko od pobřeží.", "Sever pokrývá Amazonie, největší deštný prales světa – u rovníku je stále teplo a často prší.", "Amazonkou teče víc vody než kteroukoli jinou řekou.", "Pralesa v Amazonii ubývá – lidé ho kácejí kvůli pastvinám pro dobytek a polím se sójou.", "Brazílie pěstuje skoro 40 % kávy světa, nejvíc ale vydělá na vývozu ropy a sóji."], "zapis": ["[Brasília] – hlavní město", "úřední jazyk [portugalština]", "největší města [São Paulo] a Rio de Janeiro", "[Amazonka] – nejvodnatější řeka světa", "pěstuje skoro 40 % světové [kávy]", "nejvíc vydělá na vývozu ropy a [sóji]"], "temata": {"priroda": {"polozky": [{"nazev": "Amazonie a Amazonka", "text": "Amazonie je největší tropický deštný les na světě. Amazonka odnese do oceánu 18 % vody všech řek světa – víc než kterákoli jiná řeka. Území, ze kterého do ní stéká voda, zabírá asi třetinu Jižní Ameriky. Roste tu i mahagon, strom vysoký až kolem 70 m, který je v Brazílii ohrožený."}, {"nazev": "Pantanal – říše zvířat", "text": "Na jihozápadě leží Pantanal, jeden z největších mokřadů světa – měří asi 140 000 km². Od října do dubna ho zaplaví rozlité řeky. Žijí tu jaguáři, kajmani, vydry obrovské a ara hyacintový, nejdelší papoušek na světě. Část Pantanalu chrání UNESCO."}, {"nazev": "Tukan a lenochod", "text": "Tukan obrovský má zobák až čtyřikrát větší než hlavu. Zobák je přesto lehký, protože je uvnitř dutý. Lenochod visí v korunách stromů hlavou dolů a hodně odpočívá. V zoo prospí i 15 hodin denně, v divočině kolem 10 hodin. V jeho srsti rostou řasy, a proto bývá nazelenalý."}, {"nazev": "Obří země", "text": "Brazílie měří 8 510 420 km² a je pátým největším státem světa. Větší jsou jen Rusko, Kanada, USA a Čína. Druhou největší zemi Jižní Ameriky, Argentinu, by pojala víc než třikrát."}], "otazka": {"typ": "pravda", "tvrzeni": "Lenochod je vzhůru skoro celý den a spí jen pár hodin.", "pravda": false, "napoveda": "Přečti si položku „Tukan a lenochod“."}}, "hospodarstvi": {"polozky": [{"nazev": "Káva, ropa, sója a železná ruda", "text": "Brazílie vypěstuje skoro 40 % veškeré kávy na světě. Nejvíc peněz jí ale přináší vývoz ropy a sóji, na třetím místě je železná ruda. V letech 2024 a 2025 vydělala nejvíc na ropě, v roce 2026 zatím vede sója."}], "otazka": {"typ": "vyber", "otazka": "Kolik kávy světa vypěstuje Brazílie?", "moznosti": ["asi 5 %", "skoro 40 %", "asi 75 %", "skoro 100 %"], "spravne": 1, "napoveda": "Přečti si položku „Káva, ropa, sója a železná ruda“."}}, "kultura": {"polozky": [{"nazev": "Karneval v Riu", "text": "Na karnevalu v Riu procházejí městem obrovské průvody škol samby – tanečních spolků, které se na karneval připravují celý rok. Každá škola si pro svůj průvod složí vlastní sambu, která vypráví jeho příběh. Samba z Ria patří ke kulturnímu dědictví Brazílie."}, {"nazev": "Rio de Janeiro a São Paulo", "text": "Rio de Janeiro má 6,2 milionu obyvatel a je druhým největším městem Brazílie. Větší je jen São Paulo s 11,5 milionu. Rio leží mezi zalesněnými horami a oceánem a jeho nejslavnější pláží je Copacabana."}], "otazka": {"typ": "pravda", "tvrzeni": "São Paulo má víc obyvatel než Rio de Janeiro.", "pravda": true, "napoveda": "Přečti si položku „Rio de Janeiro a São Paulo“."}}, "sport": {"polozky": [{"nazev": "Pětkrát mistrem světa", "text": "Brazílie vyhrála mistrovství světa ve fotbale pětkrát – v letech 1958, 1962, 1970, 1994 a 2002. Tolik titulů nemá žádná jiná země."}, {"nazev": "Pelé", "text": "Pelé je jediný fotbalista, který se stal mistrem světa třikrát: v letech 1958, 1962 a 1970. Svůj první titul vyhrál 29. 6. 1958 ve Švédsku, když mu bylo teprve 17 let."}], "otazka": {"typ": "vyber", "otazka": "Kolikrát se stal mistrem světa ve fotbale Pelé?", "moznosti": ["jednou", "dvakrát", "třikrát", "pětkrát"], "spravne": 2, "napoveda": "Přečti si položku „Pelé“."}}, "historie": {"polozky": [{"nazev": "Nezávislost na Portugalsku", "text": "Brazílie dlouho patřila Portugalsku, a proto se tu mluví portugalsky. Nezávislost vyhlásil princ Pedro 7. 9. 1822 u říčky Ipiranga nedaleko São Paula. Podle dnešních historiků tam ale nepřijel na koni jako na slavném obraze, nýbrž na nákladní mule."}, {"nazev": "Socha Krista Spasitele", "text": "Nad Riem de Janeiro stojí na hoře Corcovado socha Krista Spasitele s rozpaženýma rukama. I s podstavcem měří 38 m a odhalili ji 12. 10. 1931. Stojí ve výšce 710 m nad mořem, a tak ji vidíš z mnoha míst ve městě."}, {"nazev": "Brasília – nové hlavní město", "text": "Hlavní město Brasília postavili v letech 1956–1960 uprostřed země, daleko od pobřeží. Plán města navrhl Lúcio Costa a budovy architekt Oscar Niemeyer. Půdorys města se často přirovnává k letícímu ptákovi."}], "otazka": {"typ": "vyber", "otazka": "Ve kterém roce vyhlásila Brazílie nezávislost na Portugalsku?", "moznosti": ["1500", "1822", "1931", "1960"], "spravne": 1, "napoveda": "Přečti si položku „Nezávislost na Portugalsku“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (212 812 405 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=BR"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-re

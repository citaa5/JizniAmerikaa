 {"nazev": "Lamy", "text": "Bolívie má nejvíc lam na světě – víc než 2 miliony. Žijí hlavně na náhorní plošině Altiplano ve výšce kolem 4 000 m. Lamy dávají maso i vlnu a nosí náklady."}], "otazka": {"typ": "vyber", "otazka": "Co podle textu brzdí těžbu lithia v Bolívii?", "moznosti": ["Lithium smí Bolívie prodávat jen do Peru", "Solnou pláň hlídají vzácní plameňáci", "Lithium leží pod mořem, které Bolívie nemá", "Voda se kvůli dešťům a chladu odpařuje pomalu"], "spravne": 3, "napoveda": "Přečti si položku „Lithium pod solí“."}}, "kultura": {"polozky": [{"nazev": "Karneval v Oruru", "text": "Karneval v Oruru trvá deset dní. Hlavním tancem je diablada – tanec ďáblů v pestrých maskách. Průvodem projde přes 28 000 tanečníků a 10 000 hudebníků."}, {"nazev": "Alasita", "text": "Od 24. ledna se v La Paz slaví svátek Alasita. Lidé si kupují malinké napodobeniny věcí, po kterých touží, a věří, že se jim přání splní."}, {"nazev": "La Paz a lanovky", "text": "Vláda sídlí v La Paz, které leží v hlubokém kaňonu ve výšce přes 3 500 m. Ulice tu prudce stoupají, a tak se metro stavět nedalo. Lidé proto jezdí lanovkou Mi Teleférico – největší městskou lanovkovou sítí na světě. V roce 2019 měla 10 linek a 33 km tras."}], "otazka": {"typ": "vyber", "otazka": "Proč v La Paz lidé jezdí místo metrem lanovkou?", "moznosti": ["Pod městem je solná pláň, do které se nesmí kopat", "Lanovka je jediná doprava v celé Bolívii", "Město leží v kaňonu a ulice prudce stoupají", "V ulicích leží celý rok vysoký sníh"], "spravne": 2, "napoveda": "Přečti si položku „La Paz a lanovky“."}}, "sport": {"polozky": [{"nazev": "Mistři Jižní Ameriky", "text": "V roce 1963 pořádala Bolívie mistrovství Jižní Ameriky ve fotbale, dnes zvané Copa América. Bolívie turnaj vyhrála – je to zatím její jediný titul."}, {"nazev": "Fotbal ve výšce", "text": "Ve vysokých horách je ve vzduchu méně kyslíku a hráči z nížin se rychle zadýchají. Vědec z Oxfordské univerzity prošel výsledky 1 460 mezistátních zápasů v Jižní Americe. Zjistil, že týmy z hor mají proti týmům z nížin výraznou výhodu."}], "otazka": {"typ": "pravda", "tvrzeni": "Bolívie vyhrála Copa América už pětkrát.", "pravda": false, "napoveda": "Přečti si položku „Mistři Jižní Ameriky“."}}, "historie": {"polozky": [{"nazev": "Nezávislost a jméno", "text": "Bolívie vyhlásila nezávislost na Španělsku 6. srpna 1825. Jméno dostala podle Simóna Bolívara, kterému se říkalo Osvoboditel. Bolívar byl jejím prvním prezidentem, po něm vládl generál Antonio José de Sucre."}, {"nazev": "Válka o moře", "text": "Bolívie kdysi moře měla. O své pobřeží přišla ve válce o Pacifik s Chile v letech 1879–1884."}, {"nazev": "Tiwanaku", "text": "U jezera Titicaca ve výšce 3 850 m stojí zbytky města Tiwanaku, které vzkvétalo v letech 400 až 900 n. l., dávno před Inky. Jeho Sluneční brána je vytesaná z jediného kamenného bloku."}, {"nazev": "Potosí – město stříbra", "text": "Město Potosí leží ve výšce 4 000 m. V 16. století se tu našla největší ložiska stříbra v celé Americe a stříbro odtud vozily lodě do Španělska."}], "otazka": {"typ": "pravda", "tvrzeni": "Bolívie přišla o své pobřeží ve válce s Peru.", "pravda": false, "napoveda": "Přečti si položku „Válka o moře“."}}}, "zdroje": [["INE Bolívie, sčítání 2024 (11 365 333 lidí)", "https://cpv2024.ine.gob.bo/index.php/ine-resultados-del-censo-2024-plantean-el-desafio-de-aprovechar-el-bono-demografico-para-impulsar-el-crecimiento-de-bolivia/"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["náhorní = rozkládající se ve vysoko položené krajině (Slovník spisovného jazyka českého, ÚJČ AV ČR)", "https://ssjc.ujc.cas.cz/search.php?hledej=Hledat&heslo=n%C3%A1horn%C3%AD&sti=EMPTY&where=hesla&hsubstr=no"], ["plošina = útvar s plochým nebo mírně zvlněným povrchem (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/plo%C5%A1ina"], ["Altiplano leží mezi dvěma pásmy And, asi 3 660 m (NASA Earth Observatory)", "https://science.nasa.gov/earth/earth-observatory/altiplano-south-america-1152/"], ["náhorní plošina jihozápadní Bolívie mezi východními a západními Andami, přes 3 600 m (NASA Photojournal)", "https://science.nasa.gov/photojournal/salt-playas-of-the-bolivian-altiplano/"], ["Salar de Uyuni – přes 10 000 km², největší solná pláň světa, neobyčejně rovná, zrcadlo v období dešťů, lithium v solance pod krustou; jednou z překážek těžby je pomalé odpařování kvůli dešťům a chladu (NASA)", "https://science.nasa.gov/earth/earth-observatory/lithium-harvesting-at-salar-de-uyuni-144976/"], ["Laguna Colorada – 4 300 m, mělká, 10 km dlouhá, červenohnědá od řas, někdy zelená, mokřad Ramsar od 1990, velká hejna plameňáků (NASA)", "https://science.nasa.gov/earth/earth-observatory/laguna-colorada-86135/"], ["Los Lípez (do roku 2009 lokalita Laguna Colorada, mokřad Ramsar od 1990): asi 25 % světové populace plameňáka andského a 50 % plameňáka Jamesova (Úmluva Ramsar, anotovaný seznam mokřadů Bolívie)", "https://rsis.ramsar.org/sites/default/files/rsiswp_search/exports/Ramsar-Sites-annotated-summary-Bolivia-Plurinational-State-of.pdf"], ["La Paz – přes 3 500 m, „nejvýše položené hlavní město světa“ (NASA)", "https://science.nasa.gov/photojournal/la-paz-bolivia/"], ["La Paz leží v kaňonu pod El Altem na náhorní plošině; metro se kvůli terénu ukázalo jako neproveditelné, proto lanovky (Světová banka, 2014)", "https://blogs.worldbank.org/en/transport/hop-car-and-zip-down-la-paz"], ["Mi Teleférico – největší městská lanovková síť, v roce 2019 10 linek a 33 km; mezi centrem a El Altem stoupání přes 500 m na 2,8 km (Guinness World Records)", "https://www.guinnessworldrecords.com/world-records/451860-largest-public-transit-cable-car-network"], ["Bolívie 2024: vývoz 9,06 mld. USD – hlavně zemní plyn, zinek a stříbro, zlato, sója; těží se zinek, stříbro, olovo, měď, cín (U.S. International Trade Administration podle bolivijského statistického úřadu INE)", "https://www.trade.gov/country-commercial-guides/bolivia-market-overview"], ["Zdroje lithia: Argentina 28, Bolívie 23, Chile 13 milionů tun (USGS, Mineral Commodity Summaries 2026)", "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-lithium.pdf"], ["Lamy a alpaky v Andách; Bolívie má nejvíc lam (asi 2,4 milionu podle údajů z roku 2009, Peru 1,2 milionu), Altiplano kolem 4 000 m; lamy na maso, práci i vlnu (FAO, Symposium on Natural Fibres 2009)", "https://www.fao.org/4/i0709e/i0709e07.pdf"], ["Karneval v Oruru – 3 700 m, 10 dní, diablada, přes 28 000 tanečníků a 10 000 hudebníků, průvod 20 hodin (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/carnival-of-oruro-00003"], ["Alasita v La Paz – od 24. ledna, miniatury pro štěstí spojené s bůžkem Ekeko (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/ritual-journeys-in-la-paz-during-alasita-01182"], ["Válka o Pacifik 1879–1884, Bolívie přišla o pobřeží (Origins, Ohio State University, neúřední)", "https://origins.osu.edu/read/war-pacific-and-fate-south-america"], ["Tiwanaku – 3 850 m u Titicacy, město 400–900 n. l., Sluneční brána z jednoho bloku (UNESCO)", "https://whc.unesco.org/en/list/567/"], ["Potosí – 4 000 m, největší ložiska stříbra Nového světa v 16. století (UNESCO)", "https://whc.unesco.org/en/list/420/"], ["Bolívie vyhrála Copa América jednou – v roce 1963, kdy turnaj pořádala (CONMEBOL Copa América, oficiální web, 2026)", "https://copaamerica.com/en/news/how-many-times-has-bolivia-won-copa-america"], ["Studie P. McSharryho (Oxfordská univerzita, BMJ 2007): 1 460 mezistátních zápasů v Jižní Americe, týmy z hor mají výhodu; ve výšce málo kyslíku, zadýchávání (EurekAlert!, AAAS)", "https://www.eurekalert.org/news-releases/725987"], ["Bolívie vyhlásila nezávislost na Španělsku 6. srpna 1825 (U.S. Department of State, Office of the Historian)", "https://history.state.gov/countries/bolivia"], ["Bolívie získala úplnou nezávislost 1825 pod vedením Simóna Bolívara „Osvoboditele“, země pojmenována Bolívie, Bolívar prvním prezidentem, po něm Sucre (Library of Congress, Country Profile: Bolivia 2006)", "https://tile.loc.gov/storage-services/master/frd/copr/Bolivia.pdf"], ["Bolívie ztratila pobřeží Atacamy ve válce o Pacifik s Chile, od té doby je vnitrozemská (Library of Congress, Country Profile: Bolivia 2006)", "https://tile.loc.gov/storage-services/master/frd/copr/Bolivia.pdf"]], "hesla": ["STŘÍBRO 54", "LAMA 23", "PONČO 97", "LAMA 74", "ZRCADLO 92", "SŮL 80", "LANOVKA 77", "KLOBOUK 37", "KLOBOUK 65", "STŘÍBRO 56", "ZRCADLO 53", "LAMA 18", "ALPAKA 62", "VIKUŇA 33", "ALPAKA 12", "ZRCADLO 45", "PONČO 82", "SŮL 43", "PONČO 27", "VIKUŇA 89", "ALPAKA 64", "LANOVKA 71", "KLOBOUK 72", "STŘÍBRO 99", "PLAMEŇÁK 85", "SŮL 15", "VIKUŇA 59", "PLAMEŇÁK 25", "LANOVKA 51", "PLAMEŇÁK 88"]}, {"k": "chile", "n": "Chile", "ne": "Chile", "x": 409.3, "y": 784.8, "obl": "jih", "povinny": true, "rodic": null, "prechod": 0, "typicky": "Dlouhá úzká země mezi Andami a Tichým oceánem – nejsušší poušť mimo póly, sopky a měď.", "hm": "Santiago de Chile", "hmk": "Santiago", "obyv": "asi 18,5 milionu", "obyvRok": 2024, "jazyk": "španělština", "mena": "chilské peso", "poloha": "Úzký pruh země mezi Andami a Tichým oceánem; sousedí s Peru, Bolívií a Argentinou.", "podnebi": "", "srovnani": {"img": "img/chile_evropa.png", "nadpis": "Chile naležato přes Evropu", "text": "Na sítích koluje vtip, jak je Chile dlouhé a úzké. Tady je ve stejném měřítku jako Evropa: přes 4 300 km na délku, v průměru jen 177 km na šířku – to je skoro jako vzdušnou čarou z Prahy do Brna. Do délky Chile by se Česko vešlo skoro 9× za sebou, plochou skoro 10×."}, "pojem": "guáno – nahromaděný trus mořských ptáků, cenné hnojivo. V Chile ho najdeš na skalách severního pobřeží, kde žijí pelikáni a tučňáci Humboldtovi.", "rozloha": "asi 757 000 km²", "rozlohaCz": "skoro 10× větší než Česko", "uvidis": [{"nazev": "Poušť Atacama", "druh": "priroda", "text": "Na severu Chile leží poušť Atacama. Když nepočítáme ledové pouště u pólů, je to nejsušší poušť na Zemi. Některá místa dostanou za rok jen pár milimetrů deště a některá vůbec žádný. Suchá a slaná půda připomíná povrch Marsu. Proto sem vědci z NASA jezdili zkoušet vozítko s vrtákem, které má jednou hledat život na Marsu. Když zaprší, poušť rozkvete – třeba v roce 2019."}, {"nazev": "Andy a sopky", "druh": "priroda", "text": "Chile je přes 4 300 km dlouhé, ale v průměru jen 177 km široké. Z jedné strany ho omývá Tichý oceán, z druhé lemují Andy. V chilské části And je asi 90 činných sopek a 43 z nich vědci hlídají přístroji ve dne v noci. Často se tu třese i země. V květnu 1960 zasáhlo jih Chile zemětřesení o síle (magnitudě) 9,5. Je to nejsilnější zemětřesení, jaké kdy přístroje změřily."}, {"nazev": "Torres del Paine", "druh": "priroda", "text": "Na jihu Chile, v Patagonii, leží národní park Torres del Paine. Jeho strmé skalní věže a hory vymodelovaly ledovce. Z Jižního ledového pole k nim dodnes stékají ledovce, třeba Grey nebo Dickson, a pod horami se lesknou jezera. Na pláních se pasou guanaka a číhá tu puma. Žije tu i vzácný jelen huemul a přes sto druhů ptáků, třeba nandu nebo plameňák chilský."}, {"nazev": "Velikonoční ostrov", "druh": "pamatka", "text": "Velikonoční ostrov, místními nazývaný Rapa Nui, patří Chile, ale leží v Tichém oceánu 3 700 km od jeho pobřeží. Osídlili ho mořeplavci z Polynésie. Jejich potomci tu mezi 10. a 16. stoletím vytesali asi 900 obřích kamenných soch moai, které představují předky. Mnohé sochy stojí na kamenných plošinách. Ostrov je památkou UNESCO."}], "zvirata": [{"nazev": "Kondor andský", "text": "Obří sup, který plachtí na vzdušných proudech nad Andami. Spolu s jelenem huemulem drží štít na chilském státním znaku.", "foto": {"src": "img/d_jiz_kondor.jpg", "autor": "Hugo Pedel", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Condor_des_Andes_m%C3%A2le_adulte.jpg"}}, {"nazev": "Guanako", "text": "Divoký předek lamy. V parku Torres del Paine ho uvidíš snadno.", "foto": {"src": "img/d_jiz_guanako.jpg", "autor": "Diego Delso", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Guanacos,_Parque_Nacional_Torres_del_Paine,_Chile5.jpg"}}, {"nazev": "Huemul", "text": "Jelen z hor na jihu Chile, ohrožený vyhynutím. Najdeš ho i na chilském státním znaku a žije třeba v parku Torres del Paine."}], "zivi": "V roce 2024 vytěžilo Chile asi čtvrtinu (24 %) veškeré mědi na světě – nejvíc ze všech zemí. Z mědi se vyrábějí třeba elektrické dráty. V roce 2025 bylo Chile také třetím největším těžařem lithia na světě. Lithium se tu získává ze slané vody a používá se do baterií.", "kultura": ["Národním tancem je cueca. Za národní ji vláda vyhlásila 18. 9. 1979. Tančí se po celé zemi, v každém kraji trochu jinak.", "Chilská básnířka Gabriela Mistralová dostala v roce 1945 Nobelovu cenu za literaturu."], "zapamatuj": ["Santiago – hlavní město", "dlouhá úzká země u Tichého oceánu", "Atacama – nejsušší poušť mimo póly", "měď – nejvíc na světě"], "vic": ["Na plošině Chajnantor v poušti Atacama stojí ve výšce kolem 5 000 m 66 antén observatoře ALMA. Vzduch je tu suchý, a tak signály z vesmíru pohltí vodní pára jen málo.", "Česko je od 30. 4. 2007 členem Evropské jižní observatoře (ESO), která v chilské poušti provozuje velké dalekohledy.", "Ostrov Ohňová země si Chile dělí s Argentinou. Hranice vede i přes velké jezero Fagnano uprostřed ostrova."], "ukoly": [{"typ": "vyber", "otazka": "Proč je poušť Atacama tak suchá?", "moznosti": ["Leží přímo na rovníku, kde slunce vše vysuší", "Z východu ji chrání Andy, ze západu studený mořský proud", "Leží uprostřed pevniny, daleko od moře", "Leží za polárním kruhem, kde je na déšť zima"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“ – větu o Atacamě."}, {"typ": "pravda", "tvrzeni": "Chile těží víc mědi než kterákoli jiná země na světě.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“ a zápis."}, {"typ": "vyber", "otazka": "Mezi čím se táhne dlouhá úzká země Chile?", "moznosti": ["mezi Andami a Tichým oceánem", "mezi pampou a Atlantským oceánem", "mezi řekami Paraguay a Paraná", "mezi Amazonií a Karibským mořem"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“."}], "hadanka": ["Štít na mém státním znaku drží kondor a jelen huemul.", "Na mém ostrově v Tichém oceánu stojí obří kamenné sochy moai.", "Jsem dlouhá úzká země mezi Andami a Tichým oceánem a těžím nejvíc mědi na světě."], "par": {"vec": "sochy moai", "zvire": "kondor andský"}, "fotky": [{"src": "img/ju_atacama.jpg", "autor": "Diego Delso", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AAnfiteatro%2C_Valle_de_la_Luna%2C_San_Pedro_de_Atacama%2C_Chile%2C_2016-02-01%2C_DD_149.JPG", "cap": "Poušť Atacama"}, {"src": "img/c_chi_moai.jpg", "autor": "Oscarxuch", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AAhu_Tongariki%27s_Moais.JPG", "cap": "Sochy moai na Velikonočním ostrově"}, {"src": "img/c_chi_paine.jpg", "autor": "Winky from Oxford, UK", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AA_view_towards_Torres_Del_Paine.jpg", "cap": "Hory Torres del Paine"}, {"src": "img/d_jiz_osorno.jpg", "autor": "Jorge Morales Piderit", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Volc%C3%A1n_Osorno_y_lago_Llanquihue_desde_el_sector_Los_Riscos.jpg", "cap": "Sopka Osorno nad jezerem"}, {"src": "img/ju_med.jpg", "autor": "Pierre cb", "lic": "Public domain", "page": "https://commons.wikimedia.org/wiki/File%3AChuquicamata-Chile-2009.JPG", "cap": "Měděný důl Chuquicamata"}], "kratce": ["Chile je dlouhá úzká země mezi Andami a Tichým oceánem.", "Na severu leží Atacama, nejsušší poušť mimo póly.", "Z východu k ní déšť nepustí Andy a nad studeným proudem na západě se mraky netvoří.", "V chilských Andách je asi 90 činných sopek a nad nimi plachtí kondor andský.", "K Chile patří i Velikonoční ostrov s obřími kamennými sochami moai.", "Chile těží nejvíc mědi na světě – kovu na elektrické dráty.", "Na jihu je pobřeží rozeklané fjordy a podél pobřeží teče studený Humboldtův proud.", "Chile patří mezi největší vývozce vína na světě."], "zapis": ["[Santiago] – hlavní město", "[Atacama] – nejsušší poušť mimo póly", "Chile těží nejvíc [mědi] na světě", "sochy [moai] na Velikonočním ostrově", "na jihu [fjordy], podél pobřeží studený Humboldtův proud"], "temata": {"priroda": {"polozky": [{"nazev": "Poušť Atacama", "text": "Na severu Chile leží poušť Atacama. Když nepočítáme ledové pouště u pólů, je to nejsušší poušť na Zemi – některá místa nedostanou za rok ani kapku deště. Suchá a slaná půda připomíná Mars, a tak sem vědci z NASA jezdili zkoušet vozítko s vrtákem. Když vzácně zaprší, poušť rozkvete – třeba v roce 2019."}, {"nazev": "Andy a sopky", "text": "Chile je přes 4 300 km dlouhé, ale v průměru jen 177 km široké. V chilských Andách je asi 90 činných sopek a 43 z nich vědci hlídají přístroji ve dne v noci. V květnu 1960 zasáhlo jih Chile zemětřesení o síle (magnitudě) 9,5 – nejsilnější, jaké kdy přístroje změřily."}, {"nazev": "Torres del Paine", "text": "Na jihu, v Patagonii, leží národní park Torres del Paine. Jeho strmé skalní věže jsou dílem ledovců, které sem dodnes stékají z Jižního patagonského ledového pole. Na pláních se pasou guanaka – divocí příbuzní lamy – a číhá tu puma. Žije tu i vzácný jelen huemul."}, {"nazev": "Hvězdárny v poušti", "text": "Na plošině Chajnantor v Atacamě stojí 66 antén observatoře ALMA, a to ve výšce kolem 5 000 m. Signály z vesmíru pohlcuje vodní pára ve vzduchu, a tak se antény staví na vysoká a suchá místa, jako je tohle. Česko je od roku 2007 členem Evropské jižní observatoře (ESO), která v chilské poušti provozuje velké dalekohledy."}], "otazka": {"typ": "vyber", "otazka": "Proč vědci z NASA zkoušeli v Atacamě vozítko pro Mars?", "moznosti": ["Suchá a slaná půda tu připomíná Mars", "V Atacamě je nejvíc sopek na světě", "V poušti je stejná zima jako na Marsu", "Často tu prší a vozítko jezdí v blátě"], "spravne": 0, "napoveda": "Přečti si položku „Poušť Atacama“."}}, "hospodarstvi": {"polozky": [{"nazev": "Měď", "text": "V roce 2024 vytěžilo Chile asi čtvrtinu (24 %) veškeré mědi na světě – nejvíc ze všech zemí. Měď dobře vede elektrický proud, a proto se z ní vyrábějí třeba elektrické dráty."}, {"nazev": "Lithium", "text": "V roce 2025 bylo Chile třetím největším těžařem lithia na světě, víc ho vytěžily jen Austrálie a Čína. Lithium se tu získává ze slané vody a používá se do baterií."}], "otazka": {"typ": "pravda", "tvrzeni": "Chile je největším těžařem lithia na světě.", "pravda": false, "napoveda": "Přečti si položku „Lithium“."}}, "kultura": {"polozky": [{"nazev": "Cueca", "text": "Národním tancem je cueca. Za národní ji vláda vyhlásila 18. 9. 1979. Tančí se po celé zemi, v každém kraji trochu jinak."}, {"nazev": "Gabriela Mistralová", "text": "Chilská básnířka Gabriela Mistralová dostala v roce 1945 Nobelovu cenu za literaturu. Porota ocenila její básně plné silných citů. Její jméno se stalo symbolem nadějí celé Latinské Ameriky."}], "otazka": {"typ": "vyber", "otazka": "Jak se jmenuje národní tanec Chile?", "moznosti": ["cueca", "tango", "samba", "salsa"], "spravne": 0, "napoveda": "Přečti si položku „Cueca“."}}, "sport": {"polozky": [{"nazev": "Copa América 2015 a 2016", "text": "Copa América je mistrovství Jižní Ameriky ve fotbale a nejstarší turnaj reprezentací na světě. Chile ho vyhrálo dvakrát po sobě, v letech 2015 a 2016. V obou finále porazilo Argentinu v penaltovém rozstřelu."}, {"nazev": "Claudio Bravo", "text": "Brankář a kapitán Claudio Bravo chytil ve finále v roce 2016 v penaltovém rozstřelu střelu Lucase Biglii. Získal Zlatou rukavici pro nejlepšího brankáře turnaje."}], "otazka": {"typ": "vyber", "otazka": "Koho Chile porazilo ve finále Copa América 2015 i 2016?", "moznosti": ["Argentinu", "Brazílii", "Uruguay", "Paraguay"], "spravne": 0, "napoveda": "Přečti si položku „Copa América 2015 a 2016“."}}, "historie": {"polozky": [{"nazev": "Velikonoční ostrov", "text": "Velikonoční ostrov, místními nazývaný Rapa Nui, leží v Tichém oceánu 3 700 km od pobřeží Chile. Osídlili ho mořeplavci z Polynésie a jejich potomci tu mezi 10. a 16. stoletím vytesali asi 900 obřích kamenných soch moai. Sochy představují předky a ostrov je památkou UNESCO."}, {"nazev": "Nezávislost 1818", "text": "Za první pokus Chilanů zbavit se španělské vlády se považuje 18. září 1810. Nezávislost pak Chile slavnostně vyhlásilo 12. února 1818. Vůdce vlastenců Bernardo O’Higgins vybral tento den na výročí vítězné bitvy u Chacabuca."}, {"nazev": "Státní znak", "text": "Štít na chilském státním znaku drží kondor andský a jelen huemul. Pod nimi je heslo „Rozumem, nebo silou“."}], "otazka": {"typ": "pravda", "tvrzeni": "Sochy moai vytesali Španělé, kteří ostrov obsadili.", "pravda": false, "napoveda": "Přečti si položku „Velikonoční ostrov“."}}}, "zdroje": [["Sčítání 2024: v Chile sečteno 18 480 432 obyvatel (INE Chile)", "https://www.ine.gob.cl/sala-de-prensa/prensa/general/noticia/2025/03/27/primeros-resultados-del-censo-2024-18.480.432-personas-fueron-censadas-en-chile-manteni%C3%A9ndose-la-tendencia-de-envejecimiento-de-la-poblaci%C3%B3n"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["guáno = nahromaděný trus ptáků a netopýrů, těží se jako hnojivo (Nauru, Chile) (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/guano"], ["guáno na pobřeží regionu Tarapacá od pelikánů, tučňáků Humboldtových, kormoránů a terejů; přírodní hnojivo (SAG, chilský zemědělský úřad, 2010)", "https://www.sag.gob.cl/noticias/sag-coordina-accion-fiscalizadora-en-la-extraccion-ilegal-de-guano-blanco-y-rojo"], ["Fjordy na západní straně And v jižním Chile (NASA Earth Observatory, South Patagonian Icefield)", "https://science.nasa.gov/earth/earth-observatory/south-patagonian-icefield-90464"], ["„One of the world's largest fjord systems is located in the Patagonian region of southern Chile“ (Frontiers in Marine Science 2021)", "https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2021.611981/full"], ["Humboldtův proud – studený mořský proud podél západního pobřeží Jižní Ameriky, teče od jihu (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/Humboldtův proud"], ["Humboldtův proud teče k severu podél pobřeží a vynáší studenou vodu (Marine Science Institute, University of Texas)", "https://utmsi.utexas.edu/science-and-the-sea/radio-program/humboldt-current/"], ["Chile – 4. největší vývozce vína na světě, 2024 (OIV)", "https://www.oiv.int/sites/default/files/2025-04/OIV_State_of_the_World_Vine_and_Wine_Sector_in_2024_PPT.pdf"], ["Chile – 4. největší vývozce vína na světě, 2025 (OIV)", "https://www.oiv.int/sites/default/files/2026-05/OIV-State_of_the_World_Wine_Sector_in_2025.pdf"], ["Atacama – nejsušší nepolární poušť na Zemi (NASA JPL)", "https://www.jpl.nasa.gov/news/detecting-life-in-the-ultra-dry-atacama-desert/"], ["Atacama: některá místa dostanou pár milimetrů deště za rok, některá žádný; rozkvetlá poušť v březnu 2019 (NASA Earth Observatory)", "https://science.nasa.gov/earth/earth-observatory/atacama-greening-144989"], ["Atacama – jedno z prostředí nejpodobnějších Marsu; NASA tu zkouší vozítko s vrtákem (projekt ARADS)", "https://www.nasa.gov/image-article/cooking-up-worlds-driest-desert-atacama-rover-astrobiology-drilling-studies/"], ["Chile: pevninská část dlouhá 4 329 km, průměrná šířka 177 km, mezi Tichým oceánem a Andami (Universidad de Chile, Instituto de Salud Poblacional – OCHISAP)", "https://www.ochisap.cl/contexto-geografico-historico-y-politico/"], ["Chile: 87–92 geologicky činných sopečných systémů, 43 z nich hlídaných přístroji nepřetržitě (Sernageomin, národní geologická služba Chile)", "https://www.sernageomin.cl/rnvv/"], ["Zemětřesení v Chile 22. 5. 1960, síla 9,5 – nejsilnější přístroji změřené; tsunami na Havaji (61 mrtvých) (NOAA NCEI)", "https://www.ncei.noaa.gov/news/day-1960-chilean-earthquake-and-tsunami"], ["NP Torres del Paine: založen 1959, 227 298 ha, tvary hor vymodelovaly ledovce, ledovce Grey a Dickson z Jižního ledového pole, guanako, puma, huemul, nandu, 126 druhů ptáků (CONAF, chilská lesní a parková správa)", "https://www.conaf.cl/parques/parque-nacional-torres-del-paine/"], ["Rapa Nui: 3 700 km od pobřeží Chile, asi 900 soch moai, Polynésané, sochy z 10.–16. století (UNESCO)", "https://whc.unesco.org/en/list/715/"], ["Chile – největší těžař mědi: 2024 asi 5,5 mil. t z 23 mil. t světové těžby (24 %), 2025 odhadem 5,3 z 23 mil. t (USGS, Mineral Commodity Summaries 2026)", "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-copper.pdf"], ["Lithium 2025: Austrálie 92 000 t, Čína 62 000 t, Chile 56 000 t – třetí na světě (v roce 2024 bylo Chile druhé); Chile těží lithium ze solanky (USGS, Mineral Commodity Summaries 2026)", "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-lithium.pdf"], ["Kondor andský – sup, jeden z největších létajících ptáků; plachtí na vzdušných proudech v horách (National Geographic)", "https://www.nationalgeographic.com/animals/birds/facts/andean-condor"], ["Guanako – divoký předek lamy, žije v Andách až po Ohňovou zemi (Britannica)", "https://www.britannica.com/animal/guanaco"], ["Huemul – jelen ze státního znaku Chile, ohrožený vyhynutím (Museo Nacional de Historia Natural, Chile)", "https://www.mnhn.gob.cl/noticias/nuestro-mamifero-heraldico-el-huemul"], ["Cueca – národní tanec Chile, výnos č. 23 z 18. 9. 1979, v každém kraji trochu jiná (Memoria Chilena, Národní knihovna Chile)", "https://www.memoriachilena.gob.cl/602/w3-article-3510.html"], ["Gabriela Mistral – Nobelova cena za literaturu 1945 (nobelprize.org)", "https://www.nobelprize.org/prizes/literature/1945/summary/"], ["ALMA: 66 antén na plošině Chajnantor, většinou nad 5 000 m; signály z vesmíru silně pohlcuje vodní pára, proto vysoké a suché místo (ESO)", "https://www.eso.org/public/teles-instr/alma/"], ["Česko je členem ESO od 30. 4. 2007 (ESO)", "https://www.eso.org/public/about-eso/memberstates/czechinvolvement/"], ["Ostrov Ohňová země: jezero Fagnano se dělí mezi Argentinu a Chile, argentinská část ostrova (CONAE, argentinská vesmírná agentura)", "https://www.argentina.gob.ar/ciencia/conae/educacion-y-formacion-masiva/materiales-educativos/lago-fagnano-tierra-del-fuego-landsat-8-oli-10-de-octubre-de-2015"], ["Gabriela Mistral – Nobelova cena za literaturu 1945 za lyrickou poezii plnou silných citů, díky níž se její jméno stalo symbolem ideálů celé Latinské Ameriky (nobelprize.org)", "https://www.nobelprize.org/prizes/literature/1945/summary/"], ["Chile získalo v roce 2016 druhý titul Copa América, nejstaršího turnaje reprezentací na světě (CONMEBOL Copa América)", "https://copaamerica.com/en/news/chile-become-two-time-champions-in-2016"], ["Copa América Centenario 2016: Chile porazilo Argentinu 4 : 2 na penalty jako v roce 2015, jediné dva tituly Chile; kapitán Claudio Bravo získal Zlatou rukavici (CONMEBOL)", "https://www.conmebol.com/noticias/el-recuerdo-de-la-conmebol-copa-america-centenario/"], ["Finále Copa América 2016: Bravo chytil v penaltovém rozstřelu střelu Bigliovi, Messi přestřelil (FC Barcelona, oficiální web klubu)", "https://www.fcbarcelona.com/football/first-team/news/2015-2016/claudio-bravo-hero-copa-america-final"], ["Proklamace nezávislosti Chile 12. 2. 1818 – O’Higgins zvolil výročí bitvy u Chacabuca; akt označil 18. 9. 1810 za první pokus zbavit se španělské vlády (Memoria Chilena, Národní knihovna Chile)", "https://www.memoriachilena.gob.cl/602/w3-article-96486.html"], ["Státní znak Chile: štít drží huemul a kondor, heslo „Rozumem, nebo silou“ (výnos 1534 z roku 1967, Knihovna Národního kongresu Chile)", "https://www.bcn.cl/leychile/navegar?idNorma=18035"]], "hesla": ["POUŠŤ 22", "VÍTR 74", "MOAI 50", "VÍTR 44", "SOPKA 95", "VÍTR 39", "KRÁTER 32", "SOPKA 52", "POUŠŤ 66", "TELESKOP 75", "METEOR 82", "POUŠŤ 53", "MĚĎ 92", "LACHTAN 98", "LACHTAN 62", "MOAI 51", "METEOR 33", "KRÁTER 36", "TELESKOP 70", "TELESKOP 94", "MĚĎ 55", "LACHTAN 79", "MOAI 63", "MĚĎ 59", "KRÁTER 38", "SOCHA 30", "SOCHA 80", "METEOR 58", "SOPKA 47", "SOCHA 88"]}, {"k": "argentina", "n": "Argentina", "ne": "Argentina", "x": 577.4, "y": 798.1, "obl": "jih", "povinny": true, "rodic": null, "prechod": 2, "typicky": "Pampa s gaučy a stády krav, tango, fotbal a maté – a na jihu obří ledovce.", "hm": "Buenos Aires", "hmk": "Buenos Aires", "obyv": "asi 46 milionů", "obyvRok": 2025, "jazyk": "španělština", "mena": "argentinské peso", "poloha": "Na jihovýchodě Jižní Ameriky u Atlantského oceánu; na západě ji hřeben And odděluje od Chile.", "podnebi": "Argentina leží na jižní polokouli, a tak má roční období obráceně než my. V Buenos Aires je v lednu v průměru 24,9 °C, v červenci jen 11,0 °C. V Praze a středních Čechách je to naopak: v lednu −0,6 °C, v červenci 19,0 °C (průměry let 1991–2020).", "srovnani": null, "pojem": "Laplatská nížina – rozlehlá rovina mezi Andami, Brazilskou vysočinou a Atlantským oceánem, kterou protékají řeky Paraná a Uruguay.", "rozloha": "asi 2,8 mil. km²", "rozlohaCz": "35× větší než Česko", "uvidis": [{"nazev": "Pampa", "druh": "priroda", "text": "Kolem Buenos Aires se do dálky táhne pampa – obrovská travnatá rovina. Její jméno pochází z indiánského jazyka kečuánštiny a znamená „rovina bez stromů“. Podnebí je tu mírné a vlhké a půda úrodná, proto pampa patří k nejlepším zemědělským krajům světa. Pěstuje se tu sója, pšenice a kukuřice a na pastvinách se pasou krávy. O stáda se od 18. století starali gaučové – pastevci na koních, kteří jsou dnes symbolem Argentiny."}, {"nazev": "Aconcagua", "druh": "priroda", "text": "Na západě Argentiny se zvedají Andy, pohoří dlouhé asi 7 000 km. Jejich nejvyšší horou je Aconcagua. Měří 6 962 m a je to nejvyšší hora celé Ameriky. Mezi nejvyššími horami všech světadílů je druhá – vyšší je jen Mount Everest. Hora leží celá v Argentině, kousek od hranice s Chile. Déšť z mraků od Tichého oceánu spadne dřív, než mraky přejdou hory, a proto je na argentinské straně kolem Aconcaguy sucho."}, {"nazev": "Vodopády Iguazú", "druh": "priroda", "text": "Na hranici s Brazílií padá řeka Iguazú přes skalní stupeň. Vodopády tvoří oblouk široký skoro 3 km a skládají se z 275 jednotlivých vodopádů. Nejvyšší z nich, Ďáblův chřtán, měří 80 m. Vodní tříšť neustále smáčí okolní prales. Roste v něm přes 2 000 druhů rostlin a žije tu asi 400 druhů ptáků, třeba vzácná harpyje pralesní. Mezi stromy se ozývají opice vřešťani a v řece plavou kajmani."}, {"nazev": "Ledovec Perito Moreno", "druh": "priroda", "text": "Na jihu Argentiny, v Patagonii, leží národní park Los Glaciares – „Ledovce“. Ledovce pokrývají asi polovinu jeho plochy a mnohé z nich napájí Jižní patagonské ledové pole. Nejslavnější je Perito Moreno. Jeho čelo se sune do jezera Argentino a občas přehradí jeho úzké rameno, takže voda za ním stoupne. Z ledovce se s hromovým rachotem odlamují ledové kry a padají do jezera. Park je památkou UNESCO."}], "zvirata": [{"nazev": "Velryba jižní", "text": "K poloostrovu Valdés připluje každý rok přes 1 500 velryb jižních. Je to pro ně nejdůležitější místo na světě, kde rodí mláďata.", "foto": {"src": "img/d_jiz_velryba.jpg", "autor": "Naturedata", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Southern_Right_Whale_-_Golfo_Nuevo.jpg"}}, {"nazev": "Tučňák magellanský", "text": "Na poloostrově Valdés hnízdí desítky tisíc tučňáků magellanských. Tučňáky tu uvidíš, aniž bys musel jet až do Antarktidy."}, {"nazev": "Nandu", "text": "Největší pták Jižní Ameriky. Neumí létat, ale rychle běhá po pampě. Dřív na hejna nandu číhali v trávě jaguáři a pumy."}], "zivi": "Na pampě Argentina pěstuje sóju, pšenici a kukuřici a chová hovězí dobytek. Nejvíc vydělává na sóji: v roce 2025 tvořila sója a výrobky z ní asi čtvrtinu (25 %) vývozu. Argentina je největším vývozcem sójového šrotu (krmiva pro zvířata) a sójového oleje na světě. Je také největším vývozcem yerby maté – sušených listů, ze kterých se připravuje maté.", "kultura": ["Mezi chudšími obyvateli měst Buenos Aires a Montevideo vzniklo tango – hudba, tanec i písně. Od roku 2009 patří mezi nehmotné dědictví UNESCO.", "Asado je maso pečené na roštu, kterému se říká parrilla. Patří k nedělím s rodinou a přáteli a ke kultuře gaučů z pampy.", "Fotbal je v Argentině skoro náboženství. Argentina se stala mistrem světa třikrát: v letech 1978, 1986 a 2022."], "zapamatuj": ["Buenos Aires – hlavní město", "pampa – gaučové a krávy", "Aconcagua – nejvyšší hora Ameriky", "tango, asado, fotbal"], "vic": ["Uprostřed argentinské vlajky svítí zlaté Slunce května s 32 paprsky. Stejné slunce bylo vyražené na prvních argentinských mincích z roku 1813.", "Eva Perónová, zvaná Evita, byla manželkou argentinského prezidenta Juana Peróna. O jejím životě vznikl slavný muzikál „Evita“ (1978) a v roce 1996 i film, ve kterém ji hrála zpěvačka Madonna.", "Na úplném jihu leží ostrov Ohňová země. Mořeplavci mu dali jméno podle ohňů, které na něm viděli hořet – pálili je místní indiáni Yámanové."], "ukoly": [{"typ": "vyber", "otazka": "Proč je v Buenos Aires v lednu tepleji (24,9 °C) než v červenci (11,0 °C)?", "moznosti": ["Leží na jižní polokouli, kde je v lednu léto", "V lednu tam fouká teplý vítr od hor And", "Leží blízko rovníku, kde je pořád horko", "V červenci tam každý den prší a mrzne"], "spravne": 0, "napoveda": "Podívej se do základních údajů – podnebí."}, {"typ": "pravda", "tvrzeni": "Pampa je hustý prales plný vysokých stromů.", "pravda": false, "napoveda": "Přečti si „Ve zkratce“, co je pampa."}, {"typ": "vyber", "otazka": "Proč se v argentinské pampě daří sóji, pšenici a kukuřici?", "moznosti": ["Leží vysoko v Andách, kde je chladno", "Je to rovina s úrodnou půdou", "Pole tam každý rok pohnojí mořský příliv", "Je to prales, který pole chrání před větrem"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“ – co se píše o pampě?"}], "hadanka": ["Na mé hranici s Brazílií padá 275 vodopádů Iguazú.", "Mám nejvyšší horu celé Ameriky – Aconcaguu.", "Jsem vlast tanga, fotbalu a gaučů na pampě."], "par": {"vec": "Aconcagua", "zvire": "velryby u poloostrova Valdés"}, "fotky": [{"src": "img/ju_perito.jpg", "autor": "Diego Delso", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AGlaciar_Perito_Moreno14_-_Argentina.JPG", "cap": "Ledovec Perito Moreno"}, {"src": "img/ju_iguazu.jpg", "autor": "Josep M. Gracia", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AGD_-_Devil%27s_Throat_from_a_Brazilian_viewpoint_at_Iguazu_Falls%2C_2023.jpg", "cap": "Vodopády Iguazú – Ďáblův chřtán"}, {"src": "img/ju_aconcagua.jpg", "autor": "Mauricio V. Genta", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AAconcagua_%28Mendoza%29_2022-11_%281%29.jpg", "cap": "Aconcagua, nejvyšší hora Ameriky"}, {"src": "img/ju_tango.jpg", "autor": "McKay Savage from London, UK", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AArgentina_-_Buenos_Aires_060_-_tango_show_%286979621857%29.jpg", "cap": "Tango v Buenos Aires"}, {"src": "img/ju_gauco.jpg", "autor": "Bernard Gagnon", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AGauchos_in_Calchaqu%C3%AD_Valleys%2C_Argentina_04.jpg", "cap": "Gaučové ženou stádo"}], "kratce": ["Argentina je známá tangem, fotbalem a gaučy – pastevci na koních.", "Kolem Buenos Aires se táhne pampa, travnatá rovina se stády krav.", "V Buenos Aires a jeho okolí žije skoro třetina všech obyvatel Argentiny.", "Na úrodné pampě pěstuje sóju, pšenici a kukuřici – nejvíc vydělává na vývozu sóji.", "Na západě stojí Aconcagua, nejvyšší hora celé Ameriky.", "Na hranici s Brazílií padají vodopády Iguazú – nejvyšší z nich, Ďáblův chřtán, měří 80 m.", "Na jihu se lámou kry z ledovce Perito Moreno a k poloostrovu Valdés připlouvají velryby."], "zapis": ["[Buenos Aires] – hlavní město", "[pampa] – travnatá rovina se stády krav", "v Buenos Aires a okolí žije skoro [třetina] obyvatel", "[Aconcagua] – nejvyšší hora Ameriky", "vodopády [Iguazú] na hranici s Brazílií", "tanec [tango]"], "temata": {"priroda": {"polozky": [{"nazev": "Pampa a nandu", "text": "Kolem Buenos Aires se do dálky táhne pampa – obrovská travnatá rovina. Její jméno pochází z indiánského jazyka kečuánštiny a znamená „rovina bez stromů“. Žije tu nandu, velký pták, který neumí létat. Dřív na jeho hejna číhali v trávě jaguáři a pumy."}, {"nazev": "Aconcagua", "text": "Na západě se zvedají Andy, pohoří dlouhé asi 7 000 km. Jejich nejvyšší horou je Aconcagua: měří 6 962 m a je to nejvyšší hora celé Ameriky. Mezi nejvyššími horami všech světadílů je druhá – vyšší je jen Mount Everest. Déšť od Tichého oceánu spadne dřív, než mraky přejdou hory, a proto je na argentinské straně sucho."}, {"nazev": "Vodopády Iguazú", "text": "Na hranici s Brazílií padá řeka Iguazú přes skalní stupeň. Vodopády tvoří oblouk široký skoro 3 km a skládají se z 275 jednotlivých vodopádů – nejvyšší z nich, Ďáblův chřtán, měří 80 m. V okolním pralese roste přes 2 000 druhů rostlin a žije asi 400 druhů ptáků, třeba vzácná harpyje pralesní."}, {"nazev": "Patagonie: led a velryby", "text": "V národním parku Los Glaciares se ledovec Perito Moreno sune do jezera Argentino a s hromovým rachotem se z něj lámou kry. K poloostrovu Valdés připluje každý rok přes 1 500 velryb jižních – je to pro ně nejdůležitější místo na světě, kde rodí mláďata. Hnízdí tu i desítky tisíc tučňáků magellanských."}], "otazka": {"typ": "pravda", "tvrzeni": "Vodopády Iguazú se skládají z 275 jednotlivých vodopádů.", "pravda": true, "napoveda": "Přečti si položku „Vodopády Iguazú“."}}, "hospodarstvi": {"polozky": [{"nazev": "Pampa – úrodná rovina", "text": "Pampa má mírné vlhké podnebí a úrodnou půdu. Proto patří k nejlepším zemědělským krajům světa. Pěstuje se tu sója, pšenice a kukuřice a na pastvinách se chová hovězí dobytek."}, {"nazev": "Sója", "text": "Argentina je největším vývozcem sójového oleje na světě. První je i ve vývozu sójového šrotu – krmiva pro zvířata, které se vyrábí ze sóji."}, {"nazev": "Yerba maté", "text": "Argentina je největším vývozcem yerby maté – sušených listů, ze kterých se připravuje maté. Listy pocházejí ze stromu, který roste v pralesích u řeky Paraná."}], "otazka": {"typ": "vyber", "otazka": "Čeho je Argentina největším vývozcem na světě?", "moznosti": ["sójového oleje", "mědi a lithia", "kávových zrn", "tropického ovoce"], "spravne": 0, "napoveda": "Přečti si položku „Sója“."}}, "kultura": {"polozky": [{"nazev": "Tango", "text": "Mezi chudšími obyvateli měst Buenos Aires a Montevideo vzniklo tango – hudba, tanec i písně. Od roku 2009 patří k nehmotnému dědictví UNESCO, tedy k tradicím, které má celý svět chránit."}, {"nazev": "Asado", "text": "Asado je maso pečené na roštu, kterému se říká parrilla. Patří k nedělím s rodinou a přáteli a ke kultuře gaučů z pampy."}, {"nazev": "Maté", "text": "Maté je podle zákona z roku 2013 národním nápojem Argentiny. Připravuje se z listů stromu z pralesů u řeky Paraná. Pije se nejčastěji z tykve zvané kalabasa, a to brčkem, kterému se říká bombilla."}, {"nazev": "Gaučové", "text": "Gaučové jsou pastevci na koních, kteří se od 18. století starali o stáda na pampě. Dnes jsou národním symbolem Argentiny a 6. prosince mají svůj svátek."}], "otazka": {"typ": "pravda", "tvrzeni": "Tango vzniklo v horských vesnicích vysoko v Andách.", "pravda": false, "napoveda": "Přečti si položku „Tango“."}}, "sport": {"polozky": [{"nazev": "Třikrát mistrem světa", "text": "Fotbal je v Argentině skoro náboženství. Argentinští fotbalisté se stali mistry světa třikrát: v letech 1978, 1986 a 2022. Na mistrovství světa 2026 se znovu dostali do finále, ale prohráli se Španělskem 0 : 1 po prodloužení."}, {"nazev": "Lionel Messi", "text": "Kapitán Lionel Messi dostal na mistrovství světa v Kataru v roce 2022 Zlatý míč pro nejlepšího hráče turnaje. Stejnou cenu získal už v roce 2014 v Brazílii. Ve finále 2022 porazila Argentina Francii na penalty."}], "otazka": {"typ": "vyber", "otazka": "Kolikrát se Argentina stala mistrem světa ve fotbale?", "moznosti": ["jednou", "dvakrát", "třikrát", "čtyřikrát"], "spravne": 2, "napoveda": "Přečti si položku „Třikrát mistrem světa“."}}, "historie": {"polozky": [{"nazev": "Nezávislost 1816", "text": "Dne 9. července 1816 se ve městě Tucumán sešli zástupci provincií. Vyhlásili, že se jejich země odděluje od španělského krále a je nezávislá. Stalo se to v domě, kterému se dnes říká Casa de Tucumán."}, {"nazev": "Slunce května", "text": "Uprostřed argentinské vlajky svítí zlaté Slunce května s 32 paprsky. Stejné slunce bylo vyražené na prvních argentinských mincích z roku 1813."}, {"nazev": "Evita", "text": "Eva Perónová, zvaná Evita, byla manželkou argentinského prezidenta Juana Peróna. O jejím životě vznikl slavný muzikál „Evita“ (1978) a v roce 1996 i film, ve kterém ji hrála zpěvačka Madonna."}, {"nazev": "Proč Ohňová země", "text": "Na úplném jihu leží ostrov Ohňová země. Mořeplavci mu dali jméno podle ohňů, které na něm viděli hořet – pálili je místní indiáni Yámanové."}], "otazka": {"typ": "pravda", "tvrzeni": "Argentina vyhlásila nezávislost na Španělsku v roce 1816.", "pravda": true, "napoveda": "Přečti si položku „Nezávislost 1816“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (45 851 378 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=AR"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-c

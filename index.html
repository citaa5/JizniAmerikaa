<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autem přes Jižní Ameriku</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito+Sans:ital,wght@0,400;0,700;0,800;1,400&display=swap">
<style>
:root{--bg:#F6F4EE;--paper:#FFFFFF;--sea:#DCE8EC;--land:#E7E1D3;--ink:#16263A;--muted:#5B6676;--line:#D8D0BF;
 --accent:#BF3B1E;--accent2:#2B6E7E;--gold:#B7862A;--ok:#2E7D4F;--bad:#B3261E;--visited:#EFC8BA;--locked:#EEEAE0;
 --stamp:#2B6E7E;--cream:#F2EEE5;--shadow:0 1px 2px rgba(22,38,58,.08),0 6px 18px rgba(22,38,58,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121923;--paper:#1B2430;--sea:#18242F;
 --land:#2A3340;--ink:#EDF1F5;--muted:#A6B0BE;--line:#344052;--accent:#E8785A;--accent2:#63B3C4;--gold:#E0B25A;--ok:#6FCF97;
 --bad:#F28B82;--visited:#5A3A33;--locked:#222B37;--stamp:#63B3C4;--cream:#232D3A;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121923;--paper:#1B2430;--sea:#18242F;--land:#2A3340;--ink:#EDF1F5;--muted:#A6B0BE;
 --line:#344052;--accent:#E8785A;--accent2:#63B3C4;--gold:#E0B25A;--ok:#6FCF97;--bad:#F28B82;--visited:#5A3A33;--locked:#222B37;
 --stamp:#63B3C4;--cream:#232D3A;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:0 40px}
h1,h2,h3{font-family:"Bricolage Grotesque","Nunito Sans",system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit}
.wrap{max-width:1320px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;
 justify-content:space-between;padding-block:12px;border-bottom:2px solid var(--line)}
.top h1{font-size:clamp(20px,2.4vw,28px);font-weight:800}
.kdo{font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.pas{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pas i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);font-style:normal;
 font-size:11px;font-weight:800;color:var(--muted);position:relative}
.pas i.b{width:22px;height:22px;font-size:9px}
.pas i.ok{border:2px solid var(--stamp);background:var(--stamp);color:var(--paper)}
.pas i.star::after{content:"★";position:absolute;top:-8px;right:-7px;color:var(--gold);font-size:13px}
.pas i.cur{outline:3px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:24px;padding-block:18px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.mapcol{position:sticky;top:78px;align-self:start}
@media (max-width:900px){.mapcol{position:static}}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:76vh}
.zeme{fill:var(--land);stroke:var(--bg);stroke-width:1.3}
.zeme.t{cursor:pointer}.zeme.t.lock{fill:var(--locked)}
.zeme.t:hover{filter:brightness(.95)}
.zeme.ok{fill:var(--visited)}.zeme.cur{fill:var(--accent)}
.zeme:focus{outline:none;stroke:var(--accent2);stroke-width:3}
.cesta{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;opacity:.55}
.odb{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-dasharray:2 7;stroke-linecap:round}
.bod{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}.bod.ok{fill:var(--stamp);stroke:var(--stamp)}
.bod.b{r:5}
.lbl{font:800 15px "Nunito Sans",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:5px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:8px 4px}
.legend b{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px clamp(16px,2.6vw,30px);
 display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.eyebrow .tag{color:var(--paper);background:var(--accent);padding:2px 9px;border-radius:999px}
.eyebrow .tag.b{background:var(--gold)}
.card h2{font-size:clamp(32px,4.2vw,48px);font-weight:800;letter-spacing:-.01em}
.typicky{font-size:19px;font-weight:700;color:var(--accent2);margin:0;max-width:60ch}
.fakta-radek{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--muted)}
.fakta-radek b{color:var(--ink)}
.gal .hero{position:relative;border-radius:12px;overflow:hidden;background:var(--cream)}
.gal .hero img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.gal .hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font-weight:700;
 background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:16px}
.gal .hero figcaption small{display:block;font-weight:400;font-size:11px;opacity:.85}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.thumbs button{padding:0;border:3px solid transparent;border-radius:9px;overflow:hidden;cursor:pointer;background:var(--cream)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.sekce h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px;font-weight:800}
.zast{display:grid;gap:12px}
.zast article{border-left:4px solid var(--accent);padding:2px 0 2px 14px}
.zast h4{margin:0 0 3px;font-size:19px;font-family:"Bricolage Grotesque",sans-serif}
.zast p{margin:0;max-width:66ch}
.vedeli{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.vedeli li{background:var(--cream);border-radius:10px;padding:10px 14px;max-width:70ch}
.vedeli li::before{content:"Věděli jste? ";font-weight:800;color:var(--accent)}
.kontrola{border:3px dashed var(--stamp);border-radius:16px;padding:18px clamp(14px,2vw,22px);display:grid;gap:14px}
.kontrola h3{color:var(--stamp);font-size:20px;letter-spacing:.02em;text-transform:none;margin:0}
.q{font-size:19px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:11px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:700}
.opts button:hover{border-color:var(--accent2)}
.opts button.spatne{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts button.dobre{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.opts button:focus-visible,.btn:focus-visible,.thumbs button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.napoveda{color:var(--bad);font-weight:700;margin:0}
.krok{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.razitko-box{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:520px){.razitko-box{grid-template-columns:1fr}}
.razitko{width:132px;height:132px;border-radius:50%;border:5px double var(--stamp);color:var(--stamp);display:grid;place-items:center;text-align:center;
 font:800 13px/1.15 "Bricolage Grotesque",sans-serif;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-12deg);padding:12px}
.razitko big{display:block;font-size:17px}
.razitko.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.heslo{font:800 clamp(30px,5vw,44px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:.08em;color:var(--accent)}
.prechod{background:var(--accent);color:var(--paper);border-radius:12px;padding:12px 16px;font-weight:800}
.prechod a{color:inherit;text-decoration:underline}
.dal{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.sec{background:var(--cream);color:var(--ink);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#1b1405}
.btn:disabled{opacity:.4;cursor:default}
details.vic{border:2px solid var(--gold);border-radius:14px;padding:12px 16px}
details.vic summary{cursor:pointer;font-weight:800;color:var(--gold);font-size:17px}
details.vic ul{margin:10px 0;padding-left:20px;display:grid;gap:8px}
details.zdroje{font-size:13px;color:var(--muted)}
details.zdroje summary{cursor:pointer;font-weight:700}
details.zdroje ul{padding-left:18px;display:grid;gap:4px;margin:6px 0 0}
details.zdroje a{color:var(--accent2);word-break:break-all}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,18,28,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--paper);color:var(--ink);border-radius:18px;max-width:640px;width:100%;padding:26px clamp(18px,3vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.35);
 display:grid;gap:14px;max-height:92vh;overflow:auto}
.dialog h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.dialog ol{margin:0;padding-left:22px;display:grid;gap:6px}
.cislo{font:800 64px/1 "Bricolage Grotesque",sans-serif;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
 padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.ucitel{max-width:1100px}
.tabwrap{overflow-x:auto}
table.hes{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;min-width:760px}
table.hes th,table.hes td{border:1px solid var(--line);padding:5px 7px;text-align:left}
table.hes th{background:var(--cream);font-size:12px}
table.hes .p{background:rgba(191,59,30,.12)}
table.hes td:first-child{font-weight:800;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:8px;border-radius:8px}
@media (prefers-reduced-motion: reduce){.razitko.pop{animation:none}}

/* ── úvod, dopravní prostředky, přílet (převzato z v1) ── */
.intro{max-width:780px;gap:16px}
.intro h2{font-size:clamp(30px,5vw,48px)}
.intro .kroky{display:flex;gap:6px}.intro .kroky i{width:28px;height:6px;border-radius:3px;background:var(--line)}.intro .kroky i.on{background:var(--accent)}
.intro ol li{opacity:0;animation:fadein .5s ease-out forwards;animation-delay:calc(var(--i) * .35s + .3s)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scena{background:var(--sea);border-radius:14px;overflow:hidden}
.scena svg{display:block;width:100%;height:auto}
.scena .pruvod{animation:pruvod 9s linear infinite}
@keyframes pruvod{from{transform:translateX(-560px)}to{transform:translateX(760px)}}
.scena .hup{animation:hup .4s ease-in-out infinite}
@keyframes hup{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.vozy{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.vozy button{border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:10px 6px 8px;cursor:pointer;
 display:grid;justify-items:center;gap:4px;font-weight:800}
.vozy button svg{width:100%;max-width:110px;height:auto}
.vozy button:hover{border-color:var(--accent2)}
.vozy button[aria-pressed="true"]{border-color:var(--accent);background:var(--cream);animation:vybrano .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes vybrano{from{transform:scale(.9)}to{transform:scale(1)}}
.cislo.toc{animation:toc .12s linear infinite}
@keyframes toc{50%{opacity:.4}}
#car.jede .tvar{animation:hup .35s ease-in-out infinite}
.prijezd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--cream);border-radius:14px;padding:14px 16px;
 border-left:5px solid var(--accent);animation:prijezd .6s ease-out}
.prijezd svg{width:84px;height:auto}
.prijezd .vita{font:800 clamp(18px,2.4vw,22px)/1.25 "Bricolage Grotesque",sans-serif}
.prijezd p{margin:4px 0 0}
.prijezd b{color:var(--accent2)}
@keyframes prijezd{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
#karta.vjezd{animation:fadein .45s ease-out}
canvas.konfety{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ── v2: karta státu ── */
.udaje{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;grid-auto-flow:dense}
.udaje .siroky{grid-column:span 2}
@media (max-width:330px){.udaje .siroky{grid-column:auto}}
.udaje div{background:var(--cream);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.udaje small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.udaje b{font-size:18px;line-height:1.25}
.udaje em{font-style:normal;font-size:12px;color:var(--muted)}
.poloha{margin:-8px 0 0;color:var(--muted)}
.pojem{background:color-mix(in srgb,var(--gold) 16%,var(--paper));border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0}
.minihra-hlava{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.pexeso{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:10px 0}
.pk{min-height:78px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--paper);font:inherit;font-weight:800;font-size:14px;padding:6px;cursor:pointer;transition:transform .15s}
.pk span{font-size:28px;color:var(--gold)}.pk:hover{transform:translateY(-2px)}
.pk.lic{background:var(--paper);color:var(--ink);border-color:var(--gold)}.pk.lic.slovo{font-size:16px}.pk.lic.popis{font-weight:600}
.pk.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));cursor:default}
.spoj{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;margin:10px 0}.spoj>div{display:grid;gap:8px;align-content:start}
.sp{text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;padding:10px 12px;cursor:pointer}
.sp.l{font-weight:800}.sp[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sp.ok{background:var(--b);border-color:var(--b);color:#fff;cursor:default}.sp.vedle{animation:vedle .4s}
.pismena{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pis{width:46px;height:50px;border-radius:10px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:22px;cursor:pointer}
.pis:disabled{opacity:.25}.mezera{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);padding:0 6px;letter-spacing:.06em}
.vyrok{font-size:19px;line-height:1.45;background:var(--cream);border-radius:12px;padding:12px 14px;margin:8px 0}
.casovac{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}.casovac i{display:block;height:100%;background:var(--accent);animation:ubyva linear forwards}
@keyframes ubyva{from{width:100%}to{width:0}}
.opts.dva{grid-template-columns:1fr 1fr}
.suvenyr{font-weight:800}.suvenyr span{font-size:26px;vertical-align:middle}
.vk-suv{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:24px;margin:6px 0}.vk-suv span{opacity:.35}.vk-suv span.ma{opacity:1}
@media (prefers-reduced-motion: reduce){.casovac i{animation:none}.pk{transition:none}}
#car[data-dir="-1"] .cislo{transform:scale(-1,1);transform-box:fill-box;transform-origin:center}
.kdo b.kod{letter-spacing:.08em;background:var(--paper);color:var(--ink);padding:1px 6px;border-radius:6px}
.kodcesty{margin:8px 0 0;font-size:15px}.kodcesty b{letter-spacing:.08em;font-size:17px}
@media (max-width:700px){.kdo{white-space:normal}}
.srovnani{margin:14px 0 0}.srovnani img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}.srovnani figcaption{font-size:15px;margin-top:6px;color:var(--muted)}
.zast .druh{display:inline-block;font:800 11px/1 "Nunito Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;
 padding:4px 8px;margin-bottom:5px;background:var(--ok);color:var(--paper)}
.zast .druh.pamatka{background:var(--gold);color:#1b1405}.zast .druh.mesto,.zast .druh.technika{background:var(--accent2)}
.podnebi{margin:0;background:var(--sea);border-radius:12px;padding:10px 14px}
.zast article.priroda{border-left-color:var(--ok)}.zast article.pamatka{border-left-color:var(--gold)}.zast article.mesto,.zast article.technika{border-left-color:var(--accent2)}
.zvirata{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.zvirata article{background:var(--cream);border-radius:12px;overflow:hidden}
.zvirata img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.zvirata div{padding:10px 12px}
.zvirata h4{margin:0 0 3px;font:800 17px "Bricolage Grotesque",sans-serif}
.zvirata p{margin:0;font-size:15px}
.dve{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.dve{grid-template-columns:1fr}}
.dve p{margin:0}.dve ul{margin:0;padding-left:20px;display:grid;gap:6px}
.zapis{background:var(--cream);border:2px solid var(--accent);border-radius:14px;padding:14px 18px}
.zapis h3{margin:0 0 8px;font-size:18px;color:var(--accent)}
.zapis ul{margin:0;padding-left:22px;display:grid;gap:4px;font-weight:700}
/* ── v2: výzva oblasti ── */
.hra{border:3px solid var(--gold);border-radius:16px;padding:18px clamp(14px,2vw,22px);display:grid;gap:14px}
.karty{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.kk{border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:9px 13px;font-weight:800;cursor:pointer}
.kk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--paper);transform:translateY(-2px)}
.kose{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kos{border:3px dashed var(--accent2);border-radius:14px;background:var(--paper);color:var(--ink);padding:12px;text-align:left;cursor:pointer;
 display:grid;gap:6px;align-content:start;min-height:110px}
.kos b{font:800 18px "Bricolage Grotesque",sans-serif;color:var(--accent2)}
.kos span{display:flex;flex-wrap:wrap;gap:5px}
.kos i{font-style:normal;font-size:13px;font-weight:700;background:var(--ok);color:var(--paper);border-radius:6px;padding:3px 7px}
.kos.vedle{animation:vedle .4s;border-color:var(--bad)}
@keyframes vedle{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.indicie{margin:0;padding-left:24px;display:grid;gap:8px;font-size:18px;font-weight:700}
.indicie li{animation:fadein .4s ease-out}
.skore{font:800 clamp(40px,7vw,60px)/1 "Bricolage Grotesque",sans-serif;color:var(--accent)}
.odznak{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.odznak .medaile{width:96px;height:96px;border-radius:50%;background:var(--gold);color:#1b1405;display:grid;place-items:center;text-align:center;
 font:800 12px/1.1 "Bricolage Grotesque",sans-serif;padding:10px;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--gold);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.odznak .medaile.ne{background:var(--locked);color:var(--muted);box-shadow:0 0 0 3px var(--line);animation:none}

druhů na světě. Celkem 79 z nich nežije nikde jinde."}, {"nazev": "Vosková palma", "text": "Národní strom Kolumbie. Roste v horách a dorůstá až 60 m – to je výška dvacetipatrového domu.", "foto": {"src": "img/c_kol_cocora.jpg", "autor": "Ricardo Gonzalez Arango", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ACocora_Valley.jpg"}}, {"nazev": "Orchidej Cattleya", "text": "Národní květina Kolumbie od roku 1936. Lidé jí říkají „májová květina“.", "foto": {"src": "img/d_and_orchidej.jpg", "autor": "QuazDelaCruz", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Cattleya_trianae_tipo.jpg"}}], "zivi": "Kolumbie je třetím největším pěstitelem kávy na světě a druhým největším vývozcem řezaných květin – pochází z ní asi 60 % všech květin prodaných v USA. Do ciziny prodává také banány. V některých oblastech se ale nelegálně pěstuje i koka, ze které se vyrábí droga kokain.", "kultura": ["Nejznámějším kolumbijským tancem je cumbia. Páry ji tančí v kruhu za zvuku bubnů a tanečnice často drží v ruce svazek hořících svíček.", "Ve městě Barranquilla se každý rok slaví čtyřdenní karneval s maskami, bubny a cumbií. UNESCO ho zapsalo mezi nehmotné dědictví lidstva.", "Národním sportem je tejo. Hráči házejí železný kotouč na kovový kruh zapuštěný v jílu. Na okraj kruhu se kladou papírové obálky se střelným prachem. Když je kotouč trefí a obálka bouchne, získá hráč 3 body."], "zapamatuj": ["Bogotá – hlavní město", "jméno podle Kryštofa Kolumba", "káva, květiny, banány", "pobřeží u dvou oceánů"], "vic": ["Kolumbie dostala jméno na počest Kryštofa Kolumba – španělsky Cristóbala Colóna. Ten v roce 1492 vedl první španělskou výpravu, která doplula do Ameriky.", "Na kolumbijské vlajce znamená žlutá bohatství země, modrá dvě mořská pobřeží a červená krev hrdinů, kteří bojovali za svobodu.", "Spisovatel Gabriel García Márquez, rodák ze severní Kolumbie, dostal v roce 1982 Nobelovu cenu za literaturu."], "ukoly": [{"typ": "vyber", "otazka": "Po kom dostala Kolumbie své jméno?", "moznosti": ["po Simónu Bolívarovi", "po Kryštofu Kolumbovi", "po Charlesi Darwinovi", "po generálu Sucrovi"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "Kolumbie má pobřeží u Tichého oceánu i u Karibského moře.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "vyber", "otazka": "Proč se v Kolumbii pěstuje káva na horských svazích, a ne v nížinách?", "moznosti": ["Na svazích je chladněji než v horkých nížinách", "V nížinách je na kávu moc zima a často tam mrzne", "Kávovník potřebuje každou zimu sníh a mráz", "Z hor se káva rychleji dopraví do přístavů"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“ – větu o kávě."}], "hadanka": ["Mým národním sportem je hra, při které bouchají obálky se střelným prachem.", "V mých horách rostou voskové palmy vysoké až 60 m.", "Jmenuji se po Kryštofu Kolumbovi a pěstuji spoustu kávy."], "par": {"vec": "káva a květiny", "zvire": "vosková palma"}, "fotky": [{"src": "img/ju_kava.jpg", "autor": "Ricohin", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AChinchin%C3%A1_cafetal_2.jpg", "cap": "Kávovníky na svazích And"}, {"src": "img/c_kol_cocora.jpg", "autor": "Ricardo Gonzalez Arango", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ACocora_Valley.jpg", "cap": "Voskové palmy v údolí Cocora"}, {"src": "img/c_kol_cano.jpg", "autor": "Xatly2", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ACanno_Cristales-20180822-131651.jpg", "cap": "Barevná řeka Caño Cristales"}, {"src": "img/c_kol_cartagena.jpg", "autor": "Bernard Gagnon", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ACity_walls_of_Cartagena_01.jpg", "cap": "Pevnost a hradby Cartageny"}, {"src": "img/d_and_cumbia.jpg", "autor": "Norma Gòmez", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:Baile_de_la_Cumbia_-_Barranquilla.jpg", "cap": "Tanec cumbia na karnevalu"}], "kratce": ["Kolumbie dostala jméno podle Kryštofa Kolumba.", "Má pobřeží u Tichého oceánu i u Karibského moře.", "Kávu pěstuje na chladných svazích And a vypěstuje jí třetí nejvíc na světě.", "Do ciziny prodává také řezané květiny a banány.", "V horách roste vosková palma, národní strom Kolumbie. Dorůstá až 60 m."], "zapis": ["[Bogotá] – hlavní město", "jméno podle Kryštofa [Kolumba]", "pěstuje [kávu], květiny a banány", "pobřeží u Tichého oceánu i [Karibského moře]"], "temata": {"priroda": {"polozky": [{"nazev": "Voskové palmy v údolí Cocora", "text": "V horách na západě země leží údolí Cocora. Nad pastvinami tu čnějí voskové palmy vysoké až 60 m – to je výška dvacetipatrového domu. Vosková palma je národní strom Kolumbie."}, {"nazev": "Caño Cristales – barevná řeka", "text": "V národním parku Sierra de la Macarena teče řeka Caño Cristales. Její dno pokrývá vodní rostlina macarenia. Bývá hlavně červená a růžová, někdy i zelená nebo žlutá, a řeka pak hraje barvami. Nejkrásnější je od června do listopadu, v období dešťů."}, {"nazev": "Ptáci a orchideje", "text": "V Kolumbii žije přes 1 900 druhů ptáků – skoro pětina všech ptačích druhů na světě. Celkem 79 z nich nežije nikde jinde. Národní květinou je od roku 1936 orchidej Cattleya, lidově „májová květina“."}], "otazka": {"typ": "pravda", "tvrzeni": "Řeku Caño Cristales barví do červena vodní rostlina macarenia.", "pravda": true, "napoveda": "Přečti si položku „Caño Cristales – barevná řeka“."}}, "hospodarstvi": {"polozky": [{"nazev": "Káva z horských svahů", "text": "Kolumbie je třetím největším pěstitelem kávy na světě, po Brazílii a Vietnamu. Na strmých svazích And by se velká pole nevešla. Rodiny proto sázejí kávovníky na malá políčka, často na mýtiny v lese. Kávová krajina patří od roku 2011 mezi památky UNESCO."}, {"nazev": "Květiny a banány", "text": "Kolumbie je druhým největším vývozcem řezaných květin na světě. Pochází z ní asi 60 % všech květin prodaných v USA. Do ciziny prodává také banány – v roce 2023 to bylo asi 1,7 milionu tun."}, {"nazev": "Nelegální koka", "text": "V některých oblastech se nelegálně pěstuje keř koka. Z jeho listů se vyrábí droga kokain. V roce 2023 zabírala pole koky v Kolumbii asi 253 000 hektarů."}], "otazka": {"typ": "vyber", "otazka": "Kolik ze všech květin prodaných v USA pochází z Kolumbie?", "moznosti": ["asi 10 %", "asi 25 %", "asi 60 %", "asi 90 %"], "spravne": 2, "napoveda": "Přečti si položku „Květiny a banány“."}}, "kultura": {"polozky": [{"nazev": "Cumbia", "text": "Nejznámějším kolumbijským tancem je cumbia. Páry ji tančí v kruhu za zvuku bubnů a tanečnice často drží v ruce svazek hořících svíček."}, {"nazev": "Karneval v Barranquille", "text": "Ve městě Barranquilla se každý rok slaví čtyřdenní karneval s maskami, bubny a cumbií. UNESCO ho zapsalo mezi nehmotné dědictví lidstva – tedy mezi tradice, které stojí za to chránit."}, {"nazev": "Gabriel García Márquez", "text": "Spisovatel Gabriel García Márquez se narodil na severu Kolumbie. V roce 1982 dostal Nobelovu cenu za literaturu."}], "otazka": {"typ": "pravda", "tvrzeni": "Karneval v Barranquille trvá celý měsíc.", "pravda": false, "napoveda": "Přečti si položku „Karneval v Barranquille“."}}, "sport": {"polozky": [{"nazev": "Tejo – národní sport", "text": "Národním sportem je tejo. Hráči házejí železný kotouč na kovový kruh zapuštěný v jílu. Na okraj kruhu se kladou papírové obálky se střelným prachem. Když je kotouč trefí a obálka bouchne, získá hráč 3 body."}, {"nazev": "Egan Bernal", "text": "Tour de France je velký cyklistický závod, který se jede po etapách hlavně ve Francii. V roce 2019 ho jako první Kolumbijec – a vůbec první Jihoameričan – vyhrál Egan Bernal. Bylo mu teprve 22 let."}, {"nazev": "Mariana Pajón", "text": "BMX jsou závody na malých kolech po trati plné skoků a klopených zatáček. Mariana Pajón v nich vyhrála zlato na olympiádě v Londýně 2012 i v Riu 2016 a v Tokiu 2021 přidala stříbro. Podle Guinnessovy knihy rekordů má nejvíc olympijských medailí v BMX ze všech žen."}], "otazka": {"typ": "vyber", "otazka": "Ve kterém sportu vyhrála Mariana Pajón dvě olympijská zlata?", "moznosti": ["v plavání", "v BMX", "v tenise", "v boxu"], "spravne": 1, "napoveda": "Přečti si položku „Mariana Pajón“."}}, "historie": {"polozky": [{"nazev": "Cartagena", "text": "Na severu Kolumbie leží v zátoce Karibského moře přístav Cartagena. O bohatý přístav se přely evropské mocnosti, a tak ho Španělé od roku 1586 obehnali hradbami a pevnostmi. Podle UNESCO jsou to nejrozsáhlejší pevnosti v celé Jižní Americe."}, {"nazev": "Cesta k nezávislosti", "text": "Dne 20. července 1810 sesadili vzbouřenci v Bogotě španělského místokrále. Tento den slaví Kolumbie jako Den nezávislosti. V roce 1819 porazil generál Simón Bolívar Španěly v bitvě u Boyacá. Vznikla Velká Kolumbie. Patřily k ní i dnešní Venezuela a Panama a od roku 1822 také Ekvádor."}, {"nazev": "Jméno a vlajka", "text": "Kolumbie dostala jméno na počest Kryštofa Kolumba – španělsky Cristóbala Colóna. Ten v roce 1492 doplul do Ameriky. Na vlajce znamená žlutá bohatství země, modrá dvě mořská pobřeží a červená krev hrdinů, kteří bojovali za svobodu."}], "otazka": {"typ": "pravda", "tvrzeni": "Kolumbie slaví Den nezávislosti 20. července.", "pravda": true, "napoveda": "Přečti si položku „Cesta k nezávislosti“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (53 425 635 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=CO"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Kávová kulturní krajina Kolumbie – malá políčka v horském lese, přizpůsobení strmým svahům, UNESCO 2011", "https://whc.unesco.org/en/list/1121/"], ["Káva: Kolumbie 3. největší pěstitel po Brazílii a Vietnamu (USDA, Coffee: World Markets and Trade, červenec 2026)", "https://apps.fas.usda.gov/psdonline/circulars/coffee.pdf"], ["Vosková palma (Ceroxylon quindiuense) – nejvyšší palma světa, dorůstá až 60 m; národní strom Kolumbie (Guinness World Records, 2024)", "https://www.guinnessworldrecords.es/news/2024/3/la-palma-de-cera-del-quindio-colombiano-establecio-record-mundial"], ["Vosková palma – národním stromem od roku 1985, roste do výšky až 60 m (Observatorio Ambiental de Bogotá, městský úřad pro životní prostředí)", "https://oab.ambientebogota.gov.co/palma-de-cera-el-arbol-nacional-que-adorna-varios-sectores-de-bogota/"], ["Caño Cristales v NP Sierra de La Macarena: vodní rostlina macarenia (Rhyncholacis clavigera) barví řeku do červena a růžova, někdy do zelena či žluta; nejkrásnější od června do listopadu, kvete díky dešťům duben–listopad (Parques Nacionales Naturales de Colombia, 2025)", "https://www.parquesnacionales.gov.co/sala-prensa/noticias/inicia-la-temporada-2025-de-esplendor-en-cano-cristales-junto-a-otros-tesoros-naturales-imperdibles-de-la-macarena/"], ["Macarenia – zelené, žluté, růžové a červené odstíny; sezona 2026 (Parques Nacionales Naturales de Colombia, 2026)", "https://www.parquesnacionales.gov.co/sala-prensa/noticias/inicia-temporada-en-cano-cristales-naturalmente-responsable/"], ["Cartagena – nejrozsáhlejší pevnosti v Jižní Americe, UNESCO 1984", "https://whc.unesco.org/en/list/285/"], ["Kolumbie – 2. největší vývozce řezaných květin na světě, asi 60 % květin prodaných v USA (USDA FAS, GAIN report CO2026-0004)", "https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Colombian+Flowers+and+the+American+Market+After+Six+Decades+of+Growth_Bogota_Colombia_CO2026-0004.pdf"], ["Banány 2023: Ekvádor největší vývozce na světě (asi 6,2 mil. t z 19,3 mil. t), Kolumbie 1,7 mil. t (FAO, Banana Market Review 2023)", "https://openknowledge.fao.org/server/api/core/bitstreams/1085e3ed-0f37-4e7d-848d-cdfe203be158/content"], ["Koka v Kolumbii: 253 000 ha v roce 2023, výroba kokainu (UNODC, tisková zpráva 2024)", "https://www.unodc.org/unodc/press/releases/2024/October/colombia_-potential-cocaine-production-increased-by-53-per-cent-in-2023--according-to-new-unodc-survey.html"], ["Kolumbie: přes 1 900 druhů ptáků, skoro 20 % světa, 79 endemitů (Colombia Country Brand, vládní)", "https://colombia.co/en/allies/colombia-one-worlds-megadiverse-countries-1900-species-birds"], ["Vlajka (modrá = dvě mořská pobřeží), národní pták kondor, orchidej Cattleya trianae národní květinou od 1936, vosková palma, cumbia, národní sport tejo (Ministerstvo zahraničí Kolumbie)", "https://www.cancilleria.gov.co/en/general-information"], ["Cumbia – páry tančí v kruhu za zvuku bubnů, tanečnice drží svazek hořících svíček (Ministerstvo kultury Kolumbie, Plán ochrany cumbie)", "https://www.mincultura.gov.co/direcciones/patrimonio-y-memoria/Documents/plan-especial-de-salvagurdia-cumbia.pdf"], ["Karneval v Barranquille – čtyři dny před postní dobou, převládá cumbia, masky (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/carnival-of-barranquilla-00051"], ["Pravidla teja: železný tejo se hází na kovový kruh (bocín) v jílu; zásah obálky se střelným prachem, který vybuchne, se počítá za 3 body (Ministerstvo sportu Kolumbie, Reglamento de Tejo)", "https://www.mindeporte.gov.co/files/a08e366c-3d88-483b-af5c-83208ec6e435/a08e43e7-b7b6-4774-bee8-75fb986a0ec8/reglamento-de-tejo.pdf"], ["Jméno Kolumbie odkazuje na Kryštofa Kolumba (Cristóbal Colón), který v roce 1492 doplul do Ameriky (Colombia Country Brand, vládní portál)", "https://colombia.co/en/colombia-country/discover-the-difference-between-colombia-the-country-and-columbia?language_content_entity=en"], ["Gabriel García Márquez – Nobelova cena za literaturu 1982, narozen v Kolumbii (Nobelova nadace)", "https://www.nobelprize.org/prizes/literature/1982/marquez/biographical/"], ["Vlajka (žlutá = bohatství, modrá = dvě mořská pobřeží, červená = krev hrdinů), národní pták kondor, orchidej Cattleya trianae národní květinou od 1936, cumbia, národní sport tejo (Ministerstvo zahraničí Kolumbie)", "https://www.cancilleria.gov.co/en/general-information"], ["Egan Bernal z Bogoty – první vítěz Tour de France z Jižní Ameriky, 2019 (UCI, Mezinárodní cyklistická unie)", "https://www.uci.org/article/tour-de-france-the-non-european-winners-from-lemond-to-bernal/1mjHBbIXYrRXuzHxywGK5G"], ["Egan Bernal – ve 22 letech první Kolumbijec, který vyhrál Tour de France (Olympics.com, MOV)", "https://www.olympics.com/en/athletes/egan-bernal"], ["Mariana Pajón – zlato v BMX na OH 2012 a 2016, stříbro 2021; rekord: nejvíc olympijských medailí v BMX mezi ženami (Guinness World Records, 2023)", "https://www.guinnessworldrecords.com/news/2023/3/mariana-pajons-incredible-journey-from-first-bmx-ride-at-five-to-olympic-gold-739856"], ["OH Paříž 2024: BMX ženy – zlato Sakakibara, stříbro Veenstra, bronz Claessens; Pajón vypadla v semifinále (UCI)", "https://www.uci.org/article/olympic-games-paris-2024-sakakibara-and-daudet-win-bmx-racing-gold/01gLJoZZbZ3x3pEbdhnxqx"], ["Nezávislost: 20. 7. 1810 vzbouřenci v Bogotě sesadili místokrále, Den nezávislosti 20. 7.; 7. 8. 1819 Bolívar porazil Španěly u Boyacá; Ekvádor se k Velké Kolumbii připojil 1822 (Library of Congress, Country Profile: Colombia 2007)", "https://tile.loc.gov/storage-services/master/frd/copr/Colombia.pdf"], ["Kolumbijský svaz zahrnoval dnešní Kolumbii, Ekvádor, Venezuelu a Panamu; Ekvádor a Venezuela odešly 1830, Panama 1903 (U.S. Department of State, Office of the Historian)", "https://history.state.gov/countries/colombia"]], "hesla": ["KOLIBŘÍK 43", "KAJMAN 55", "MANGO 56", "KOLIBŘÍK 59", "MANGO 76", "KOTVA 92", "SMARAGD 20", "KAKTUS 54", "KAJMAN 22", "PIRÁT 82", "SMARAGD 79", "SMARAGD 48", "OCELOT 47", "PAPOUŠEK 69", "PIRÁT 29", "PIRÁT 84", "KOTVA 50", "KOTVA 14", "KAJMAN 58", "KAKTUS 57", "PAPÁJA 70", "KOLIBŘÍK 65", "OCELOT 91", "PAPÁJA 62", "OCELOT 74", "PAPOUŠEK 25", "PAPÁJA 38", "MANGO 99", "PAPOUŠEK 95", "KAKTUS 96"]}, {"k": "ekvador", "n": "Ekvádor", "ne": "Ecuador", "x": 249.4, "y": 250.2, "obl": "andy", "povinny": true, "rodic": null, "prechod": 0, "typicky": "Země na rovníku – s ostrovy Galapágy, obřími želvami, sopkami v Andách a banány.", "hm": "Quito", "hmk": "Quito", "obyv": "asi 18 milionů", "obyvRok": 2025, "jazyk": "španělština; u domorodých národů také kečuánština (kichwa) a šuarština", "mena": "americký dolar", "poloha": "Na západě Jižní Ameriky u Tichého oceánu, prochází jím rovník; sousedí s Kolumbií a Peru.", "podnebi": "", "srovnani": null, "pojem": "endemit – rostlina nebo živočich, který žije jen na jednom místě na světě a nikde jinde. Na Galapágách je to třeba tučňák galapážský.", "rozloha": "asi 257 000 km²", "rozlohaCz": "3× větší než Česko", "uvidis": [{"nazev": "Galapágy", "druh": "priroda", "text": "Asi 1 000 km od pevniny leží v Tichém oceánu sopečné ostrovy Galapágy. Žijí na nich zvláštní zvířata: obří želvy, mořští leguáni nebo kormoráni, kteří neumějí létat. Stýkají se tu tři mořské proudy, a proto je moře kolem ostrovů plné života. V roce 1835 sem připlul přírodovědec Charles Darwin. Zdejší zvířata ho přivedla k teorii evoluce – k vysvětlení, jak se druhy postupně mění."}, {"nazev": "Chimborazo – hora nejblíž ke hvězdám", "druh": "priroda", "text": "Sopka Chimborazo měří 6 268 m, přesto je její vrchol nejdál od středu Země ze všech hor – o víc než 2 km dál než vrchol Everestu. Jak je to možné? Země není úplně kulatá, na rovníku je vyboulená. Chimborazo leží jen jeden stupeň jižně od rovníku, tedy právě na té „bouli“. Proto je jeho vrchol místem na Zemi, které je nejblíž ke hvězdám."}, {"nazev": "Sopka Cotopaxi", "druh": "priroda", "text": "Kužel sopky Cotopaxi měří 5 897 m a nad okolní krajinu se zvedá o víc než 3 000 m. Je to činná sopka: od roku 1738 vybuchla víc než padesátkrát. Nebezpečné jsou hlavně lahary – proudy bahna a kamení, které se při výbuchu valí po svazích. Škody mohou napáchat až 300 km od sopky. Vědci ji proto sledují i z vesmíru."}, {"nazev": "Quito a Střed světa", "druh": "mesto", "text": "Země se jmenuje podle rovníku – španělsky se rovník řekne „ecuador“. Rovník je pomyslná čára, která dělí Zemi na severní a jižní polokouli. Připomíná ho pomník Střed světa (Mitad del Mundo) nedaleko hlavního města Quita. Quito leží v Andách ve výšce 2 850 m. Jeho staré centrum bylo v roce 1978 mezi úplně prvními památkami UNESCO."}], "zvirata": [{"nazev": "Sloní želva", "text": "Obří želvy daly ostrovům jméno: starošpanělské slovo galápago znamenalo sedlo, podle tvaru krunýře. Vydrží až rok bez jídla a vody, a proto si je dřív námořníci brali na lodě jako živou zásobu masa.", "foto": {"src": "img/ju_galapagy.jpg", "autor": "Bengt Oberger", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AGalapagos_giant_tortoise_01.jpg"}}, {"nazev": "Tučňák galapážský", "text": "Jediný tučňák, který žije i na severní polokouli – kousek od rovníku.", "foto": {"src": "img/d_and_tucnak.jpg", "autor": "Pete", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Galapagos_Penguin_(Spheniscus_mendiculus)_-3_on_rock_by_sea.jpg"}}, {"nazev": "Mořský leguán", "text": "Ještěr z Galapág – jediný na světě, který si hledá potravu v moři. Může se dožít až 60 let.", "foto": {"src": "img/c_ekv_leguan.jpg", "autor": "Diego Delso", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AIguana_marina_%28Amblyrhynchus_cristatus%29%2C_Bah%C3%ADa_Tortuga%2C_isla_Santa_Cruz%2C_islas_Gal%C3%A1pagos%2C_Ecuador%2C_2015-07-26%2C_DD_30.JPG"}}], "zivi": "Ekvádor je největší vývozce banánů na světě – v roce 2023 prodal do ciziny asi 6,2 milionu tun, zhruba třetinu všech vyvezených banánů. Dál vyváží ropu, krevety, tuňáky, kakao a řezané květiny. Od roku 2000 se tu místo vlastní měny platí americkým dolarem.", "kultura": ["Ekvádorští vesničané pletou jemné slaměné klobouky z vláken palmy toquilla. Upletení jednoho klobouku trvá od jednoho dne až po osm měsíců – podle toho, jak jemný má být.", "V provincii Esmeraldas na pobřeží hrají potomci Afričanů na marimbu – xylofon z palmového dřeva s ozvučnicemi z bambusu. K hudbě se zpívá a tančí."], "zapamatuj": ["Quito – hlavní město", "ecuador = španělsky rovník", "Galapágy – sloní želvy", "největší vývozce banánů"], "vic": ["V roce 2008 zapsal Ekvádor do ústavy, že příroda – v andské tradici Pacha Mama, Matka Země – má svá práva. Zastat se jí u úřadů může kdokoli.", "Souostroví Galapágy tvoří 127 ostrovů, ostrůvků a skal. Velkých ostrovů je 19 a lidé žijí jen na čtyřech z nich.", "Osamělý George byl poslední známá obří želva z ostrova Pinta. Posledních 40 let žil v chovné stanici na ostrově Santa Cruz, kde v červnu 2012 zemřel."], "ukoly": [{"typ": "vyber", "otazka": "Proč mohou na Galapágách žít tučňáci, i když ostrovy leží u rovníku?", "moznosti": ["Leží na nich celý rok sníh a led", "Ostrovy omývá studený mořský proud", "Tučňáky sem přivezli lidé do zoo", "Každou zimu sem připlavou z Antarktidy"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“ – větu o zvířatech na Galapágách."}, {"typ": "vyber", "otazka": "Co znamená, že je tučňák galapážský endemit?", "moznosti": ["Žije jen na Galapágách a nikde jinde na světě", "Je to největší tučňák na světě", "Žije na všech kontinentech", "Na zimu odplouvá do Antarktidy"], "spravne": 0, "napoveda": "Přečti si rámeček „Nové slovo“."}, {"typ": "pravda", "tvrzeni": "V Ekvádoru se dnes platí vlastní měnou sucre.", "pravda": false, "napoveda": "Podívej se do základních údajů – měna."}], "hadanka": ["Mám horu, jejíž vrchol je ze všech nejdál od středu Země.", "Vyvážím víc banánů než kterákoli jiná země na světě.", "Jmenuji se podle rovníku a patří mi ostrovy s obřími želvami."], "par": {"vec": "Galapágy", "zvire": "sloní želva"}, "fotky": [{"src": "img/ju_galapagy.jpg", "autor": "Bengt Oberger", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AGalapagos_giant_tortoise_01.jpg", "cap": "Sloní želva na Galapágách"}, {"src": "img/d_and_cotopaxi.jpg", "autor": "Bernard Gagnon", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Cotopaxi_01.jpg", "cap": "Zasněžená sopka Cotopaxi"}, {"src": "img/c_ekv_chimborazo.jpg", "autor": "Bernard Gagnon", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AChimborazo_01.jpg", "cap": "Sopka Chimborazo"}, {"src": "img/c_ekv_mitad.jpg", "autor": "Maros M r a z ( Maros )", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AMitad_del_Mundo%2C_Ecuador_2.jpg", "cap": "Pomník Střed světa u Quita"}, {"src": "img/d_and_banany.jpg", "autor": "Dave Lonsdale", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:Banana_plantation,_Ecuador.jpg", "cap": "Banánová plantáž na pobřeží"}], "kratce": ["Ekvádor se jmenuje podle rovníku, který jím prochází.", "Asi 1 000 km od pevniny mu patří ostrovy Galapágy.", "Žijí na nich obří sloní želvy, mořští leguáni i tučňáci – těm svědčí studený mořský proud.", "V Andách se tyčí vysoké sopky Chimborazo a Cotopaxi.", "Ekvádor je největší vývozce banánů na světě a platí se tu americkým dolarem."], "zapis": ["[Quito] – hlavní město", "ecuador = španělsky [rovník]", "tučňák galapážský je [endemit] – žije jen na Galapágách", "největší vývozce [banánů] na světě"], "temata": {"priroda": {"polozky": [{"nazev": "Galapágy", "text": "Asi 1 000 km od pevniny leží v Tichém oceánu sopečné ostrovy Galapágy. Souostroví tvoří 127 ostrovů, ostrůvků a skal, lidé ale žijí jen na čtyřech. Stýkají se tu tři mořské proudy, a proto je moře kolem ostrovů plné života."}, {"nazev": "Zvířata Galapág", "text": "Obří želvy daly ostrovům jméno: starošpanělské slovo galápago znamenalo sedlo, podle tvaru krunýře. Žije tu i tučňák galapážský – jediný tučňák, kterého potkáš i na severní polokouli. Mořský leguán je jediný ještěr na světě, který si hledá potravu v moři. Může se dožít až 60 let."}, {"nazev": "Chimborazo – hora nejblíž ke hvězdám", "text": "Sopka Chimborazo měří 6 268 m, a přesto je její vrchol nejdál od středu Země ze všech hor. Země totiž není úplně kulatá, na rovníku je vyboulená. Chimborazo leží kousek od rovníku, tedy právě na té „bouli“."}, {"nazev": "Sopka Cotopaxi", "text": "Cotopaxi měří 5 897 m a je to činná sopka: od roku 1738 vybuchla víc než padesátkrát. Nebezpečné jsou hlavně lahary – proudy bahna a kamení, které se při výbuchu valí po svazích. Škody mohou napáchat až 300 km od sopky."}], "otazka": {"typ": "vyber", "otazka": "Proč je vrchol Chimboraza nejdál od středu Země, i když je Everest vyšší?", "moznosti": ["Protože Chimborazo každý rok povyroste", "Protože je Země na rovníku vyboulená", "Protože se jeho výška měří i se sněhem", "Protože stojí na ostrově v oceánu"], "spravne": 1, "napoveda": "Přečti si položku „Chimborazo – hora nejblíž ke hvězdám“."}}, "hospodarstvi": {"polozky": [{"nazev": "Banány", "text": "Ekvádor je největší vývozce banánů na světě. V roce 2023 prodal do ciziny asi 6,2 milionu tun – zhruba třetinu všech vyvezených banánů."}, {"nazev": "Ropa, krevety a kakao", "text": "Kromě banánů vyváží Ekvádor také ropu, krevety, tuňáky, kakao a řezané květiny."}, {"nazev": "Dolar místo vlastní měny", "text": "Ekvádor dřív platil vlastní měnou, která se jmenovala sucre. V roce 2000 ji nahradil americkým dolarem, a tak se tu platí stejnými penězi jako v USA."}], "otazka": {"typ": "pravda", "tvrzeni": "V roce 2023 vyvezl Ekvádor asi třetinu všech banánů, které se na světě vyvezly.", "pravda": true, "napoveda": "Přečti si položku „Banány“."}}, "kultura": {"polozky": [{"nazev": "Quito a Střed světa", "text": "Hlavní město Quito leží v Andách ve výšce 2 850 m. Jeho staré centrum bylo v roce 1978 mezi úplně prvními památkami UNESCO. Nedaleko stojí pomník Střed světa (Mitad del Mundo). Připomíná rovník – pomyslnou čáru, která dělí Zemi na severní a jižní polokouli."}, {"nazev": "Klobouky z palmy toquilla", "text": "Ekvádorští vesničané pletou jemné slaměné klobouky z vláken palmy toquilla. Upletení jednoho klobouku trvá od jednoho dne až po osm měsíců – podle toho, jak jemný má být."}, {"nazev": "Marimba", "text": "V provincii Esmeraldas na pobřeží hrají potomci Afričanů na marimbu. Je to xylofon z palmového dřeva s ozvučnicemi z bambusu. K hudbě se zpívá a tančí."}], "otazka": {"typ": "vyber", "otazka": "Z čeho pletou Ekvádorci tradiční jemné klobouky?", "moznosti": ["z vlny lam a alpak", "z listů banánovníku", "z vláken palmy toquilla", "z kůry kakaovníku"], "spravne": 2, "napoveda": "Přečti si položku „Klobouky z palmy toquilla“."}}, "sport": {"polozky": [{"nazev": "Jefferson Pérez", "text": "Při závodní chůzi nesmí mít závodník nikdy obě nohy zároveň ve vzduchu – to by už byl běh. Na olympiádě v Atlantě 1996 vyhrál Jefferson Pérez závod v chůzi na 20 km. Byla to vůbec první olympijská medaile pro Ekvádor. V roce 2008 v Pekingu přidal stříbro."}, {"nazev": "Richard Carapaz", "text": "Cyklista Richard Carapaz vyhrál jako první Ekvádorec Giro d’Italia – velký závod po Itálii. Na olympijských hrách v Tokiu (2020) pak zvítězil v silničním závodě. Pro Ekvádor to bylo teprve druhé olympijské zlato v historii."}], "otazka": {"typ": "pravda", "tvrzeni": "První olympijskou medaili pro Ekvádor získal cyklista Richard Carapaz.", "pravda": false, "napoveda": "Přečti si položku „Jefferson Pérez“."}}, "historie": {"polozky": [{"nazev": "Cesta k samostatnosti", "text": "Po odtržení od Španělska patřil Ekvádor k Velké Kolumbii – svazu s dnešní Kolumbií, Venezuelou a Panamou. V roce 1830 ze svazu vystoupil a stal se samostatným státem."}, {"nazev": "Darwin na Galapágách", "text": "V roce 1835 připlul na Galapágy přírodovědec Charles Darwin. Zdejší zvířata ho přivedla k teorii evoluce – k vysvětlení, jak se druhy postupně mění."}, {"nazev": "Osamělý George", "text": "Osamělý George byl poslední známá obří želva z ostrova Pinta. Posledních 40 let žil v chovné stanici na ostrově Santa Cruz, kde v červnu 2012 zemřel."}, {"nazev": "Práva přírody", "text": "V roce 2008 zapsal Ekvádor do ústavy, že příroda má svá práva. V andské tradici se jí říká Pacha Mama, Matka Země. Zastat se jí u úřadů může kdokoli."}], "otazka": {"typ": "vyber", "otazka": "Ve kterém roce vystoupil Ekvádor z Velké Kolumbie?", "moznosti": ["1492", "1835", "1830", "2000"], "spravne": 2, "napoveda": "Přečti si položku „Cesta k samostatnosti“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (18 289 896 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=EC"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Tučňák galapážský – endemit Galapág („endemic to the Galapagos archipelago“; Animal Diversity Web, University of Michigan)", "https://animaldiversity.org/accounts/Spheniscus_mendiculus/"], ["Tučňák galapážský – „The Endemic Galapagos Penguin“, jediný tučňák severně od rovníku (Charles Darwin Foundation)", "https://www.darwinfoundation.org/en/news/all-news-stories/the-endemic-galapagos-penguin-be-part-of-its-conservation/"], ["Endemit – taxon vyskytující se pouze na malém území nebo ve vymezené zeměpisné oblasti (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/endemit"], ["Endemit – organismus, který se přirozeně vyskytuje jen na určitém území (slovník Darwiniana.cz)", "https://darwiniana.cz/vamr/?id=298&page=slovnik"], ["Galapágy – asi 1 000 km od pevniny, 3 mořské proudy, obří želvy, mořští leguáni, nelétaví kormoráni, Darwin 1835, 127 ostrovů, 19 velkých, 4 obydlené (UNESCO)", "https://whc.unesco.org/en/list/1/"], ["Chimborazo 6 268 m, jeden stupeň od rovníku – vrchol o víc než 2 072 m dál od středu Země než Everest, „nejblíž ke hvězdám“ (NOAA)", "https://oceanservice.noaa.gov/facts/highestpoint.html"], ["Cotopaxi 5 897 m, přes 3 000 m nad okolím, přes 50 výbuchů od 1738, lahary až 300 km (NASA)", "https://science.nasa.gov/earth/earth-observatory/cotopaxi-volcano-ecuador-1816/"], ["„ecuador“ = rovník, kružnice stejně vzdálená od obou pólů (Slovník Španělské královské akademie)", "https://dle.rae.es/ecuador"], ["Mitad del Mundo – místo, kde rovník dělí Zemi na dvě polokoule, provincie Pichincha (oficiální web areálu)", "https://mitaddelmundo.gob.ec/en/explorando-la-mitad-del-mundo-un-destino-unico-en-ecuador/"], ["Quito – 2 850 m, založeno v 16. století na troskách incké osady (UNESCO)", "https://whc.unesco.org/en/list/2/"], ["Quito a Galapágy – mezi prvními památkami na Seznamu UNESCO v roce 1978 (UNESCO)", "https://whc.unesco.org/en/events/1468/"], ["Banány 2023: Ekvádor největší vývozce na světě (asi 6,2 mil. t z 19,3 mil. t), Kolumbie 1,7 mil. t (FAO, Banana Market Review 2023)", "https://openknowledge.fao.org/server/api/core/bitstreams/1085e3ed-0f37-4e7d-848d-cdfe203be158/content"], ["Hlavní vývoz Ekvádoru do USA: ropa, krevety, banány, těžené suroviny, tuňáci, kakao, řezané květiny (U.S. International Trade Administration)", "https://www.trade.gov/country-commercial-guides/ecuador-market-overview"], ["Ekvádor v roce 2000 nahradil sucre americkým dolarem (Centrální banka Ekvádoru)", "https://www.bce.fin.ec/en/history/"], ["Obří želvy daly ostrovům jméno (galápago = sedlo), přežijí rok bez jídla a vody, námořníci je vozili v podpalubí jako čerstvé maso; Osamělý George, poslední známá želva z ostrova Pinta, zemřel 2012; tučňák galapážský jediný na severní polokouli; mořský leguán jediný ještěr, který se živí v moři, dožívá se až 60 let (Galapagos Conservancy)", "https://www.galapagos.org/about_galapagos/about-galapagos/biodiversity/tortoises/"], ["Tradiční pletení klobouků z palmy toquilla, jeden klobouk den až osm měsíců (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/traditional-weaving-of-the-ecuadorian-toquilla-straw-hat-00729"], ["Marimba – xylofon z palmového dřeva s bambusovými ozvučnicemi, provincie Esmeraldas (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/marimba-music-traditional-chants-and-dances-from-the-colombia-south-pacific-region-and-esmeraldas-province-of-ecuador-01099"], ["Ústava Ekvádoru 2008 – úřední jazyky (čl. 2), práva přírody Pacha Mama (čl. 71) (anglický překlad, Georgetown University, neúřední)", "https://pdba.georgetown.edu/Constitutions/Ecuador/english08.html"], ["Galapágy – jediný mořský leguán na světě, nejseverněji žijící druh tučňáka (UNESCO)", "https://whc.unesco.org/en/list/1/"], ["Jefferson Pérez – zlato v chůzi na 20 km, Atlanta 1996, první olympijská medaile Ekvádoru; stříbro Peking 2008 (World Athletics, 2023)", "https://worldathletics.org/heritage/news/ecuadorian-athletics-federation-centenary"], ["Závodní chůze – chyba „ztráta kontaktu“: obě nohy zároveň nejsou na zemi (World Athletics)", "https://worldathletics.org/news/series/race-walking-loss-of-contact"], ["Richard Carapaz – vítěz Gira d’Italia, olympijský vítěz v silničním závodě Tokio 2020, druhé zlato Ekvádoru v historii OH (UCI, Mezinárodní cyklistická unie)", "https://www.uci.org/article/carapaz-launches-tokyo-2020-with-a-historic-bang/2Duj2J8BpYO3YieAa3qV0T"], ["Ekvádor byl součástí kolumbijského svazu, vystoupil z něj v roce 1830; USA ho uznaly 1832 (U.S. Department of State, Office of the Historian)", "https://history.state.gov/countries/ecuador"], ["Kolumbijský svaz zahrnoval dnešní Kolumbii, Ekvádor, Venezuelu a Panamu; Ekvádor a Venezuela odešly 1830, Panama 1903 (U.S. Department of State, Office of the Historian)", "https://history.state.gov/countries/colombia"]], "hesla": ["LÁVA 88", "ROVNÍK 38", "LÁVA 14", "TEREJ 70", "PĚNKAVA 41", "PĚNKAVA 37", "ŽRALOK 65", "KOMPAS 76", "PĚNKAVA 78", "ŽELVA 27", "ŽELVA 92", "ALBATROS 98", "ALBATROS 45", "KOMPAS 73", "OSTROV 28", "ROVNÍK 82", "LEGUÁN 52", "KOMPAS 57", "OSTROV 61", "OSTROV 79", "ŽRALOK 35", "ROVNÍK 30", "LEGUÁN 91", "TEREJ 29", "ŽELVA 90", "LÁVA 18", "ŽRALOK 62", "ALBATROS 53", "LEGUÁN 66", "TEREJ 13"]}, {"k": "peru", "n": "Peru", "ne": "Peru", "x": 283.5, "y": 442.4, "obl": "andy", "povinny": true, "rodic": null, "prechod": 0, "typicky": "Země Inků – s Machu Picchu, alpakami v horách, jezerem Titicaca a amazonským pralesem.", "hm": "Lima", "hmk": "Lima", "obyv": "asi 34 milionů", "obyvRok": 2025, "jazyk": "španělština; v oblastech, kde jimi mluví většina lidí, i kečuánština a ajmarština", "mena": "sol", "poloha": "Na západě Jižní Ameriky u Tichého oceánu; přes Andy sahá na východ až do Amazonie.", "podnebi": "", "srovnani": null, "pojem": "mestic – člověk, jehož předci jsou zčásti běloši (Evropané) a zčásti indiáni. V Peru se tak označuje víc než polovina obyvatel.", "rozloha": "1,29 mil. km²", "rozlohaCz": "16× větší než Česko", "uvidis": [{"nazev": "Machu Picchu", "druh": "pamatka", "text": "Na strmém hřebeni v Andách, ve výšce 2 430 m, postavili Inkové v 15. století město Machu Picchu. Jeho zdi, terasy a rampy vypadají, jako by vyrostly přímo ze skály. Když Španělé v 16. století dobyli říši Inků, lidé město opustili. Svět se o něm dozvěděl až v roce 1911. Kolem roste mlžný les – prales, který bývá zahalený v mracích."}, {"nazev": "Jezero Titicaca", "druh": "priroda", "text": "Na hranici Peru a Bolívie leží ve výšce asi 3 800 m jezero Titicaca. Je to největší sladkovodní jezero Jižní Ameriky a zároveň nejvýše položená velká vodní plocha, po které se dá plout lodí. V dobách ledových bylo mnohem větší, dlouhé až 600 km. V jeho okolí vyšlechtili dávní zemědělci před 8 000 lety první brambory."}, {"nazev": "Amazonie – národní park Manu", "druh": "priroda", "text": "Na východních svazích And leží národní park Manu. Krajina tu klesá od horských luk ve výšce přes 4 000 m až k nížinnému pralesu kolem 350 m. Žije tu přes 800 druhů ptáků, přes 200 druhů savců a 13 druhů opic. Pralesem se plíží jaguár i puma a žije tu i vydra obrovská. Nevede sem žádná silnice, a tak prales zůstal skoro nedotčený."}, {"nazev": "Huascarán a Bílé hory", "druh": "priroda", "text": "Pohoří Cordillera Blanca, česky Bílé hory, je nejvyšší pohoří v tropech na celém světě. Víc než 6 000 m tu měří 27 vrcholů. Nejvyšší z nich je Huascarán (6 768 m), nejvyšší hora Peru. Najdeš tu přes 600 ledovců a skoro 300 jezer. Ledovce ale rychle tají, a to je vážný problém: právě z nich teče voda pro lidi v údolích pod horami."}], "zvirata": [{"nazev": "Alpaka a lama", "text": "V Peru žijí asi 4 miliony alpak – víc než 70 % všech alpak na světě. Chovají se hlavně pro jemnou vlnu, kterou Peru vyváží do celého světa.", "foto": {"src": "img/ju_lamy.jpg", "autor": "Rosella Lopez", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ALlamas_en_cordilla_de_Vilcanota.jpg"}}, {"nazev": "Kondor andský", "text": "Jeden z největších létajících ptáků světa: rozpětí křídel má až asi 3 m a váží až 15 kg. Je tak těžký, že nejraději plachtí na vzdušných proudech ve větrných horách.", "foto": {"src": "img/d_and_kondor.jpg", "autor": "Thomas Fuhrmann", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Peru_-_Colca_Canyon_-_Andean_condor_(Vultur_gryphus)_01.jpg"}}, {"nazev": "Brambory", "text": "Brambory pocházejí z And. V horách Peru, Bolívie a Ekvádoru dnes roste přes 4 000 místních odrůd.", "foto": {"src": "img/r_and2.jpg", "autor": "Thayne Tuason", "lic": "CC BY 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AMercado_Modelo_de_Huancayo_Peru-_Solanum_tuberosum_varieties_V.jpg"}}], "zivi": "Peru je třetím největším těžařem mědi na světě, po Chile a Kongu. Z hor pochází vlna alpak, kterou země prodává do ciziny, a na horských políčkách se pěstují brambory mnoha odrůd.", "kultura": ["Typickým peruánským jídlem je ceviche: syrová ryba naložená v citrusové šťávě, ochucená chilli papričkami a solí. UNESCO ho v roce 2023 zapsalo mezi nehmotné dědictví lidstva.", "Při tanci nůžek drží tanečník v pravé ruce dvě železné tyčky, které připomínají čepele nůžek. Soutěž tanečníků může trvat až deset hodin.", "V horách se brambory konzervují mrazem: v noci zmrznou a ve dne je vysuší slunce. Takto usušené brambory (chuño) vydrží roky."], "zapamatuj": ["Lima – hlavní město", "Machu Picchu – město Inků", "alpaky, lamy a kondor", "Titicaca – jezero na hranici s Bolívií"], "vic": ["Hlavním městem říše Inků bylo Cusco ve výšce 3 400 m. Španělé později na inckých zdech postavili kostely a paláce.", "V poušti Nazca jsou na zemi obrazce zvířat a lidí. Vznikly tak, že dávní obyvatelé odklidili tmavé kameny a odkryli světlejší půdu. Archeologové jich za skoro 100 let našli asi 430. V roce 2024 vědci oznámili, že s pomocí umělé inteligence našli za 6 měsíců průzkumu 303 nových.", "Inkové postavili síť cest dlouhou přes 30 000 km. Vedla územím šesti dnešních států a spojovala zasněžené vrcholy And s pobřežím."], "ukoly": [{"typ": "vyber", "otazka": "Kdo je mestic?", "moznosti": ["Člověk s evropskými i indiánskými předky", "Pastevec dobytka na koni z pampy", "Druh lamy chovaný v Andách", "Přistěhovalec z Afriky"], "spravne": 0, "napoveda": "Přečti si rámeček „Nové slovo“."}, {"typ": "vyber", "otazka": "Proč se vysoko v peruánských Andách chovají alpaky?", "moznosti": ["Potřebují horké a vlhké tropické podnebí", "Živí se banány a kávou z horských svahů", "Snesou chlad a stačí jim horská tráva", "Nahoře v horách rostou husté listnaté lesy"], "spravne": 2, "napoveda": "Přečti si „Ve zkratce“ – větu o alpakách."}, {"typ": "pravda", "tvrzeni": "Jezero Titicaca leží na hranici Peru a Chile.", "pravda": false, "napoveda": "Podívej se do zápisu nebo do základních údajů."}], "hadanka": ["Moje typické jídlo je syrová ryba naložená v citrusové šťávě.", "Žije u mě víc než 70 % všech alpak na světě.", "Na mém horském hřebeni stojí incké město Machu Picchu."], "par": {"vec": "Machu Picchu", "zvire": "alpaka"}, "fotky": [{"src": "img/ju_titul.jpg", "autor": "Martin St-Amant ( S23678 )", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3A99_-_Machu_Picchu_-_Juin_2009.edit3.jpg", "cap": "Machu Picchu mezi horskými štíty"}, {"src": "img/ju_lamy.jpg", "autor": "Rosella Lopez", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3ALlamas_en_cordilla_de_Vilcanota.jpg", "cap": "Alpaky pod zasněženými horami"}, {"src": "img/d_and_kondor.jpg", "autor": "Thomas Fuhrmann", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Peru_-_Colca_Canyon_-_Andean_condor_(Vultur_gryphus)_01.jpg", "cap": "Kondor andský v letu"}, {"src": "img/ju_titicaca.jpg", "autor": "Qhanaaru", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File%3AIsla_de_Sol%2C_Lago_Titicaca_3.jpg", "cap": "Rákosová loď na jezeře Titicaca"}, {"src": "img/d_and_ceviche.jpg", "autor": "Manuel González Olaechea y Franco", "lic": "CC BY 3.0", "page": "https://commons.wikimedia.org/wiki/File:Ceviche_del_Per%C3%BA.jpg", "cap": "Ceviche s kukuřicí a batáty"}], "kratce": ["Peru bylo srdcem říše Inků s hlavním městem Cusco.", "Na horském hřebeni v Andách stojí jejich slavné město Machu Picchu.", "Na hranici s Bolívií leží Titicaca, největší sladkovodní jezero Jižní Ameriky.", "V chladných horách, kde roste hlavně tráva, se chová přes 70 % všech alpak světa.", "Peru je třetím největším těžařem mědi na světě."], "zapis": ["[Lima] – hlavní město", "[Machu Picchu] – město Inků", "chová nejvíc [alpak] na světě", "[Titicaca] – jezero na hranici s Bolívií"], "temata": {"priroda": {"polozky": [{"nazev": "Jezero Titicaca", "text": "Na hranici Peru a Bolívie leží ve výšce asi 3 800 m jezero Titicaca. Je to největší sladkovodní jezero Jižní Ameriky a zároveň nejvýše položená velká vodní plocha, po které se dá plout lodí. V dobách ledových bylo mnohem větší, dlouhé až 600 km."}, {"nazev": "Národní park Manu", "text": "Na východních svazích And leží národní park Manu. Krajina tu klesá od horských luk ve výšce přes 4 000 m k pralesu kolem 350 m. Žije tu přes 800 druhů ptáků, 13 druhů opic, jaguár i vydra obrovská. Nevede sem žádná silnice, a tak prales zůstal skoro nedotčený."}, {"nazev": "Huascarán a Bílé hory", "text": "Pohoří Cordillera Blanca, česky Bílé hory, je nejvyšší pohoří v tropech na světě. Nejvyšší horou je Huascarán (6 768 m), nejvyšší hora Peru. Ledovce tu ale rychle tají – a právě z nich teče voda pro lidi v údolích."}, {"nazev": "Kondor andský", "text": "Kondor andský je jeden z největších létajících ptáků světa: rozpětí křídel má až asi 3 m a váží až 15 kg. Je tak těžký, že nejraději plachtí na vzdušných proudech ve větrných horách."}], "otazka": {"typ": "pravda", "tvrzeni": "Do národního parku Manu vede dálnice, a proto je tamní prales hodně poškozený.", "pravda": false, "napoveda": "Přečti si položku „Národní park Manu“."}}, "hospodarstvi": {"polozky": [{"nazev": "Měď", "text": "Peru je třetím největším těžařem mědi na světě, po Chile a Kongu. V roce 2025 vytěžilo asi 2,7 milionu tun. Měď dobře vede elektřinu, a proto se z ní vyrábějí dráty a kabely."}, {"nazev": "Alpaky a jejich vlna", "text": "V Peru žijí asi 4 miliony alpak – víc než 70 % všech alpak na světě. Chovají se hlavně pro jemnou vlnu, kterou Peru vyváží do celého světa."}, {"nazev": "Brambory", "text": "Brambory pocházejí z And – dávní zemědělci je u jezera Titicaca vyšlechtili asi před 8 000 lety. V horách Peru, Bolívie a Ekvádoru dnes roste přes 4 000 místních odrůd."}], "otazka": {"typ": "vyber", "otazka": "Za kterými zeměmi je Peru v těžbě mědi třetí?", "moznosti": ["za USA a Kanadou", "za Chile a Kongem", "za Čínou a Indií", "za Brazílií a Argentinou"], "spravne": 1, "napoveda": "Přečti si položku „Měď“."}}, "kultura": {"polozky": [{"nazev": "Ceviche", "text": "Typickým peruánským jídlem je ceviche: syrová ryba naložená v citrusové šťávě, ochucená chilli papričkami a solí. UNESCO ho v roce 2023 zapsalo mezi nehmotné dědictví lidstva."}, {"nazev": "Tanec nůžek", "text": "Při tanci nůžek drží tanečník v pravé ruce dvě železné tyčky, které připomínají čepele nůžek. Soutěž tanečníků může trvat až deset hodin."}, {"nazev": "Chuño – brambory sušené mrazem", "text": "V horách se brambory konzervují mrazem: v noci zmrznou a ve dne je vysuší slunce. Takto usušené brambory, kterým se říká chuño, vydrží roky."}], "otazka": {"typ": "vyber", "otazka": "Jak lidé v horách uchovají brambory, aby vydržely roky?", "moznosti": ["Nakládají je do mořské soli", "Nechají je zmrznout a pak vysušit", "Zakopou je hluboko do sněhu", "Udí je nad ohněm z lamího trusu"], "spravne": 1, "napoveda": "Přečti si položku „Chuño – brambory sušené mrazem“."}}, "sport": {"polozky": [{"nazev": "Fotbal", "text": "Copa América je mistrovství Jižní Ameriky ve fotbale. Peru ho vyhrálo dvakrát: v roce 1939, kdy turnaj samo pořádalo, a v roce 1975, kdy ve finále porazilo Kolumbii."}, {"nazev": "Sofía Mulánovich", "text": "Surfování je jízda na prkně po mořských vlnách. Surfařka Sofía Mulánovich vyrostla u pláže Playa Hermosa. V roce 2004 se stala mistryní světa – jako vůbec první surfař nebo surfařka z Jižní Ameriky."}], "otazka": {"typ": "pravda", "tvrzeni": "Sofía Mulánovich se v roce 2004 stala první mistryní světa v surfování z Jižní Ameriky.", "pravda": true, "napoveda": "Přečti si položku „Sofía Mulánovich“."}}, "historie": {"polozky": [{"nazev": "Machu Picchu", "text": "Na strmém hřebeni v Andách, ve výšce 2 430 m, postavili Inkové v 15. století město Machu Picchu. Když Španělé v 16. století dobyli říši Inků, lidé město opustili. Svět se o něm dozvěděl až v roce 1911."}, {"nazev": "Cusco a cesty Inků", "text": "Hlavním městem říše Inků bylo Cusco ve výšce 3 400 m. Španělé později na inckých zdech postavili kostely a paláce. Inkové také postavili síť cest dlouhou přes 30 000 km, která vedla územím šesti dnešních států."}, {"nazev": "Obrazce v poušti Nazca", "text": "V poušti Nazca jsou na zemi obrazce zvířat a lidí. Vznikly tak, že dávní obyvatelé odklidili tmavé kameny a odkryli světlejší půdu. Archeologové jich za skoro 100 let našli asi 430. V roce 2024 vědci oznámili, že s pomocí umělé inteligence našli za 6 měsíců průzkumu 303 nových."}, {"nazev": "Nezávislost", "text": "Po dobytí říše Inků vládli v Peru Španělé. V červenci 1821 vyhlásil generál San Martín nezávislost Peru. Spojené státy ji uznaly v roce 1826."}], "otazka": {"typ": "vyber", "otazka": "Kdo v červenci 1821 vyhlásil nezávislost Peru?", "moznosti": ["Francisco Pizarro", "Charles Darwin", "Kryštof Kolumbus", "generál San Martín"], "spravne": 3, "napoveda": "Přečti si položku „Nezávislost“."}}}, "zdroje": [["INEI, sčítání 2025 (34 157 732 lidí)", "https://www.gob.pe/institucion/inei/noticias/1399446-inei-poblacion-del-peru-totalizo-34-millones-157-mil-732-habitantes-al-2025"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["mestic = míšenec bělocha a Indiánky a naopak (encyklopedie Vševěd)", "https://encyklopedie.vseved.cz/mestic"], ["mestic = míšenec bělocha s Indiánem (Slovník spisovného jazyka českého, ÚJČ AV ČR)", "https://ssjc.ujc.cas.cz/search.php?hledej=Hledat&heslo=mestic&sti=EMPTY&where=hesla&hsubstr=no"], ["Peru, sčítání 2025: za mestice se označilo 61,8 % (La República, cituje INEI)", "https://larepublica.pe/sociedad/2026/07/11/inei-618-de-peruanos-se-identifica-como-mestizo-segun-los-censos-nacionales-2025-948244"], ["Peru, sčítání 2025: 61,8 % mestici (Infobae, cituje INEI)", "https://www.infobae.com/peru/2026/07/13/9-de-peruanos-se-identifica-como-blanco-y-mas-de-17-como-quechua-segun-el-ultimo-censo/"], ["Machu Picchu – 2 430 m, 15. století, opuštěno po dobytí říše Inků, světu známé od 1911, mlžný les (UNESCO)", "https://whc.unesco.org/en/list/274/"], ["Titicaca – asi 3 800 m, nejvýše položená velká splavná vodní plocha, v dobách ledových až 600 km dlouhé (NASA)", "https://science.nasa.gov/earth/earth-observatory/lake-titicaca-87027/"], ["Brambory vyšlechtěny u Titicacy asi před 8 000 lety; přes 4 000 místních odrůd v Andách Peru, Bolívie a Ekvádoru (Mezinárodní bramborové centrum CIP)", "https://cipotato.org/potato/native-varieties/"], ["Titicaca – největší sladkovodní jezero Jižní Ameriky, 8 372 km² (ILEC World Lake Database)", "https://wldb.ilec.or.jp/Display/html/3389"], ["Titicaca – „the largest freshwater lake in South America“ (Copernicus, EU Agency for the Space Programme)", "https://eu-space.europa.eu/components/earth-observation-copernicus/image-of-day/drought-lake-titicaca-south-america"], ["Maracaibo – přes 13 000 km², ale brakická laguna spojená s Karibským mořem (NASA Earth Observatory; ESA)", "https://science.nasa.gov/earth/earth-observatory/troubled-waters-148894/"], ["NP Manu – od 4 000 m po nížinný prales kolem 350 m, přes 800 druhů ptáků, přes 200 savců, 13 druhů primátů, jaguár, vydra obrovská, bez silnic (UNESCO)", "https://whc.unesco.org/en/list/402/"], ["NP Huascarán – Huascarán 6 768 m, nejvyšší tropické pohoří světa, 27 vrcholů nad 6 000 m, přes 600 ledovců, skoro 300 jezer, ledovce ubývají (UNESCO)", "https://whc.unesco.org/en/list/333/"], ["Těžba mědi 2025: Chile 5,3, Kongo 3,2, Peru 2,7 milionu tun (USGS, Mineral Commodity Summaries 2026)", "https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-copper.pdf"], ["Peru – asi 4 miliony alpak, přes 70 % světa (National Geographic podle peruánského institutu INIA)", "https://www.nationalgeographic.com/environment/article/the-high-altitude-hunt-for-a-way-to-save-alpacas"], ["Kondor andský – rozpětí až asi 3 m, váha až 15 kg, plachtí na vzdušných proudech (National Geographic)", "https://www.nationalgeographic.com/animals/birds/facts/andean-condor"], ["Ceviche – syrová ryba naložená v citrusové šťávě (UNESCO uvádí citron), s chilli a solí; UNESCO 2023 (nehmotné dědictví)", "https://ich.unesco.org/en/RL/practices-and-meanings-associated-with-the-preparation-and-consumption-of-ceviche-an-expression-of-peruvian-traditional-cuisine-01952"], ["Tanec nůžek – železné tyčky jako čepele nůžek, soutěž až 10 hodin (UNESCO, nehmotné dědictví)", "https://ich.unesco.org/en/RL/scissors-dance-00391"], ["Chuño – brambory zmrazené v noci a sušené sluncem, vydrží roky (FAO)", "https://www.fao.org/mountain-partnership/projects/mountain-partnership-products-initiative/chu%C3%B1o-blanco/en"], ["Cusco – 3 400 m, hlavní město říše Inků (UNESCO)", "https://whc.unesco.org/en/list/273/"], ["Obrazce vznikly odklizením načervenalých kamenů z povrchu pouště; 303 nových obrazců lidí a zvířat za šest měsíců (Smithsonian Magazine, 2024)", "https://www.smithsonianmag.com/smart-news/see-newly-discovered-nazca-drawings-depict-llamas-human-sacrifices-more-180985133/"], ["Qhapaq Ñan – síť cest Inků přes 30 000 km, 6 dnešních států (UNESCO)", "https://whc.unesco.org/en/list/1459/"], ["Měď dobře vede teplo i elektřinu (USGS, Copper – A Metal for the Ages)", "https://pubs.usgs.gov/fs/2009/3031/"], ["Peru – vítěz Copa América 1939 (jako pořadatel) a 1975 (ve finále porazilo Kolumbii) (CONMEBOL Copa América, oficiální web)", "https://copaamerica.com/en/news/peru-how-many-titles-conmebol-copa-america"], ["Sofía Mulánovich z Playa Hermosa – mistryně světa 2004, první z Jižní Ameriky (World Surf League)", "https://www.worldsurfleague.com/posts/398812/wsl-heritage-sofia-mulanovich"], ["Umělá inteligence pomohla za 6 měsíců terénního průzkumu najít 303 nových figurálních obrazců na Nazce; předtím asi 430 za skoro 100 let (PNAS, 2024)", "https://www.pnas.org/doi/10.1073/pnas.2407652121"], ["Nezávislost Peru vyhlášena v červenci 1821 za generála San Martína, USA ji uznaly 1826 (U.S. Department of State, Office of the Historian)", "https://history.state.gov/countries/peru"]], "hesla": ["KUKUŘICE 45", "INKA 64", "STEZKA 16", "KUKUŘICE 34", "STEZKA 81", "FLÉTNA 76", "OBRAZEC 40", "TERASA 71", "CHRÁM 54", "KÁMEN 91", "ZLATO 55", "CHRÁM 51", "OBRAZEC 72", "ZLATO 43", "BRAMBORA 73", "OBRAZEC 52", "CHRÁM 86", "KUKUŘICE 15", "BRAMBORA 85", "STEZKA 28", "KÁMEN 13", "FLÉTNA 87", "TERASA 57", "FLÉTNA 83", "TERASA 70", "INKA 36", "INKA 96", "KÁMEN 80", "ZLATO 94", "BRAMBORA 98"]}, {"k": "bolivie", "n": "Bolívie", "ne": "Bolivia", "x": 427.6, "y": 505.5, "obl": "andy", "povinny": true, "rodic": null, "prechod": 1, "typicky": "Vysokohorská země bez moře – s obří solnou plání, plameňáky, lamami a lanovkami nad La Paz.", "hm": "Sucre (podle ústavy), vláda sídlí v La Paz", "hmk": "Sucre", "obyv": "asi 11 milionů", "obyvRok": 2024, "jazyk": "španělština a 36 domorodých jazyků, např. kečuánština a ajmarština", "mena": "boliviano", "poloha": "Vnitrozemský stát v Andách bez přístupu k moři; na hranici s Peru leží jezero Titicaca.", "podnebi": "", "srovnani": null, "pojem": "náhorní plošina – rozlehlá rovina vysoko nad mořem. V Bolívii je to Altiplano: leží mezi dvěma pásmy And ve výšce přes 3 600 m.", "rozloha": "1,10 mil. km²", "rozlohaCz": "14× větší než Česko", "uvidis": [{"nazev": "Salar de Uyuni", "druh": "priroda", "text": "Na jihozápadě Bolívie se táhne Salar de Uyuni – největší solná pláň na světě. Měří přes 10 000 km² a je skoro dokonale rovná. V období dešťů ji pokryje tenká vrstva vody a pláň se leskne jako obří zrcadlo. Pod solnou krustou se skrývá slaná voda plná lithia – kovu, ze kterého se vyrábějí baterie do mobilů a elektroaut."}, {"nazev": "Laguna Colorada – červené jezero", "druh": "priroda", "text": "Ve výšce 4 300 m leží mělké jezero Laguna Colorada. Jeho voda je červenohnědá, protože ji barví řasy, kterým se daří ve slané vodě. Když se změní slanost a teplota vody, může jezero i zezelenat. Na jezerech v okolí se shromažďuje asi polovina všech plameňáků Jamesových na světě. Od roku 1990 je Laguna Colorada chráněným mokřadem mezinárodního významu."}, {"nazev": "La Paz a lanovky", "druh": "mesto", "text": "Vláda sídlí v La Paz, které leží v hlubokém kaňonu pod náhorní plošinou ve výšce přes 3 500 m. Ulice tu prudce stoupají: Mezi centrem a městem El Alto nahoře na plošině je výškový rozdíl přes 500 m – a to na vzdálenost jen 2,8 km.. Metro se tu kvůli terénu stavět nedalo. Lidé proto jezdí lanovkou Mi Teleférico – je to největší městská lanovková síť na světě. V roce 2019 měla 10 linek a 33 km tras."}], "zvirata": [{"nazev": "Lama", "text": "Bolívie má nejvíc lam na světě – víc než 2 miliony, hlavně na náhorní plošině Altiplano ve výšce kolem 4 000 m. Lamy dávají maso i vlnu a nosí náklady."}, {"nazev": "Plameňák Jamesův", "text": "Vzácný plameňák vysokých And. Asi polovina všech plameňáků Jamesových na světě se shromažďuje na jezerech jihozápadní Bolívie."}], "zivi": "Bolívie vyváží hlavně nerosty z hor – zinek, stříbro a zlato – a zemní plyn. V Bolívii, hlavně pod solnou plání Uyuni, leží asi 23 milionů tun lithia – po Argentině nejvíc na světě. Těží se ho zatím málo, mimo jiné proto, že se tu voda kvůli dešťům a chladu odpařuje pomalu.", "kultura": ["Karneval v Oruru trvá deset dní. Hlavním tancem je diablada – tanec ďáblů v pestrých maskách. Průvodem projde přes 28 000 tanečníků a 10 000 hudebníků.", "Od 24. ledna se v La Paz slaví svátek Alasita. Lidé si kupují malinké napodobeniny věcí, po kterých touží, a věří, že se jim přání splní."], "zapamatuj": ["Sucre a La Paz – hlavní města", "vnitrozemský stát bez moře", "Salar de Uyuni – sůl a lithium", "lamy a plameňáci"], "vic": ["Bolívie kdysi moře měla. O své pobřeží přišla ve válce o Pacifik s Chile v letech 1879–1884.", "U jezera Titicaca ve výšce 3 850 m stojí zbytky města Tiwanaku, které vzkvétalo v letech 400 až 900 n. l., dávno před Inky. Jeho Sluneční brána je vytesaná z jediného kamenného bloku.", "Město Potosí leží ve výšce 4 000 m. V 16. století se tu našla největší ložiska stříbra v celé Americe a stříbro odtud vozily lodě do Španělska."], "ukoly": [{"typ": "vyber", "otazka": "Proč musí bolivijské zboží na cestě do zámoří projet přes sousední stát?", "moznosti": ["Protože bolivijské silnice končí na hranici", "Protože zboží z Bolívie nesmí létat letadlem", "Protože Bolívie nemá vlastní přístup k moři", "Protože Bolívie leží na ostrově v jezeře"], "spravne": 2, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "vyber", "otazka": "Proč je pláň Salar de Uyuni bílá?", "moznosti": ["Leží na ní sníh, který nikdy neroztaje", "Moře na ni při přílivu nanáší bílý písek", "Pokrývá ji sůl z vyschlých jezer", "Rostou na ní bílé mechy a lišejníky"], "spravne": 2, "napoveda": "Přečti si „Ve zkratce“ – větu o Salar de Uyuni."}, {"typ": "pravda", "tvrzeni": "Bolívie má nejvíc lam na světě.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“."}], "hadanka": ["Na mém velkém karnevalu tančí tisíce tanečníků, mnozí v maskách ďáblů.", "Hlavní město mám podle ústavy jinde, než kde sídlí vláda.", "Nemám moře, ale mám největší solnou pláň na světě."], "par": {"vec": "solná pláň", "zvire": "plameňák Jamesův"}, "fotky": [{"src": "img/c_bol_uyuni.jpg", "autor": "Diego Delso", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File%3AIsla_Incahuasi%2C_Salar_de_Uyuni%2C_Bolivia%2C_2016-02-04%2C_DD_43.jpg", "cap": "Kaktusy uprostřed solné pláně Uyuni"}, {"src": "img/d_and_colorada.jpg", "autor": "Havardtl", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:James%27s_Flamingoes_in_Laguna_Colorada,_Bolivia.jpg", "cap": "Plameňáci na Laguně Colorada"}, {"src": "img/ju_lapaz.jpg", "autor": "Dan Lundberg", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3A20170812_Bolivia_1788_La_Paz_sRGB_%2837926536306%29.jpg", "cap": "Lanovky nad La Paz"}, {"src": "img/d_and_oruro.jpg", "autor": "Pame82s", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:DiabladaFerroviariadeOruroBolivia.jpg", "cap": "Tanec ďáblů na karnevalu v Oruru"}, {"src": "img/c_bol_sucre.jpg", "autor": "Dan Lundberg", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3A20170805_Bolivia_1128%2B31_Pano_crop_Sucre_sRGB_%2837926300676%29.jpg", "cap": "Sucre – hlavní město podle ústavy"}], "kratce": ["Bolívie je vnitrozemský stát v Andách – nemá přístup k moři.", "Podle ústavy je hlavním městem Sucre, vláda ale sídlí v La Paz.", "Na jihozápadě leží Salar de Uyuni, největší solná pláň světa – zbyla po vyschlých jezerech.", "Na horských jezerech žijí plameňáci, mezi nimi vzácný plameňák Jamesův.", "Bolívie má nejvíc lam na světě a vyváží zemní plyn a kovy."], "zapis": ["[Sucre] – hlavní město, vláda sídlí v La Paz", "vnitrozemský stát – nemá přístup k [moři]", "Salar de Uyuni – největší [solná pláň]", "chová nejvíc [lam] na světě"], "temata": {"priroda": {"polozky": [{"nazev": "Salar de Uyuni", "text": "Na jihozápadě Bolívie se táhne Salar de Uyuni – největší solná pláň na světě. Měří přes 10 000 km² a je skoro dokonale rovná. V období dešťů ji pokryje tenká vrstva vody a pláň se leskne jako obří zrcadlo."}, {"nazev": "Laguna Colorada – červené jezero", "text": "Ve výšce 4 300 m leží mělké jezero Laguna Colorada. Jeho voda je červenohnědá, protože ji barví řasy, kterým se daří ve slané vodě. Od roku 1990 je chráněným mokřadem mezinárodního významu."}, {"nazev": "Plameňáci", "text": "Na jezerech v okolí Laguny Colorada se shromažďuje asi polovina všech plameňáků Jamesových na světě a asi čtvrtina plameňáků andských. Oba druhy jsou vzácné a žijí jen vysoko v Andách."}], "otazka": {"typ": "pravda", "tvrzeni": "Laguna Colorada je červená, protože ji barví řasy ve slané vodě.", "pravda": true, "napoveda": "Přečti si položku „Laguna Colorada – červené jezero“."}}, "hospodarstvi": {"polozky": [{"nazev": "Kovy a plyn", "text": "Bolívie vyváží hlavně nerosty z hor – zinek, stříbro a zlato – a zemní plyn. Těží se tu i olovo, měď a cín. Stříbro se tu dobývá už od 16. století."}, {"nazev": "Lithium pod solí", "text": "Pod solnou krustou Uyuni se skrývá slaná voda plná lithia – kovu, ze kterého se vyrábějí baterie do mobilů a elektroaut. V Bolívii se pod zemí skrývá asi 23 milionů tun lithia – po Argentině nejvíc na světě. Zatím se ho ale skoro netěží. Těží se ho zatím málo. Jednou z překážek je, že se tu voda kvůli dešťům a chladu odpařuje pomalu."},

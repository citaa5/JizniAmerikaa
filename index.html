jmani a hroznýši."}, {"nazev": "Pláže mořských želv", "druh": "priroda", "text": "Na západě země leží přírodní rezervace Amana s plážemi u Atlantiku. Patří k nejdůležitějším místům na světě, kam mořské želvy chodí klást vejce. Kladou je sem čtyři druhy: kožatka velká, kareta obrovská, kareta olivová a vzácně i kareta pravá. Samice vylézají z moře na písek a vejce v něm zahrabou."}], "zvirata": [{"nazev": "Kožatka velká", "text": "Klade vejce na plážích rezervace Amana. Hnízd tu ale rychle ubývá: na pláži Awala-Yalimapo jich v roce 2009 bylo přes 5 000, v roce 2022 jen 72.", "foto": {"src": "img/d_bra_kozatka.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Leatherback_Sea_Turtle_(Dermochelys_coriacea)_(10628948135).jpg"}}, {"nazev": "Motýl morpho", "text": "Velký motýl s křídly, která se lesknou kovově modrou barvou. Patří k typickým obyvatelům pralesa v Amazonském parku Guyany.", "foto": {"src": "img/d_bra_morpho.jpg", "autor": "Wisi eu", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Morpho_m%C3%A9n%C3%A9laus.jpg"}}], "zivi": "Kosmodrom je pro hospodářství Francouzské Guyany velmi důležitý. V roce 2019 tvořily vesmírné činnosti 83 % vývozu a pracovala v nich šestina lidí zaměstnaných v soukromých firmách.", "kultura": ["Karneval tu trvá celé týdny – od první neděle po Třech králích až do Popeleční středy. Na plesech se ženy převlékají a maskují tak, že je nikdo nepozná. Říká se jim Touloulous a samy zvou muže k tanci.", "Protože je Francouzská Guyana součástí Francie, mluví se tu francouzsky a platí se eurem jako v Paříži."], "zapamatuj": ["patří Francii, platí se eurem", "Kourou – evropský kosmodrom", "Cayenne – správní středisko", "největší národní park EU"], "vic": ["Slavný vesmírný dalekohled Jamese Webba odstartoval z Francouzské Guyany 25. 12. 2021 na evropské raketě Ariane 5.", "Blízkost rovníku dá raketě startující z Kourou rychlost navíc asi 460 m za sekundu.", "Ve Francouzské Guyaně vědci znají asi 100 000 druhů hmyzu. Odhadují ale, že jich tu žije 400 000 až milion."], "ukoly": [{"typ": "vyber", "otazka": "Proč se ve Francouzské Guyaně platí eurem?", "moznosti": ["Eurem se platí v celé Jižní Americe", "Patří Francii, a tedy i Evropské unii", "Euro si místní vybrali v hlasování", "Zavedli ho kvůli turistům z Brazílie"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "vyber", "otazka": "Proč je výhodné vypouštět rakety právě z Kourou?", "moznosti": ["Stojí tu nejvyšší hora celé Jižní Ameriky", "Leží blízko rovníku, raketa ušetří palivo", "Nikdy tu neprší ani tu nefouká vítr", "Je odsud ze Země nejkratší cesta k Měsíci"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "Francouzská Guyana je samostatný stát s vlastní měnou.", "pravda": false, "napoveda": "Podívej se do základních údajů – komu území patří a jakou má měnu?"}], "hadanka": ["Můj karneval trvá celé týdny a na plesech vládnou zamaskované ženy.", "Z mého území startují evropské rakety do vesmíru.", "Nejsem samostatný stát – patřím Francii a platí se u mě eurem."], "par": {"vec": "kosmodrom", "zvire": "kožatka velká"}, "fotky": [{"src": "img/c_fg_ariane.jpg", "autor": "elisabetta_monaco from Munich, Germany", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AAriane_5ECA_on_its_way_to_launch_pad_ELA-3.jpg", "cap": "Raketa Ariane 5 míří na rampu"}, {"src": "img/d_bra_prales.jpg", "autor": "Joey Allen", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Canop%C3%A9e_for%C3%AAt_guyanaise.JPG", "cap": "Koruny stromů guyanského pralesa"}, {"src": "img/d_bra_kozatka.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Leatherback_Sea_Turtle_(Dermochelys_coriacea)_(10628948135).jpg", "cap": "Kožatka velká klade vejce"}, {"src": "img/c_fg_cayenne.jpg", "autor": "Cayambe", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3ACayenne_Fort_C%C3%A9p%C3%A9rou_2013.jpg", "cap": "Pevnost Cépérou v Cayenne"}, {"src": "img/d_bra_morpho.jpg", "autor": "Wisi eu", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Morpho_m%C3%A9n%C3%A9laus.jpg", "cap": "Motýl morpho z Guyany"}], "kratce": ["Francouzská Guyana není samostatný stát – patří Francii, a proto se tu platí eurem.", "U města Kourou je evropský kosmodrom, odkud startují rakety do vesmíru.", "Leží blízko rovníku, a tak raketa při startu ušetří palivo.", "Přes 90 % území pokrývá prales s největším národním parkem Evropské unie.", "Na plážích rezervace Amana kladou vejce mořské želvy, třeba kožatka velká."], "zapis": ["[Cayenne] – správní středisko", "patří Francii, platí se [eurem]", "[Kourou] – evropský kosmodrom", "leží blízko [rovníku] – raketa ušetří palivo"], "temata": {"priroda": {"polozky": [{"nazev": "Amazonský park Guyany", "text": "Asi 90 % Francouzské Guyany pokrývá prales. Na jihu ho chrání Amazonský park Guyany – největší národní park Francie i celé Evropské unie, který zabírá 40 % území. Na jednom hektaru tu může růst přes 150 druhů stromů, desetkrát víc než v lese mírného pásu."}, {"nazev": "Pláže mořských želv", "text": "Pláže rezervace Amana patří k nejdůležitějším místům na světě, kam mořské želvy chodí klást vejce. Kladou je sem čtyři druhy, například kožatka velká. Kožatek ale rychle ubývá: na pláži Awala-Yalimapo bylo v roce 2009 přes 5 000 hnízd, v roce 2022 jen 72."}, {"nazev": "Říše hmyzu", "text": "Ve Francouzské Guyaně vědci znají asi 100 000 druhů hmyzu, ale odhadují, že jich tu žije 400 000 až milion. K typickým obyvatelům pralesa patří motýl morpho, jehož křídla se lesknou kovově modrou barvou."}], "otazka": {"typ": "vyber", "otazka": "Kolik hnízd kožatek bylo na pláži Awala-Yalimapo v roce 2022?", "moznosti": ["72", "720", "5 000", "50 000"], "spravne": 0, "napoveda": "Přečti si položku „Pláže mořských želv“."}}, "hospodarstvi": {"polozky": [{"nazev": "Kosmodrom Kourou", "text": "U města Kourou je evropský kosmodrom. Francie ho vybrala v roce 1964 ze 14 možných míst, také proto, že tu nehrozí zemětřesení ani cyklóny (ničivé bouře). …rychlost navíc asi 460 m za sekundu, a raketa tak ušetří palivo."}, {"nazev": "Vesmír a hospodářství", "text": "Kosmodrom je pro hospodářství Francouzské Guyany velmi důležitý. V roce 2019 tvořily vesmírné činnosti 83 % vývozu a pracovala v nich šestina lidí zaměstnaných v soukromých firmách."}], "otazka": {"typ": "pravda", "tvrzeni": "Vesmírné činnosti tvořily v roce 2019 většinu vývozu Francouzské Guyany.", "pravda": true, "napoveda": "Přečti si položku „Vesmír a hospodářství“."}}, "kultura": {"polozky": [{"nazev": "Karneval s Touloulous", "text": "Karneval tu trvá celé týdny – od první neděle po Třech králích až do Popeleční středy. Na plesech se ženy převlékají a maskují tak, že je nikdo nepozná. Říká se jim Touloulous a samy zvou muže k tanci."}, {"nazev": "Kus Francie v Americe", "text": "Protože je Francouzská Guyana součástí Francie, mluví se tu francouzsky a platí se eurem jako v Paříži. Patří mezi takzvané nejvzdálenější regiony Evropské unie – území EU, která leží daleko od Evropy."}], "otazka": {"typ": "vyber", "otazka": "Kdo na karnevalových plesech zve ostatní k tanci?", "moznosti": ["zamaskované ženy", "jen malé děti", "hudebníci", "policisté"], "spravne": 0, "napoveda": "Přečti si položku „Karneval s Touloulous“."}}, "historie": {"polozky": [{"nazev": "Z kolonie departementem", "text": "Francouzská Guyana byla dlouho francouzskou kolonií. Zákon z 19. 3. 1946 z ní udělal departement – správní oblast Francie, podobnou našemu kraji."}, {"nazev": "Slavné starty", "text": "Slavný vesmírný dalekohled Jamese Webba odstartoval z Francouzské Guyany 25. 12. 2021 na evropské raketě Ariane 5. Od roku 2024 odsud létá nová evropská raketa Ariane 6."}], "otazka": {"typ": "vyber", "otazka": "Který slavný dalekohled odstartoval z Francouzské Guyany?", "moznosti": ["Hubbleův", "Jamese Webba", "Keplerův", "Galileův"], "spravne": 1, "napoveda": "Přečti si položku „Slavné starty“."}}}, "zdroje": [["INSEE, odhad k 1. 1. 2025", "https://www.insee.fr/fr/statistiques/8556999"], ["Rozloha Francouzské Guyany 83 534 km² (INSEE)", "https://www.insee.fr/fr/statistiques/3695893"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Kosmodrom Kourou – vybrán 1964 ze 14 míst, přes 500 km od rovníku, raketa získá 460 m/s navíc, bez cyklónů a zemětřesení, 90 % území pokrývá prales (ESA)", "https://www.esa.int/Enabling_Support/Space_Transportation/Europe_s_Spaceport/Europe_s_Spaceport2"], ["První start Ariane 6 – 9. 7. 2024 z Francouzské Guyany (ESA)", "https://www.esa.int/Enabling_Support/Space_Transportation/Ariane"], ["Amazonský park Guyany – největší národní park Francie i EU, 3,4 mil. ha, 40 % území, založen 2007, navazuje na brazilský park Tumucumaque (správa parku)", "https://www.parc-amazonien-guyane.fr/fr/le-parc-amazonien-de-guyane"], ["Amazonský park Guyany – přes 150 druhů stromů na jednom hektaru (10× víc než v lese mírného pásu); jaguár, vydra obrovská, tapír, motýli morpho (správa parku)", "https://www.parc-amazonien-guyane.fr/fr/des-decouvertes/une-terre-exceptionnelle/la-grande-foret-amazonienne"], ["Přírodní rezervace Amana – jedno z nejdůležitějších hnízdišť mořských želv na světě, 4 druhy včetně kožatky velké (Parc naturel régional de la Guyane)", "https://parcnaturel-guyane.fr/le-territoire/reserve-nationale-de-l-amana/"], ["Vesmírné činnosti 2019: osmina přidané hodnoty, šestina soukromých pracovních míst, 83 % vývozu Francouzské Guyany (INSEE)", "https://www.insee.fr/fr/statistiques/fichier/6685384/gy_ind_11.pdf"], ["Kožatky na pláži Awala-Yalimapo (rezervace Amana): 2009 přes 5 000 snůšek, 2022 jen 72 (WWF Francie, podle monitoringu hnízdišť)", "https://www.wwf.fr/actualites/en-guyane-la-tortue-luth-pourrait-disparaitre-de-ses-sites-de-ponte-historiques"], ["Karneval v Guyaně – od první neděle po Třech králích do Popeleční středy; na plesech jsou Touloulous zamaskované ženy, které nikdo nepozná a které samy zvou muže k tanci (Ministère de la Culture, inventář nehmotného dědictví)", "https://www.culture.gouv.fr/Media/Thematiques/Patrimoine-culturel-immateriel/Files/Fiches-inventaire-du-PCI/Le-carnaval-de-Cayenne-avec-le-touloulou-du-bal-pare-masque"], ["Francouzská Guyana je jako součást Francie nejvzdálenějším regionem EU, a proto patří do eurozóny (Evropská centrální banka)", "https://www.ecb.europa.eu/ecb-and-you/explainers/show-me/html/euro_outside_europe.en.html"], ["Dalekohled Jamese Webba odstartoval 25. 12. 2021 z Francouzské Guyany na raketě Ariane 5 (NASA)", "https://science.nasa.gov/mission/webb/launch/"], ["Ve Francouzské Guyaně je známo asi 100 000 druhů hmyzu, odhady 400 000 až 1 milion (správa Amazonského parku Guyany)", "https://www.parc-amazonien-guyane.fr/fr/des-connaissances/tresors-de-biodiversite/la-faune"], ["Zákon z 19. 3. 1946 změnil Guyanu, Guadeloupe, Martinik a Réunion z kolonií na departementy (Archives nationales d’outre-mer)", "https://archives-nationales-outre-mer.culture.gouv.fr/decouvrir-notre-offre-culturelle/80eme-anniversaire-de-la-departementalisation"]], "hesla": ["HVĚZDA 78", "RAKETA 99", "ANTÉNA 46", "MĚSÍC 23", "SONDA 38", "DRUŽICE 40", "ORBITA 11", "DRUŽICE 22", "PLANETA 69", "RAKETA 53", "SONDA 63", "PLANETA 80", "MĚSÍC 34", "ORBITA 14", "VESMÍR 56", "VESMÍR 31", "KOMETA 85", "KOMETA 82", "RAKETA 79", "SONDA 95", "ORBITA 25", "ANTÉNA 97", "KOMETA 88", "VESMÍR 48", "DRUŽICE 45", "HVĚZDA 27", "MĚSÍC 17", "PLANETA 61", "ANTÉNA 74", "HVĚZDA 73"]}, {"k": "surinam", "n": "Surinam", "ne": "Suriname", "x": 635.5, "y": 141.2, "obl": "bra", "povinny": false, "rodic": "brazilie", "prechod": 0, "typicky": "Nejlesnatější země světa, kde se mluví nizozemsky a žijí lidé z mnoha koutů světa.", "hm": "Paramaribo", "hmk": "Paramaribo", "obyv": "asi 640 tisíc", "obyvRok": 2025, "jazyk": "nizozemština", "mena": "surinamský dolar", "poloha": "Na severovýchodě Jižní Ameriky u Atlantiku, mezi Guyanou a Francouzskou Guyanou; na jihu sousedí s Brazílií.", "podnebi": "", "srovnani": null, "pojem": "", "rozloha": "asi 164 000 km²", "rozlohaCz": "2× větší než Česko", "uvidis": [{"nazev": "Prales Střední Surinam", "druh": "priroda", "text": "Lesy pokrývají asi 94 % Surinamu – víc než v kterémkoli jiném státě světa. Ve středozápadní části země chrání prales Přírodní rezervace Střední Surinam o rozloze 1,6 milionu hektarů. Vědci tu zatím našli přes 5 000 druhů rostlin. Žijí tu jaguáři, tapíři, vydry obrovské, lenochodi, 8 druhů opic a 400 druhů ptáků. Rezervace je od roku 2000 památkou UNESCO."}, {"nazev": "Žulové hory nad pralesem", "druh": "priroda", "text": "Z pralesa ve Středním Surinamu vystupují holé žulové kopce. Vědci jim říkají inselbergy, tedy „ostrovní hory“, protože čnějí z lesa jako ostrovy z moře. Zvedají se až do výšky 360 m nad mořem. Na jejich skalách rostou rostliny, které vydrží sucho. Kolem se střídá prales s bažinatým lesem a savanou. V rezervaci také pramení řada řek, například Coppename."}, {"nazev": "Paramaribo", "druh": "mesto", "text": "Hlavní město Paramaribo vzniklo jako nizozemské koloniální město. Staré centrum tvoří hlavně dřevěné domy, ve kterých se nizozemský styl mísí s místními zvyky. Stojí tu pevnost Zeelandia z roku 1667 a za ní velký Palmový park. Ze dřeva je postavená i velká katolická katedrála z roku 1885. Centrum města je od roku 2002 památkou UNESCO."}], "zvirata": [{"nazev": "Skalní kohoutek guyanský", "text": "Samec má zářivě oranžové peří a velký chochol ve tvaru vějíře, který mu skoro zakrývá zobák. Tento vzácný pták žije i v rezervaci Střední Surinam.", "foto": {"src": "img/d_bra_kohoutek.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Guianan_Cock-of-the-rock_(Rupicola_rupicola)_(25401379418).jpg"}}, {"nazev": "Vydra obrovská", "text": "Rezervace Střední Surinam je velmi důležitá pro přežití vzácné vydry obrovské."}], "zivi": "Surinam žije hlavně z těžby zlata a ropy – dohromady tvoří asi 90 % vývozu. Od roku 2028 se má začít těžit ropa i z mořského dna u pobřeží.", "kultura": ["Obyvatelé Surinamu mají předky z celého světa: jsou tu původní obyvatelé, potomci Afričanů, lidé z Indie, z indonéské Jávy, z Číny i z Libanonu. Proto je tu pestrá kuchyně i mnoho náboženství.", "Kromě úřední nizozemštiny se tu mluví například jazykem sranan tongo, dále anglicky, čínsky, španělsky a portugalsky.", "Plavec Anthony Nesty vyhrál v roce 1988 olympijské zlato na 100 m motýlkem. Byla to vůbec první olympijská medaile Surinamu."], "zapamatuj": ["Paramaribo – hlavní město", "nizozemština – úřední jazyk", "lesy na 94 % území", "zlato a ropa"], "vic": ["Nesty porazil amerického favorita Matta Biondiho o pouhou jednu setinu sekundy. Biondi vedl celý závod až do posledního tempa.", "Hlavní ulice Paramariba vedou po přírodních valech z mušlí. Ty tvořily pevný a suchý podklad pro stavby uprostřed bažin.", "Surinam je jediný samostatný stát mimo Evropu, kde nizozemsky mluví velká část obyvatel."], "ukoly": [{"typ": "vyber", "otazka": "Proč se v Surinamu mluví nizozemsky?", "moznosti": ["Leží hned vedle Nizozemska", "Dřív to byla nizozemská kolonie", "Nizozemština je nejrozšířenější jazyk Ameriky", "Nizozemsky mluví původní obyvatelé pralesa"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "Lesy pokrývají v Surinamu větší část území než v kterémkoli jiném státě světa.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“ nebo zápis."}, {"typ": "vyber", "otazka": "Proč v Surinamu ubývá pralesa?", "moznosti": ["Kvůli chovu lam a alpak", "Kvůli stavbě kosmodromu pro rakety", "Kvůli těžbě zlata v pralese", "Kvůli sopkám, které prales spálí"], "spravne": 2, "napoveda": "Přečti si „Ve zkratce“ – poslední větu."}], "hadanka": ["Plavec z mé země vyhrál olympijské zlato o jedinou setinu sekundy.", "Lesy pokrývají 94 % mého území – víc než v kterémkoli jiném státě světa.", "Jsem jediná země Jižní Ameriky, kde je úředním jazykem nizozemština."], "par": {"vec": "nizozemština", "zvire": "skalní kohoutek"}, "fotky": [{"src": "img/c_sur_prales.jpg", "autor": "David Evers", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AAmazon_jungle_from_above.jpg", "cap": "Prales ve Středním Surinamu"}, {"src": "img/d_bra_paramaribo.jpg", "autor": "Mark Ahsmann", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Paramaribo_Streetview.JPG", "cap": "Dřevěné domy v Paramaribu"}, {"src": "img/c_sur_katedrala.jpg", "autor": "-JvL- from Netherlands", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3ASaint_Peter_and_Paul_Cathedral%2C_Paramaribo_%2831087478891%29.jpg", "cap": "Dřevěná katedrála v Paramaribu"}, {"src": "img/c_sur_reka.jpg", "autor": "-JvL- from Netherlands", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3ASuriname_River_Nieuw_Aurora_Sipaliwini_%2832723202623%29.jpg", "cap": "Řeka Surinam v pralese"}, {"src": "img/d_bra_kohoutek.jpg", "autor": "Bernard DUPONT from FRANCE", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Guianan_Cock-of-the-rock_(Rupicola_rupicola)_(25401379418).jpg", "cap": "Skalní kohoutek guyanský"}], "kratce": ["Surinam je jediná země Jižní Ameriky, kde se úředně mluví nizozemsky.", "Dřív to totiž byla nizozemská kolonie.", "Lesy pokrývají 94 % území – víc než v kterémkoli jiném státě světa.", "V pralese žije skalní kohoutek, pták se zářivě oranžovým peřím.", "Surinam žije hlavně z těžby zlata a ropy – kvůli zlatým dolům ale ubývá pralesa."], "zapis": ["[Paramaribo] – hlavní město", "úřední jazyk [nizozemština]", "[lesy] na 94 % území", "vývoz: [zlato] a ropa"], "temata": {"priroda": {"polozky": [{"nazev": "Prales Střední Surinam", "text": "Prales ve středozápadní části země chrání Přírodní rezervace Střední Surinam. Od roku 2000 je památkou UNESCO. Vědci tu zatím našli přes 5 000 druhů rostlin. Žijí tu jaguáři, tapíři, lenochodi, 8 druhů opic a 400 druhů ptáků."}, {"nazev": "Skalní kohoutek a vydra obrovská", "text": "Samec skalního kohoutka má zářivě oranžové peří a velký chochol ve tvaru vějíře. Rezervace Střední Surinam je velmi důležitá pro přežití kohoutků i vzácné vydry obrovské."}, {"nazev": "Žulové hory nad pralesem", "text": "Z pralesa vystupují holé žulové kopce. Vědci jim říkají inselbergy, tedy „ostrovní hory“, protože čnějí z lesa jako ostrovy z moře. Zvedají se až do výšky 360 m nad mořem a na jejich skalách rostou rostliny, které vydrží sucho."}], "otazka": {"typ": "vyber", "otazka": "Co jsou inselbergy?", "moznosti": ["žulové kopce nad pralesem", "písečné ostrovy u pobřeží", "dřevěné domy v Paramaribu", "řeky plné obřích leknínů"], "spravne": 0, "napoveda": "Přečti si položku „Žulové hory nad pralesem“."}}, "hospodarstvi": {"polozky": [{"nazev": "Zlato a ropa", "text": "Surinam žije hlavně z těžby zlata a ropy – dohromady tvoří asi 90 % vývozu. Od roku 2028 se má začít těžit ropa i z mořského dna u pobřeží."}], "otazka": {"typ": "pravda", "tvrzeni": "Zlato a ropa tvoří asi 90 % surinamského vývozu.", "pravda": true, "napoveda": "Přečti si položku „Zlato a ropa“."}}, "kultura": {"polozky": [{"nazev": "Lidé z celého světa", "text": "Obyvatelé Surinamu mají předky z celého světa: jsou tu původní obyvatelé, potomci Afričanů, lidé z Indie, z indonéské Jávy, z Číny i z Libanonu. Proto je tu pestrá kuchyně i mnoho náboženství."}, {"nazev": "Mnoho jazyků", "text": "Kromě úřední nizozemštiny se tu mluví například jazykem sranan tongo, dále anglicky, čínsky, španělsky a portugalsky. Surinam je jediný samostatný stát mimo Evropu, kde nizozemsky mluví velká část obyvatel."}], "otazka": {"typ": "vyber", "otazka": "Jak se jmenuje místní jazyk, kterým se v Surinamu mluví vedle nizozemštiny?", "moznosti": ["esperanto", "sranan tongo", "latina", "svahilština"], "spravne": 1, "napoveda": "Přečti si položku „Mnoho jazyků“."}}, "sport": {"polozky": [{"nazev": "Anthony Nesty", "text": "Plavec Anthony Nesty vyhrál v roce 1988 olympijské zlato na 100 m motýlkem. Byla to vůbec první olympijská medaile Surinamu. Amerického favorita Matta Biondiho porazil o pouhou jednu setinu sekundy. O čtyři roky později, v roce 1992, přidal bronz."}], "otazka": {"typ": "pravda", "tvrzeni": "Anthony Nesty vyhrál olympijské zlato s náskokem celé sekundy.", "pravda": false, "napoveda": "Přečti si položku „Anthony Nesty“."}}, "historie": {"polozky": [{"nazev": "Z kolonie samostatnou zemí", "text": "Surinam byl asi 300 let nizozemskou kolonií. Na plantážích se pěstovala hlavně cukrová třtina a pracovali na nich otroci. Nezávislost na Nizozemsku získal Surinam 25. 11. 1975."}, {"nazev": "Staré Paramaribo", "text": "Staré centrum Paramariba tvoří hlavně dřevěné domy, ve kterých se nizozemský styl mísí s místními zvyky. Stojí tu pevnost Zeelandia z roku 1667 a dřevěná katedrála z roku 1885. Hlavní ulice vedou po přírodních valech z mušlí, které byly pevným podkladem uprostřed bažin. Centrum je od roku 2002 památkou UNESCO."}], "otazka": {"typ": "vyber", "otazka": "Ve kterém roce získal Surinam nezávislost na Nizozemsku?", "moznosti": ["1667", "1885", "1975", "2002"], "spravne": 2, "napoveda": "Přečti si položku „Z kolonie samostatnou zemí“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (639 850 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=SR"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Surinam: lesy 94,4 % rozlohy (2023), nejvíc ze všech států (Světová banka podle FAO)", "https://data.worldbank.org/indicator/AG.LND.FRST.ZS?locations=SR"], ["Přírodní rezervace Střední Surinam – 1,6 mil. ha pralesa ve středozápadním Surinamu, přes 5 000 druhů rostlin, jaguár, tapír, vydra obrovská, 8 druhů primátů, 400 druhů ptáků, skalní kohoutek; žulové inselbergy do 360 m n. m.; důležitá pro vzácné druhy jako skalní kohoutek a vydra obrovská; UNESCO 2000", "https://whc.unesco.org/en/list/1017/"], ["Historické centrum Paramariba – nizozemské koloniální město, dřevěné domy, pevnost Zeelandia 1667, dřevěná katedrála 1885, ulice na valech z mušlí, UNESCO 2002", "https://whc.unesco.org/en/list/940/"], ["Surinam – těžba zlata a ropy tvoří asi 90 % vývozu (Světová banka, 2024)", "https://documents1.worldbank.org/curated/en/099072424101529204/pdf/P504548-2ff5dacd-ae0e-4a0b-8970-a249804120cc.pdf"], ["Surinam – těžba ropy z mořského dna se očekává od roku 2028 (Světová banka)", "https://www.worldbank.org/ext/en/country/suriname"], ["Skalní kohoutek – samci jsou převážně sytě oranžoví, velký vějířovitý chochol jim skoro zakrývá zobák (San Diego Zoo)", "https://animals.sandiegozoo.org/animals/cock-rock"], ["Surinam – nizozemština jediný úřední jazyk; dále sranan tongo aj.; obyvatelé: původní obyvatelé, Kreolové, Hindustánci, Javánci, Číňané, Maroni, Židé, Libanonci (vláda Surinamu, gov.sr)", "https://gov.sr/suriname/"], ["Anthony Nesty – olympijské zlato 1988 na 100 m motýlek o 1 setinu, první olympijská medaile Surinamu (Olympedia)", "https://www.olympedia.org/athletes/50206"], ["Anthony Nesty – zlato 1988 na 100 m motýlek, první olympijská medaile Surinamu, bronz 1992 (Olympedia)", "https://www.olympedia.org/athletes/50206"], ["Surinam – asi 300 let nizozemská kolonie, pěstování cukrové třtiny za pomoci otroctví, nezávislost 25. 11. 1975 (vláda Surinamu, gov.sr)", "https://gov.sr/suriname/"]], "hesla": ["KAKAO 70", "RÝŽE 84", "KAKAO 90", "MORČE 32", "MAJÁK 30", "KOKOS 86", "MAJÁK 77", "KOKOS 37", "KOKOS 66", "DŘEVO 97", "PÍSEK 54", "KORÁB 69", "DŘEVO 87", "PÍSEK 40", "KORÁB 19", "VESLO 81", "VESLO 62", "MORČE 15", "VESLO 36", "RÝŽE 33", "KORÁB 16", "SLUNCE 17", "SLUNCE 68", "DŘEVO 35", "KAKAO 72", "PÍSEK 13", "MORČE 85", "RÝŽE 52", "SLUNCE 44", "MAJÁK 24"]}, {"k": "guyana", "n": "Guyana", "ne": "Guyana", "x": 586.1, "y": 125.3, "obl": "bra", "povinny": false, "rodic": "brazilie", "prechod": 0, "typicky": "Jediná anglicky mluvící země Jižní Ameriky – s vodopádem Kaieteur a ropou z moře.", "hm": "Georgetown", "hmk": "Georgetown", "obyv": "asi 836 tisíc", "obyvRok": 2025, "jazyk": "angličtina", "mena": "guyanský dolar", "poloha": "Na severovýchodě Jižní Ameriky u Atlantiku; sousedí s Venezuelou, Brazílií a Surinamem.", "podnebi": "", "srovnani": null, "pojem": "", "rozloha": "asi 215 000 km²", "rozlohaCz": "skoro 3× větší než Česko", "uvidis": [{"nazev": "Vodopád Kaieteur", "druh": "priroda", "text": "Vodopád Kaieteur padá z výšky 226 m jediným skokem. Je asi čtyřikrát vyšší než slavné Niagarské vodopády. Zároveň jím teče hodně vody – až 663 m³ za sekundu. Takové spojení výšky a množství vody je u vodopádu s jedním skokem vzácné. Pod vodopádem začíná kaňon dlouhý 32 km. Národní park kolem něj vznikl už v roce 1929."}, {"nazev": "Řeky s obřími lekníny", "druh": "priroda", "text": "Na klidných řekách a jezerech roste obří leknín Victoria amazonica, národní květina Guyany. Jeho kulaté listy mají v průměru až 2 m a plavou po hladině. Velký bílý květ se otevírá v noci. Voní po ananasu a láká tak brouky, kteří ho opylují. Leknín je tak důležitý, že ho Guyanci mají i ve státním znaku."}, {"nazev": "Georgetown", "druh": "mesto", "text": "Hlavní město Georgetown leží na pobřeží Atlantského oceánu. Najdeš tu budovy z doby, kdy zemi vládli Britové, a historické kriketové hřiště Bourda. Stojí tu i gotická katedrála svatého Jiří – jeden z nejvyšších dřevěných kostelů na světě. Nad tržnicí Stabroek, kde lidé nakupují, se zvedá hodinová věž. V ulicích uslyšíš angličtinu, protože Guyana je jediná země Jižní Ameriky, kde se úředně mluví anglicky."}], "zvirata": [{"nazev": "Zlatá žabka", "text": "Drobná zlatá žabka žije jen v okolí vodopádu Kaieteur a nikde jinde na světě.", "foto": {"src": "img/c_guy_zaba.jpg", "autor": "Dan Sloan", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AGolden_tree_frog_-_Near_Kaieteur_Falls%2C_Guyana_%2823636809576%29.jpg"}}, {"nazev": "Harpyje pralesní", "text": "Vzácný a ohrožený dravý pták. V národním parku Kaieteur ji chrání spolu s dalšími ohroženými zvířaty, třeba s mravenečníkem velkým a vydrou obrovskou."}], "zivi": "Od roku 2019 se u pobřeží Guyany těží ropa z mořského dna. V první polovině roku 2026 to bylo asi 900 000 barelů denně (barel = asi 159 litrů) a za vyvezenou ropu země utržila přes 15 miliard dolarů – víc než třináctkrát víc než za všechno ostatní zboží. Dřív Guyana žila hlavně ze zlata, bauxitu, rýže a cukru.", "kultura": ["Každý rok 23. února slaví Guyana Den republiky festivalem Mashramani. Ulicemi jdou průvody v kostýmech a jezdí ozdobené vozy, hraje hudba calypso a soca. Slovo „mashramani“ pochází z jazyka původních obyvatel a znamená „oslava po těžké práci“.", "Oblíbené jídlo pepperpot se připravuje z masa a pochází z kuchyně původních obyvatel. Jí se s chlebem nebo s chlebem z manioku."], "zapamatuj": ["Georgetown – hlavní město", "angličtina – úřední jazyk", "Kaieteur – vodopád 226 m", "ropa z mořského dna"], "vic": ["Díky ropě rostlo hospodářství Guyany v roce 2022 nejrychleji na světě – o 62,3 % za jediný rok.", "List obřího leknínu drží na hladině síť žeber plných vzduchu. Podle velikosti unese až 50 kg.", "V roce 1973 národní park Kaieteur zmenšili na pouhých 19,4 km², aby se v okolí mohlo těžit. Dnes má park 626,8 km², nejvíc v celé své historii."], "ukoly": [{"typ": "vyber", "otazka": "Proč Guyana v posledních letech rychle bohatne?", "moznosti": ["Objevila obrovská ložiska zlata v horách", "U pobřeží těží ropu z mořského dna", "Stala se součástí bohaté Francie", "Pěstuje nejvíc kávy ze všech zemí"], "spravne": 1, "napoveda": "Přečti si „Ve zkratce“."}, {"typ": "pravda", "tvrzeni": "V Guyaně se úředně mluví španělsky, stejně jako v sousední Venezuele.", "pravda": false, "napoveda": "Podívej se do základních údajů nebo do „Ve zkratce“."}, {"typ": "vyber", "otazka": "Proč padá vodopád Kaieteur jediným skokem tak hluboko?", "moznosti": ["Řeka přetéká přes okraj vysoké skalní plošiny", "Voda padá z tajícího ledovce na hoře", "Lidé řeku přehradili a pouštějí vodu z hráze", "Voda vytéká z kráteru sopky"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“ – větu o vodopádu."}], "hadanka": ["Moje národní květina má listy o průměru až 2 m.", "Od roku 2019 se u mě těží ropa z mořského dna a v roce 2022 mi hospodářství rostlo nejrychleji na světě.", "Jsem jediná země Jižní Ameriky, kde se úředně mluví anglicky."], "par": {"vec": "vodopád Kaieteur", "zvire": "zlatá žabka"}, "fotky": [{"src": "img/c_guy_kaieteur.jpg", "autor": "Dan Sloan", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AKaieteur_Falls%2C_Guyana_%2823035888153%29.jpg", "cap": "Vodopád Kaieteur v pralese"}, {"src": "img/c_guy_lekno.jpg", "autor": "阿橋 HQ", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3A%E7%8E%8B%E8%93%AE_Victoria_amazonica_-%E9%A6%99%E6%B8%AF%E5%85%AC%E5%9C%92_Hong_Kong_Park-_%289237377195%29.jpg", "cap": "Květ obřího leknínu"}, {"src": "img/c_guy_georgetown.jpg", "autor": "Dan Sloan", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AReformed_Church_and_Stabroek_Market_-_Georgetown_%2822850460464%29.jpg", "cap": "Tržnice Stabroek v Georgetownu"}, {"src": "img/c_guy_zaba.jpg", "autor": "Dan Sloan", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File%3AGolden_tree_frog_-_Near_Kaieteur_Falls%2C_Guyana_%2823636809576%29.jpg", "cap": "Zlatá žabka od Kaieteuru"}], "kratce": ["Guyana je jediná země Jižní Ameriky, kde se úředně mluví anglicky.", "V pralese padá vodopád Kaieteur přes okraj skalní plošiny jediným skokem z výšky 226 m.", "U vodopádu žije zlatá žabka, která nikde jinde na světě není.", "Od roku 2019 se u pobřeží těží ropa z mořského dna.", "Díky ropě rostlo hospodářství Guyany v roce 2022 nejrychleji na světě."], "zapis": ["[Georgetown] – hlavní město", "úřední jazyk [angličtina]", "[Kaieteur] – vodopád 226 m", "ropa z [mořského dna]"], "temata": {"priroda": {"polozky": [{"nazev": "Vodopád Kaieteur", "text": "Vodopád Kaieteur padá z výšky 226 m jediným skokem. Je asi čtyřikrát vyšší než slavné Niagarské vodopády a teče jím až 663 m³ vody za sekundu. Pod vodopádem začíná kaňon dlouhý 32 km."}, {"nazev": "Obří leknín", "text": "Na klidných řekách roste obří leknín Victoria amazonica, národní květina Guyany. Jeho kulaté listy mají v průměru až 2 m a unesou až 50 kg. Velký bílý květ se otevírá v noci a voní po ananasu, a tak láká brouky, kteří ho opylují."}, {"nazev": "Zvířata od Kaieteuru", "text": "Drobná zlatá žabka žije jen v okolí vodopádu Kaieteur. Národní park tu chrání i harpyji pralesní, mravenečníka velkého a vydru obrovskou. Park vznikl už v roce 1929 a dnes má 626,8 km², nejvíc v celé své historii."}], "otazka": {"typ": "pravda", "tvrzeni": "Květ obřího leknínu se otevírá v noci.", "pravda": true, "napoveda": "Přečti si položku „Obří leknín“."}}, "hospodarstvi": {"polozky": [{"nazev": "Ropa z mořského dna", "text": "Od roku 2019 se u pobřeží Guyany těží ropa z mořského dna. V první polovině roku 2026 to bylo asi 900 000 barelů denně (barel = asi 159 litrů). Za ropu vyvezenou za těch šest měsíců utržila přes 15 miliard dolarů – víc než třináctkrát víc než za všechno ostatní zboží. V roce 2022 díky ní hospodářství vyrostlo o 62,3 %, nejvíc na světě."}, {"nazev": "Než přišla ropa", "text": "Dřív Guyana žila hlavně ze zlata, bauxitu, rýže a cukru. Bauxit je hornina, ze které se vyrábí hliník."}], "otazka": {"typ": "vyber", "otazka": "Od kterého roku se u Guyany těží ropa z mořského dna?", "moznosti": ["1929", "1966", "2019", "2026"], "spravne": 2, "napoveda": "Přečti si položku „Ropa z mořského dna“."}}, "kultura": {"polozky": [{"nazev": "Mashramani", "text": "Každý rok 23. února slaví Guyana Den republiky festivalem Mashramani. Ulicemi jdou průvody v kostýmech a jezdí ozdobené vozy, hraje hudba calypso a soca. Slovo „mashramani“ pochází z jazyka původních obyvatel a znamená „oslava po těžké práci“."}, {"nazev": "Pepperpot", "text": "Oblíbené jídlo pepperpot se připravuje z masa a pochází z kuchyně původních obyvatel. Jí se s chlebem nebo s chlebem z manioku."}, {"nazev": "Georgetown", "text": "Hlavní město Georgetown leží na pobřeží Atlantského oceánu. Najdeš tu budovy z doby, kdy zemi vládli Britové. Nad tržnicí Stabroek, kde lidé nakupují, se zvedá hodinová věž."}], "otazka": {"typ": "pravda", "tvrzeni": "Pepperpot je sladký dezert z ananasu.", "pravda": false, "napoveda": "Přečti si položku „Pepperpot“."}}, "sport": {"polozky": [{"nazev": "Kriket", "text": "Kriket je pálkovací míčová hra. Guyana hraje kriket ve společném týmu Západní Indie – tak se souhrnně říká státům a ostrovům v Karibiku. Guyanští hráči proto hrají za společný tým Západní Indie spolu s hráči z karibských ostrovů. V Georgetownu je historické kriketové hřiště Bourda, kde se hrály i mezinárodní zápasy."}, {"nazev": "Clive Lloyd", "text": "Clive Lloyd se narodil v roce 1944 v Georgetownu. Jako kapitán dovedl tým Západní Indie k vítězství na mistrovství světa v kriketu v letech 1975 a 1979."}], "otazka": {"typ": "vyber", "otazka": "Za jaký tým hrají guyanští hráči kriketu?", "moznosti": ["za tým Brazílie", "za tým Západní Indie", "za tým Velké Británie", "za tým Spojených států"], "spravne": 1, "napoveda": "Přečti si položku „Kriket“."}}, "historie": {"polozky": [{"nazev": "Nezávislost na Británii", "text": "Guyana byla britskou kolonií, a proto se tu mluví anglicky. Nezávislost získala 26. 5. 1966. Ten den stáhli britskou vlajku a vztyčili novou guyanskou vlajku zvanou Zlatý hrot šípu."}, {"nazev": "Katedrála svatého Jiří", "text": "V Georgetownu stojí gotická katedrála svatého Jiří. Je celá ze dřeva, jen základy má zděné. Měří 43,6 m, a patří tak k nejvyšším dřevěným kostelům na světě."}], "otazka": {"typ": "pravda", "tvrzeni": "Guyana získala nezávislost na Británii v roce 1966.", "pravda": true, "napoveda": "Přečti si položku „Nezávislost na Británii“."}}}, "zdroje": [["Světová banka  počet obyvatel 2025 (835 986 lidí)", "https://data.worldbank.org/indicator/SP.POP.TOTL?locations=GY"], ["Rozloha (Světová banka, Surface area 2023)", "https://data.worldbank.org/indicator/AG.SRF.TOTL.K2"], ["Rozloha (OSN, Demographic Yearbook 2023, tabulka 3)", "https://unstats.un.org/unsd/demographic-social/products/dyb/documents/dyb2023/table03.pdf"], ["Rozloha Česka 78 871 km² (ČSÚ)", "https://statistikaamy.csu.gov.cz/mapa-ceska-reci-cisel"], ["Národní park Kaieteur – vodopád 226 m, průtok až 663 m³/s, kaňon 32 km, park od 1929, v roce 1973 zmenšen na 19,4 km², dnes 626,8 km²; harpyje, zlatá žabka (Protected Areas Commission, vláda Guyany)", "https://www.pac.gov.gy/kaieteur-national-park/"], ["Kaieteur – jeden skok 226 m (Protected Areas Trust Guyana)", "https://protectedareastrust.org.gy/protected-areas/kaieteur-national-park/"], ["Horseshoe Falls (Niagara) padají z výšky průměrně 57 m (Niagara Parks Commission)", "https://www.niagaraparks.com/visit-niagara-parks/plan-your-visit/niagara-falls-geology-facts-figures/"], ["Victoria amazonica – národní květina Guyany, listy až 2 m, unesou až 50 kg, ve státním znaku (Protected Areas Trust Guyana)", "https://protectedareastrust.org.gy/article/victoria-amazonica-guyanas-floating-jewel-of-nature/"], ["Victoria amazonica – květy kvetou v noci a voní po ananasu (Missouri Botanical Garden)", "https://plantfinder.mobot.org/PlantFinderDetails.aspx?kempercode=c263"], ["Victoria amazonica – bílé květy se otevírají v noci, opyluje je brouk (Royal Botanic Garden Edinburgh)", "https://stories.rbge.org.uk/archives/15311"], ["Historické centrum Georgetownu – nejlepší ukázky koloniální architektury 19. století (UNESCO, předběžný seznam)", "https://whc.unesco.org/en/tentativelists/2008/"], ["Katedrála sv. Jiří v Georgetownu – gotický sloh, celá ze dřeva kromě nízkých zděných základů, výška 43,59 m, jedna z největších dřevěných církevních staveb (UNESCO, předběžný seznam)", "https://whc.unesco.org/en/tentativelists/272/"], ["Tržnice Stabroek v Georgetownu – železná stavba z 19. století s hodinovou věží (Culture in Crisis, Victoria and Albert Museum)", "https://cultureincrisis.org/projects/conservation-of-the-19th-century-stabroek-market-clock-in-georgetown"], ["Bourda, Georgetown – kriketové hřiště, kde se hrály testové (mezinárodní) zápasy (Cricket West Indies)", "https://www.windiescricket.com/grounds/bourda-georgetown/"], ["Guyana – jediná anglicky mluvící země Jižní Ameriky; sousedí s Venezuelou, Surinamem a Brazílií; tradičně zlato, bauxit, rýže, cukr (U.S. Department of State)", "https://2021-2025.state.gov/reports/2021-investment-climate-statements/guyana/"], ["Guyana: těžba ropy z mořského dna od 2019; HDP 2022 +62,3 %, nejvíc na světě podle MMF (EIA)", "https://www.eia.gov/todayinenergy/detail.php?id=62103"], ["Guyana 1. pololetí 2026: asi 902 000 barelů denně, vývoz ropy přes 15 mld. USD, ostatní vývoz 1,146 mld. USD (Department of Public Information, vláda Guyany)", "https://dpi.gov.gy/guyanas-oil-exports-surpass-us15b-in-first-half-of-2026/"], ["Mashramani – v jazyce Arawaků „oslava po těžké práci“, Den republiky 23. února, průvod kostýmů a vozů, calypso a soca (DPI Guyana)", "https://dpi.gov.gy/mashramani-a-vibrant-expression-of-guyanese-culture/"], ["Pepperpot – pokrm z kuchyně původních obyvatel, jí se s chlebem nebo chlebem z manioku (DPI Guyana)", "https://dpi.gov.gy/pepperpot-tuma-pot-piwari-and-fly/"], ["Guyana Cricket Board – jeden ze šesti řádných členů Cricket West Indies (Cricket West Indies)", "https://www.windiescricket.com/news/cricket-west-indies-passes-historic-governance-reform-at-special-meeting-of-shareholders/"], ["Clive Lloyd – narozen 1944 v Georgetownu, jako kapitán Západní Indie vyhrál MS v kriketu 1975 a 1979 (Cricket West Indies)", "https://www.windiescricket.com/players/clive-lloyd-3752/"], ["Clive Lloyd – kapitán Západní Indie, vítězství na MS v kriketu 1975 a 1979 (ICC Hall of Fame)", "https://www.icc-cricket.com/hall-of-fame/hall-of-famers/hall-of-famer-clive-lloyd"], ["Guyana – nezávislost 26. 5. 1966, stažení britské vlajky a vztyčení vlajky Golden Arrowhead (Department of Public Information, vláda Guyany)", "https://dpi.gov.gy/guyanas-independence-a-legacy-of-fortitude/"]], "hesla": ["VYDRA 89", "LEKNÍN 36", "LIMETKA 42", "OCEÁN 26", "ŽÁBA 90", "LEKNÍN 16", "OCEÁN 80", "ŽÁBA 45", "HARPYJE 56", "KAJAK 30", "MOLO 11", "MOLO 51", "OCEÁN 85", "LIÁNA 84", "PRALES 73", "VYDRA 28", "PRALES 93", "KAJAK 39", "PRALES 71", "VYDRA 27", "MOLO 75", "HARPYJE 48", "LIÁNA 21", "KAJAK 64", "LIÁNA 31", "LEKNÍN 86", "LIMETKA 61", "HARPYJE 87", "ŽÁBA 69", "LIMETKA 78"]}, {"k": "venezuela", "n": "Venezuela", "ne": "Venezuela", "x": 440.4, "y": 68.2, "obl": "bra", "povinny": true, "rodic": null, "prechod": 3, "typicky": "Nejvyšší vodopád světa, stolové hory, karibské ostrovy a největší zásoby ropy.", "hm": "Caracas", "hmk": "Caracas", "obyv": "asi 29 milionů", "obyvRok": 2025, "jazyk": "španělština", "mena": "bolívar", "poloha": "Na severu ji omývá Karibské moře; sousedí s Kolumbií, Brazílií a Guyanou.", "podnebi": "", "srovnani": null, "pojem": "llanos – rozlehlé travnaté roviny (savany) v povodí řeky Orinoko ve Venezuele a Kolumbii. V období dešťů je voda zčásti zaplaví. Pasou se na nich stáda dobytka.", "rozloha": "asi 0,9 mil. km²", "rozlohaCz": "skoro 12× větší než Česko", "uvidis": [{"nazev": "Salto Ángel", "druh": "priroda", "text": "Salto Ángel je nejvyšší vodopád na světě – voda padá z výšky 979 m. Řítí se z okraje stolové hory Auyán-tepui. Hora patří ke Guyanské vysočině, jedné z nejstarších částí zemského povrchu. Vodopád leží v národním parku Canaima na jihovýchodě země. Park je tak cenný, že ho UNESCO v roce 1994 zapsalo na seznam světového dědictví."}, {"nazev": "Stolové hory tepui", "druh": "priroda", "text": "Asi 65 % parku Canaima pokrývají stolové hory zvané tepui. Mají plochý vrchol a kolmé skalní stěny, které se zvedají vysoko nad prales a savanu. Podle UNESCO tvoří jedinečný celek, který je velmi zajímavý pro geology. Právě takové hory možná inspirovaly spisovatele Arthura Conana Doyla k dobrodružnému románu Ztracený svět z roku 1912. V něm na vrcholu hory přežívají dinosauři."}, {"nazev": "Ostrovy Los Roques v Karibiku", "druh": "priroda", "text": "V Karibském moři severně od pevniny leží národní park Los Roques. Tvoří ho stovky ostrůvků a písečných mělčin obklopených korálovými útesy. Mezi nimi jsou louky mořské trávy a mangrovy – stromy, které rostou přímo ve slané vodě. Žijí tu stovky druhů ryb a desítky druhů korálů. Lovit ryby sítěmi je tu zakázané."}], "zvirata": [{"nazev": "Anakonda velká", "text": "Nejtěžší had na světě – váží až 227 kg. Oči a nozdry má na temeni hlavy, a tak může číhat ve vodě skoro celá ponořená.", "foto": {"src": "img/d_bra_anakonda.jpg", "autor": "Fernando Flores from Caracas, Venezuela", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Anaconda_(Eunectes_murinus)_(8990193853).jpg"}}, {"nazev": "Kapybara", "text": "Největší hlodavec na světě. Žije u vody a dobře plave, protože má mezi prsty blány.", "foto": {"src": "img/d_bra_kapybara.jpg", "autor": "Fernando Flores from Caracas, Venezuela", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Capybara_-_Chig%C3%BCire_(Hydrochoerus_hydrochaeris)_(8578160737).jpg"}}], "zivi": "Venezuela má největší zásoby ropy na světě – na konci roku 2024 to bylo asi 303 miliard barelů (barel = asi 159 litrů), skoro pětina všech zásob. Ropa tvořila v roce 2024 asi 87 % toho, co země vyvezla. Těžila ale jen něco přes 1 % světové ropy.", "kultura": ["Hudba a tanec joropo: páry tančí za zvuku harfy, malé kytary cuatro a marakasů. UNESCO joropo v roce 2025 zapsalo mezi nehmotné dědictví lidstva.", "Na svátek Božího těla tančí ve vesnicích skupiny dospělých i dětí převlečené za čerty v pestrých maskách. UNESCO tuto tradici zapsalo v roce 2012."], "zapamatuj": ["Caracas – hlavní město", "Salto Ángel – nejvyšší vodopád světa", "tepui – stolové hory", "největší zásoby ropy na světě"], "vic": ["U jezera Maracaibo blýská nejvíc na Zemi: na každý km² tu za rok připadne asi 250 blesků. Bouřky přicházejí asi 300 dní v roce na stejné místo, k ústí řeky Catatumbo.", "Nejvíc anakond žije v povodí řek Orinoko a Amazonka a v zaplavovaných pastvinách llanos ve Venezuele.", "V 16. století katolická církev zařadila kapybaru mezi ryby. Její maso se pak smělo jíst i v pátek a v postu, kdy se maso jíst nemělo."], "ukoly": [{"typ": "vyber", "otazka": "Co jsou llanos?", "moznosti": ["Travnaté roviny v povodí řeky Orinoko", "Stolové hory s plochým vrcholem", "Ledovce v Patagonii", "Korálové útesy v Karibském moři"], "spravne": 0, "napoveda": "Přečti si rámeček „Nové slovo“."}, {"typ": "pravda", "tvrzeni": "Venezuela má největší zásoby ropy na světě.", "pravda": true, "napoveda": "Přečti si „Ve zkratce“ nebo zápis."}, {"typ": "vyber", "otazka": "Proč by pro Venezuelu byl velký problém, kdyby ropa zlevnila?", "moznosti": ["Země žije hlavně z vývozu ropy", "Venezuela musí ropu dovážet z ciziny", "Z ropy se staví stolové hory", "Ropou se tu platí místo peněz"], "spravne": 0, "napoveda": "Přečti si „Ve zkratce“ – z čeho země žije?"}], "hadanka": ["U mého jezera Maracaibo blýská nejvíc na Zemi.", "Ze stolové hory na mém území padá nejvyšší vodopád světa.", "Mám největší zásoby ropy na světě a na severu mě omývá Karibské moře."], "par": {"vec": "Salto Ángel", "zvire": "korálové útesy Los Roques"}, "fotky": [{"src": "img/ju_angel.jpg", "autor": "Diego Delso", "lic": "CC BY 3.0", "page": "https://commons.wikimedia.org/wiki/File%3ASalto_del_Angel-Canaima-Venezuela18.JPG", "cap": "Salto Ángel, nejvyšší vodopád světa"}, {"src": "img/c_ven_roraima.jpg", "autor": "Paolo Costa Baldi", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File%3AKukenan_Roraima_GS.jpg", "cap": "Stolové hory Kukenán a Roraima"}, {"src": "img/c_ven_roques.jpg", "autor": "NASA/Tim Kopra", "lic": "Public domain", "page": "https://commons.wikimedia.org/wiki/File%3AISS-46_Los_Roques_archipelago%2C_Venezuela.jpg", "cap": "Ostrovy Los Roques z vesmíru"}, {"src": "img/d_bra_kapybara.jpg", "autor": "Fernando Flores from Caracas, Venezuela", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Capybara_-_Chig%C3%BCire_(Hydrochoerus_hydrochaeris)_(8578160737).jpg", "cap": "Kapybara, největší hlodavec"}, {"src": "img/c_ven_caracas.jpg", "autor": "Olga Berrios", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File%3ACaracas_desde_el_%C3%A1vila.jpg", "cap": "Hlavní město Caracas"}], "kratce": ["Venezuela má největší zásoby ropy na světě a žije hlavně z jejího vývozu.", "Na jihovýchodě se zvedají tepui – stolové hory s plochým vrcholem.", "Z jedné z nich padá Salto Ángel, nejvyšší vodopád světa.", "Na severu ji omývá Karibské moře, kde leží korálové útesy Los Roques.", "Tančí se tu joropo za zvuku harfy a marakasů."], "zapis": ["[Caracas] – hlavní město", "[Salto Ángel] – nejvyšší vodopád světa", "[tepui] – stolové hory", "největší zásoby [ropy] na světě"], "temata": {"priroda": {"polozky": [{"nazev": "Salto Ángel a stolové hory", "text": "Tepui jsou stolové hory s plochým vrcholem a kolmými skalními stěnami. Z okraje jedné z nich, Auyán-tepui, padá Salto Ángel – nejvyšší vodopád na světě, vysoký 979 m. Obojí chrání národní park Canaima, který UNESCO zapsalo v roce 1994. Takové hory možná inspirovaly román „Ztracený svět“ (1912), v němž na vrcholu hory přežívají dinosauři."}, {"nazev": "Ostrovy Los Roques", "text": "V Karibském moři leží národní park Los Roques – stovky ostrůvků a mělčin obklopených korálovými útesy. Najdeš tu mangrovy – stromy, které rostou přímo ve slané vodě. Žijí tu stovky druhů ryb a desítky druhů korálů."}, {"nazev": "Blesky nad jezerem Maracaibo", "text": "U jezera Maracaibo blýská nejvíc na Zemi – na každý km² tu za rok připadne asi 250 blesků. Bouřky přicházejí asi 300 dní v roce na stejné místo, k ústí řeky Catatumbo."}, {"nazev": "Anakonda a kapybara", "text": "Anakonda velká je nejtěžší had na světě – váží až 227 kg. Nejvíc anakond žije v povodí řek Orinoko a Amazonka a v zaplavovaných pastvinách llanos. U vody žije i kapybara, největší hlodavec světa. V 16. století ji církev zařadila mezi ryby, a tak se její maso smělo jíst i v postu."}], "otazka": {"typ": "vyber", "otazka": "Kolik blesků připadne u jezera Maracaibo za rok na každý km²?", "moznosti": ["asi 2", "asi 25", "asi 250", "asi 2 500"], "spravne": 2, "napoveda": "Přečti si položku „Blesky nad jezerem Maracaibo“."}}, "hospodarstvi": {"polozky": [{"nazev": "Ropa", "text": "Venezuela má největší zásoby ropy na světě – na konci roku 2024 to bylo asi 303 miliard barelů (barel = asi 159 litrů), skoro pětina všech zásob. Ropa tvořila v roce 2024 asi 87 % toho, co země vyvezla. Těžila ale jen něco přes 1 % světové ropy."}], "otazka": {"typ": "pravda", "tvrzeni": "Venezuela těží ze všech zemí nejvíc ropy.", "pravda": false, "napoveda": "Přečti si položku „Ropa – zásoby a těžba nejsou totéž“."}}, "kultura": {"polozky": [{"nazev": "Joropo", "text": "Joropo je hudba, zpěv a tanec, při kterém páry tančí za zvuku harfy, malé kytary cuatro a marakasů. UNESCO joropo v roce 2025 zapsalo mezi nehmotné dědictví lidstva."}, {"nazev": "Tančící čerti", "text": "Na svátek Božího těla tančí ve vesnicích skupiny dospělých i dětí převlečené za čerty v pestrých maskách. UNESCO tuto tradici zapsalo v roce 2012."}], "otazka": {"typ": "vyber", "otazka": "Na jaké nástroje se hraje k tanci joropo?", "moznosti": ["dudy, housle a buben", "harfa, cuatro a marakasy", "klavír, trubka a basa", "flétna, gong a malé zvonky"], "spravne": 1, "napoveda": "Přečti si položku „Joropo“."}}, "sport": {"polozky": [{"nazev": "Baseball", " aguay"], "brazilie": ["fr_guyana", "surinam", "guyana"]}, POCET = 30, OBL = [{"id": "andy", "nazev": "Andské státy", "uvod": "Kolumbií, Ekvádorem, Peru a Bolívií se táhnou Andy – nejdelší pohoří na pevnině. Přes padesát jejich vrcholů měří víc než 6 000 m. Lidé tu žijí vysoko v horách: na náhorních plošinách pěstují brambory a chovají lamy a alpaky. Mnoho obyvatel mluví kečuánsky, tedy jazykem, kterým mluvili Inkové. Jejich říše kdysi propojila tyto země sítí cest dlouhou přes 30 000 km. Na východ od hor se svahy sklánějí do amazonského pralesa.", "zapamatuj": ["Příroda: Andy s vrcholy přes 6 000 m a náhorními plošinami, na východě nížiny s tropickým deštným lesem u Amazonky.", "Obyvatelé: v Ekvádoru a Peru většinou mestici, v Bolívii se skoro 2 z 5 lidí hlásí k indiánským národům.", "Hospodářství: chudší státy než Česko; vyvážejí ropu, měď, zlato, kávu a banány, turisty lákají památky Inků, třeba Machu Picchu."], "zdroje": [["Andy – nejdelší pohoří na pevnině, přes 50 vrcholů nad 6 000 m (Guinness World Records)", "https://www.guinnessworldrecords.com/world-records/longest-continental-mountain-range"], ["Andy – asi 7 000 km, jedno z nejdelších souvislých pohoří světa, vedou i Kolumbií, Ekvádorem, Peru a Bolívií (NASA)", "https://www.nasa.gov/image-article/chilean-andes/"], ["Kečuánština – jazyk říše Inků, dnes přes 13 milionů mluvčích od jižní Kolumbie po sever Argentiny a Chile (Indiana University, Centrum latinskoamerických studií)", "https://clacs.indiana.edu/languages/quechua.html"], ["Lamy a alpaky v Andách; Bolívie má nejvíc lam (asi 2,4 milionu podle údajů z roku 2009, Peru 1,2 milionu), Altiplano kolem 4 000 m; lamy na maso, práci i vlnu (FAO, Symposium on Natural Fibres 2009)", "https://www.fao.org/4/i0709e/i0709e07.pdf"], ["Qhapaq Ñan – síť cest Inků přes 30 000 km, 6 dnešních států (UNESCO)", "https://whc.unesco.org/en/list/1459/"], ["Brambory vyšlechtěny u Titicacy asi před 8 000 lety; přes 4 000 místních odrůd v Andách Peru, Bolívie a Ekvádoru (Mezinárodní bramborové centrum CIP)", "https://cipotato.org/potato/native-varieties/"], ["NP Manu – od 4 000 m po nížinný prales kolem 350 m, přes 800 druhů ptáků, přes 200 savců, 13 druhů primátů, jaguár, vydra obrovská, bez silnic (UNESCO)", "https://whc.unesco.org/en/list/402/"], ["Příroda – Andy: přes 50 vrcholů nad 6 000 m (Guinness World Records; převzato ze hry)", "https://www.guinnessworldrecords.com/world-records/longest-continental-mountain-range"], ["Příroda – Chimborazo (Ekvádor) 6 268 m (NOAA; převzato z FAKTA-overeno)", "https://oceanservice.noaa.gov/facts/highestpoint.html"], ["Příroda – Altiplano: náhorní plošina mezi dvěma pásmy And, asi 3 660 m, jih Peru a sever Bolívie (NASA Earth Observatory)", "https://science.nasa.gov/earth/earth-observatory/altiplano-south-america-1152/"], ["Příroda – Amazonie, největší tropický biom planety, sdílí 8 států včetně Bolívie, Kolumbie, Ekvádoru a Peru (OTCA, Organizace Smlouvy o amazonské spolupráci)", "https://otca.org/en/who-we-are/"], ["Příroda – Amazonie: povodí přes 6 mil. km², deštný les na 80 % povodí, 8 států (NASA)", "https://science.nasa.gov/earth/earth-observatory/mapping-the-amazon-145649/"], ["Obyvatelé – Ekvádor, sčítání 2022: mestici 77,5 %, indiáni 7,7 % (Secretaría de Pueblos y Nacionalidades, vláda Ekvádoru, podle INEC)", "https://www.secretariapueblosynacionalidades.gob.ec/wp-content/uploads/2023/12/Presentacion-CENSO-2022-Pueblos-y-Nacionalidades.pdf"], ["Obyvatelé – Ekvádor, sčítání 2022: mestici 77,5 %, indiáni 7,7 % (Primicias, cituje INEC)", "https://www.primicias.ec/noticias/sociedad/censo-ecuador/resultados-poblacion-mestizos-afro-indigena/"], ["Obyvatelé – Peru, sčítání 2025: mestici 61,8 %, kečuánci 17,2 % (La República, cituje INEI)", "https://larepublica.pe/sociedad/2026/07/11/inei-618-de-peruanos-se-identifica-como-mestizo-segun-los-censos-nacionales-2025-948244"], ["Obyvatelé – Peru, sčítání 2025: mestici 61,8 % (Infobae, cituje INEI)", "https://www.infobae.com/peru/2026/07/13/9-de-peruano   const typ = HRA_TYP[s.k] || 'dopln';
  const konec = jednou(body => { st.zap[s.k] = body; save(); kresliStav();
    if (!el.isConnected || st.cur !== s.k) return;          // žák mezitím odjel jinam – body se uloží, karta jiné země zůstane
    zapisHra(s); toast(`${HRA_NAZEV[typ]} – hotovo, +${body} b`); kontrola(s, 0); });

// ── minihry v zemi: v každé zemi jiná, všechny nad zápisem země (Filip 4. 10. 2026: víc gamifikace) ──
const HRA_TYP = {kolumbie: 'dopln', ekvador: 'pexeso', peru: 'spoj', bolivie: 'rychlovka', chile: 'pismena', argentina: 'pexeso',

const HRA_NAZEV = {dopln: 'Doplň zápis', pexeso: 'Pexeso', spoj: 'Spojovačka', pismena: 'Slož slovo', rychlovka: 'Rychlovka'};
const radkyZapisu = s => s.zapis.map(r => { const m = r.match(/^(.*?)\[(.+?)\](.*)$/) || ['', r, '', '']; return {pred: m[1], slovo: m[2], po: m[3]}; });
const popisRadku = r => (r.pred + '…' + r.po).trim();
const hlavaHry = (typ, text) => `<div class="minihra-hlava"><span class="tag">${HRA_NAZEV[typ]}</span><span class="krok">Minihra v zemi – po ní si zápis opíšeš do deníku</span></div><p>${text}</p>`;

function hraDopln(s, el, radky, konec) {
  const o = oblast(s.k), vlastni = radky.map(r => r.slovo);
  const cizi = zamichej([...new Set(o.staty.filter(k => k !== s.k).flatMap(k => S[byK[k]].zapis.map(r => (r.match(/\[(.+?)\]/) || [])[1]).filter(Boolean)))])
    .filter(w => !vlastni.includes(w)).slice(0, 2);
  const slova = zamichej([...vlastni, ...cizi]);
  const hotove = radky.map(() => false), chyby = radky.map(() => 0); let vyb = null, body = 0;
  function kresli() {
    el.innerHTML = hlavaHry('dopln', 'Klikni na slovo dole a pak na mezeru, kam patří. Dvě slova jsou navíc – patří k jiným zemím. Správně napoprvé = 2 body.') +
      `<ol>${radky.map((r, i) => `<li>${esc(r.pred)}${hotove[i] ? `<span class="mez ok">${esc(r.slovo)}</span>` : `<button type="button" class="mez" data-i="${i}">…</button>`}${esc(r.po)}</li>`).join('')}</ol>
      <div class="slova">${slova.filter(w => !radky.some((r, i) => hotove[i] && r.slovo === w)).map(w => `<button type="button" class="kk" data-w="${esc(w)}" aria-pressed="${vyb === w}">${esc(w)}</button>`).join('')}</div>`;
    el.querySelectorAll('.kk').forEach(b => b.addEventListener('click', () => { vyb = b.dataset.w; kresli(); }));
    el.querySelectorAll('button.mez').forEach(b => b.addEventListener('click', () => {
      if (vyb === null) { toast('Nejdřív klikni na slovo dole.'); return; }
      const i = +b.dataset.i;
      if (radky[i].slovo === vyb) { hotove[i] = true; if (!chyby[i]) body += 2; vyb = null;
        if (hotove.every(Boolean)) { konec(body); return; }
        kresli(); }
      else { chyby[i]++; b.classList.remove('vedle'); void b.offsetWidth; b.classList.add('vedle'); toast('Sem to nepatří. Přečti si „Ve zkratce“ a základní údaje.'); }
    }));
  }
  kresli();
}

function hraPexeso(s, el, radky, konec) {
  const karty = zamichej(radky.flatMap((r, i) => [{i, t: r.slovo, druh: 'slovo'}, {i, t: popisRadku(r), druh: 'popis'}]));
  const otoc = [], hot = new Set(); let zamek = false, tahy = 0;
  const n = radky.length;
  function kresli() {
    el.innerHTML = hlavaHry('pexeso', 'Otáčej karty po dvou a najdi k pojmu jeho popis – každý pár je jeden řádek zápisu. Čím míň tahů, tím víc bodů.') +
      `<div class="pexeso">${karty.map((k, j) => { const vid = otoc.includes(j) || hot.has(k.i);
        return `<button type="button" class="pk ${vid ? 'lic ' + k.druh : ''} ${hot.has(k.i) ? 'ok' : ''}" data-j="${j}" ${hot.has(k.i) ? 'disabled' : ''} aria-label="${vid ? esc(k.t) : 'karta'}">${vid ? esc(k.t) : '<span>?</span>'}</button>`; }).join('')}</div>
      <div class="row"><span class="krok">Tahy: ${tahy} · páry: ${hot.size} ${zze(n)} ${n}</span></div>`;
    el.querySelectorAll('.pk').forEach(b => b.addEventListener('click', () => {
      const j = +b.dataset.j; if (zamek || otoc.includes(j) || hot.has(karty[j].i)) return;
      otoc.push(j);
      if (otoc.length < 2) { kresli(); return; }
      tahy++; const [a, c] = otoc.map(x => karty[x]);
      if (a.i === c.i) { hot.add(a.i); otoc.length = 0; kresli();
        if (hot.size === n) setTimeout(() => konec(Math.max(n, Math.min(2 * n + 2, 3 * n + 2 - tahy))), 700); }
      else { zamek = true; kresli(); setTimeout(() => { otoc.length = 0; zamek = false; kresli(); }, 1200); }
    }));
  }
  kresli();
}

function hraSpoj(s, el, radky, konec) {
  const vlevo = zamichej(radky.map((r, i) => i)), vpravo = zamichej(radky.map((r, i) => i));
  const hot = new Set(), chyby = {}; let vyb = null, body = 0;
  const BARVY = ['#2E7D4F', '#2B6E7E', '#B7862A', '#BF3B1E', '#6B4C9A', '#1F5FA8'];
  function kresli() {
    el.innerHTML = hlavaHry('spoj', 'Klikni na pojem vlevo a pak na jeho popis vpravo. Správně napoprvé = 2 body.') +
      `<div class="spoj"><div>${vlevo.map(i => `<button type="button" class="sp l ${hot.has(i) ? 'ok' : ''}" data-i="${i}" aria-pressed="${vyb === i}" ${hot.has(i) ? `disabled style="--b:${BARVY[i % 6]}"` : ''}>${esc(radky[i].slovo)}</button>`).join('')}</div>
      <div>${vpravo.map(i => `<button type="button" class="sp r ${hot.has(i) ? 'ok' : ''}" data-i="${i}" ${hot.has(i) ? `disabled style="--b:${BARVY[i % 6]}"` : ''}>${esc(popisRadku(radky[i]))}</button>`).join('')}</div></div>
      <div class="row"><span class="krok">Body: ${body} · spojeno ${hot.size} ${zze(radky.length)} ${radky.length}</span></div>`;
    el.querySelectorAll('.sp.l').forEach(b => b.addEventListener('click', () => { vyb = +b.dataset.i; kresli(); }));
    el.querySelectorAll('.sp.r').forEach(b => b.addEventListener('click', () => {
      if (vyb === null) { toast('Nejdřív klikni na pojem vlevo.'); return; }
      const i = +b.dataset.i;
      if (i === vyb) { hot.add(i); if (!chyby[i]) body += 2; vyb = null; kresli(); if (hot.size === radky.length) setTimeout(() => konec(body), 600); }
      else { chyby[vyb] = 1; b.classList.remove('vedle'); void b.offsetWidth; b.classList.add('vedle'); toast('Tohle k sobě nepatří.'); }
    }));
  }
  kresli();
}

function hraPismena(s, el, radky, konec) {
  let i = 0, body = 0;
  function kolo() {
    if (i >= radky.length) { konec(body); return; }
    const r = radky[i], cil = [...r.slovo.replace(/\s/g, '')];
    const dl = zamichej(cil.map(ch => ch)); let slozeno = [], chyba = false;
    function kresli() {
      el.innerHTML = hlavaHry('pismena', 'Slož chybějící slovo z písmen – klikej na ně ve správném pořadí. Napoprvé 2 body, napodruhé 1.') +
        `<div class="krok">Slovo ${i + 1} ${zze(radky.length)} ${radky.length}</div><p class="vyrok">${esc(r.pred)}<b class="mezera">${slozeno.map(j => esc(dl[j])).join('') || '&nbsp;?&nbsp;'}</b>${esc(r.po)}</p>
        <div class="pismena">${dl.map((ch, j) => `<button type="button" class="pis" data-j="${j}" ${slozeno.includes(j) ? 'disabled' : ''}>${esc(ch.toUpperCase())}</button>`).join('')}</div>
        <div class="row"><button class="btn sec" type="button" id="pzpet">⌫ Vrátit písmeno</button><span class="krok">Body: ${body}</span></div>`;
      el.querySelectorAll('.pis').forEach(b => b.addEventListener('click', () => { slozeno.push(+b.dataset.j); zkontroluj(); }));
      el.querySelector('#pzpet').addEventListener('click', () => { slozeno.pop(); kresli(); });
    }
    function zkontroluj() {
      if (slozeno.length < cil.length) { kresli(); return; }
      if (slozeno.map(j => dl[j]).join('').toLowerCase() === cil.join('').toLowerCase()) {
        body += chyba ? 1 : 2;
        el.innerHTML = hlavaHry('pismena', '') + `<p class="vyrok ok">✔ ${esc(r.pred)}<b>${esc(r.slovo)}</b>${esc(r.po)}</p>`;
        i++; setTimeout(kolo, 1000);
      } else { chyba = true; slozeno = []; toast('Takhle to není – zkus jiné pořadí.'); kresli(); }
    }
    kresli();
  }
  kolo();
}

const RYCH_VYJIMKY = {'paraguay/2': ['bolivie'], 'bolivie/2': ['paraguay'], 'uruguay/0': ['argentina'], 'argentina/0': ['brazilie', 'paraguay'],
  'paraguay/1': ['brazilie'], 'kolumbie/2': ['brazilie'], 'brazilie/1': ['kolumbie'], 'argentina/2': ['uruguay', 'brazilie'],
  'bolivie/0': ['brazilie', 'fr_guyana', 'peru'], 'fr_guyana/0': ['brazilie', 'bolivie', 'uruguay'], 'brazilie/2': ['bolivie', 'fr_guyana'],
  'chile/2': ['peru', 'ekvador', 'kolumbie', 'argentina'], 'chile/0': ['bolivie', 'kolumbie', 'ekvador'], 'kolumbie/1': ['ekvador', 'peru'],
  'peru/0': ['ekvador', 'chile', 'kolumbie'], 'guyana/0': ['brazilie', 'surinam', 'venezuela', 'fr_guyana'], 'brazilie/0': ['uruguay', 'argentina'],
  'uruguay/2': ['brazilie', 'argentina'], 'venezuela/2': ['guyana', 'kolumbie'], 'surinam/1': ['guyana', 'fr_guyana'], 'uruguay/1': ['argentina'],
  'argentina/1': ['chile'], 'guyana/1': ['surinam']};
function hraRychlovka(s, el, radky, konec) {
  const o = oblast(s.k);
  const cizi = zamichej(S.filter(x => x.k !== s.k).flatMap(x => x.hadanka.map((t, j) => ({t, k: x.k, j})))
    .filter(v => !(RYCH_VYJIMKY[v.k + '/' + v.j] || []).includes(s.k)));
  const nepravda = [...cizi.filter(v => o.staty.includes(v.k)).slice(0, 2), ...cizi.filter(v => !o.staty.includes(v.k)).slice(0, 1)];
  const vyroky = zamichej([...s.hadanka.map(t => ({t, plati: true})), ...nepravda.map(v => ({t: v.t, plati: false, kdo: v.k}))]);
  const CAS = 10; let i = 0, body = 0, rada = 0, nejrada = 0;
  function kolo() {
    if (!el.isConnected) return;
    if (i >= vyroky.length) { el.innerHTML = hlavaHry('rychlovka', `Hotovo! Nejdelší řada správných odpovědí: <b>${nejrada}</b>.`); setTimeout(() => konec(body), 1000); return; }
    const v = vyroky[i]; let zbyva = CAS, hotovo = false, timer = null;
    el.innerHTML = hlavaHry('rychlovka', `Platí tahle věta o zemi <b>${esc(s.n)}</b>? Na každou máš ${CAS} sekund. Za tři správné odpovědi za sebou dostaneš bonus.`) +
      `<div class="krok">Věta ${i + 1} z ${vyroky.length}</div><div class="vyrok">„${esc(v.t)}“</div><div class="casovac"><i style="animation-duration:${CAS}s"></i></div>
      <div class="opts dva"><button type="button" data-a="1">✔ Platí</button><button type="button" data-a="0">✘ Neplatí</button></div>
      <div class="row"><span class="krok">Body: ${body}${rada >= 2 ? ` · řada ${rada} 🔥` : ''}</span></div>`;
    const odpoved = a => { if (hotovo) return; hotovo = true; clearInterval(timer); el.querySelectorAll('.opts button').forEach(b => b.disabled = true);
      const ok = a === v.plati;
      if (ok) { rada++; nejrada = Math.max(nejrada, rada); body += 2 + (rada >= 3 ? 1 : 0); } else rada = 0;
      const p = document.createElement('p'); p.className = ok ? 'ok' : 'napoveda';
      p.textContent = ok ? (rada >= 3 ? `Správně! Řada ${rada} – bonus +1.` : 'Správně!')
        : (a === null ? 'Čas vypršel. ' : 'Vedle. ') + (v.plati ? `Tohle o zemi ${s.n} platí.` : `Tohle platí o zemi ${nazev(v.kdo)}.`);
      el.appendChild(p); i++; setTimeout(kolo, ok ? 1000 : 2600); };
    el.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => odpoved(b.dataset.a === '1')));
    timer = setInterval(() => { if (!el.isConnected) { clearInterval(timer); return; } if (--zbyva <= 0) odpoved(null); }, 1000);
  }
  // čas běží až po Startu – nejdřív si žák v klidu přečte „Ve zkratce“
  el.innerHTML = hlavaHry('rychlovka', `Nejdřív si přečti „Ve zkratce“ nahoře. Pak přijde ${vyroky.length} vět o zemi <b>${esc(s.n)}</b> a u každé rozhodneš, jestli o ní platí. Na každou větu máš ${CAS} sekund, za tři správně za sebou je bonus.`) +
    `<div class="row"><button class="btn" type="button" id="rStart">▶ Start rychlovky</button></div>`;
  el.querySelector('#rStart').addEventListener('click', kolo);
}

function hraPopisky(o, el, hotovo) {

  function kresli() {
    const zbyva = cile.filter(c => !c.hotovo);

      <p class="q">${esc(K.nazev)}</p><p>${esc(K.zadani)} Klikni na popisek a pak na číslo na obrázku. ${navic.length ? `Pozor: ${navic.length === 2 ? 'dva popisky' : 'některé popisky'} na obrázek nepatří. ` : ''}Správně napoprvé = 3 body, napodruhé 1 bod.</p>

      ${zbyva.length ? '' : `<p class="zapis-pokyn">✏️ Opiš popisky do Cestovního deníku – strana oblasti <b>${esc(o.nazev || K.nazev)}</b>, oddíl <b>Přírodní podmínky</b>.</p>`}
      <div class="row"><span class="krok">Body: ${body} / ${max}</span>${zbyva.length ? '' : '<button class="btn" type="button" id="dal">Další hra ▶</button>'}</div>`;

// ── Hra 2: Odkryj obrázek – fotka pod dlaždicemi, čím dřív ji poznáš, tím víc bodů ──
function hraOdkryj(o, el, hotovo) {
  hotovo = jednou(hotovo);
  const fotky = zamichej(pool(o).flatMap(k => S[byK[k]].fotky.slice(0, 3).map(f => ({...f, k}))));
  const kola = fotky.slice(0, 3); const max = kola.length * 10; let i = 0, body = 0;
  const DL = 12;                                         // 4 × 3 dlaždice
  function kolo() {
    if (i >= kola.length) { hotovo(body, max); return; }
    const f = kola[i];
    const slova = t => bezCarek(t.toLowerCase()).split(/[^a-z]+/).filter(w => w.length >= 5).map(w => w.slice(0, 5));   // kmen: prales × pralesa
    const podobne = x => slova(x.cap).some(w => slova(f.cap).includes(w));
    const kand = zamichej(fotky.filter(x => x.cap !== f.cap && !podobne(x)));
    const jine = [...kand.filter(x => x.k !== f.k), ...kand.filter(x => x.k === f.k)].slice(0, 3).map(x => x.cap);
    const moz = zamichej([f.cap, ...jine]);
    const odkryte = new Set(zamichej([...Array(DL).keys()]).slice(0, 2)); const spatne = new Set();
    const hodnota = () => spatne.size ? Math.min(2, Math.max(1, 12 - odkryte.size)) : Math.max(1, 12 - odkryte.size);
    function odkryj(n) { const skryte = zamichej([...Array(DL).keys()].filter(x => !odkryte.has(x))); skryte.slice(0, n).forEach(x => odkryte.add(x)); }
    function kresli(konec) {
      el.innerHTML = `<div class="krok">Hra 2 ze 4 · Odkryj obrázek · ${i + 1} ze ${kola.length}</div>
        <p class="q">Co je na fotce?</p><p style="color:var(--muted);font-size:14px;margin-top:-4px">Netipuj naslepo: po chybě dostaneš za fotku nejvýš 2 body. Radši si odkryj další kousek.</p>
        <div class="odkryj"><img src="${f.src}" alt=""><div class="dlazdice">${[...Array(DL).keys()].map(x => `<i class="${konec || odkryte.has(x) ? 'pryc' : ''}"></i>`).join('')}</div></div>
        <div class="opts">${moz.map(m => `<button type="button" data-m="${esc(m)}" ${konec || spatne.has(m) ? 'disabled' : ''} class="${konec && m === f.cap ? 'dobre' : spatne.has(m) ? 'spatne' : ''}">${esc(m)}</button>`).join('')}</div>
        <div class="row">${konec ? '' : `<button class="btn sec" type="button" id="dalsi">Odkryj další kousek${spatne.size ? '' : ' (−1 b)'}</button>`}
          <span class="krok">${konec ? `Byla to fotka ze země ${esc(nazev(f.k))}.` : `Teď za ${hodnota()} b`} · body: ${body} / ${max}</span></div>`;
      if (konec) return;
      el.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => {
        if (b.dataset.m === f.cap) { body += hodnota(); kresli(true); i++; setTimeout(kolo, 1600); }
        else { const prvni = !spatne.size; spatne.add(b.dataset.m); odkryj(2); kresli(); pauzaPoChybe(el, 3000); toast(prvni ? 'Vedle – teď už jen za 2 body. Odkryly se další kousky.' : 'Vedle – odkryly se další kousky.'); }
      }));
      el.querySelector('#dalsi').addEventListener('click', () => { odkryj(1); kresli(); });
    }
    kresli();
  }
  kolo();
}

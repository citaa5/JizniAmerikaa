          if (vyreseno) return; vyreseno = true; body += hodnota(); b.classList.add('dobre'); el.querySelectorAll('button').forEach(x => x.disabled = true);
          i++; setTimeout(kolo, 900);
        } else { spatne.add(b.dataset.k); const pribyla = ind < s.hadanka.length; if (pribyla) ind++; kresli(); pauzaPoChybe(el, 3000); toast(pribyla ? 'Vedle – přibyla další indicie.' : 'Vedle – zkus jinou zemi.'); }
      }));
      const d = el.querySelector('#dalsi'); if (d) d.addEventListener('click', () => { if (vyreseno) return; ind++; kresli(); });
    }
    kresli();
  }
  kolo();
}

function hraMapa(o, el, hotovo) {
  hotovo = jednou(hotovo);
  const cile = zamichej(pool(o)); const max = cile.length * 5; let i = 0, pokusy = 0, body = 0;
  const box = $('.mapbox'); box.classList.add('hra'); zvyrazniOblast(o);
  const hint = document.createElement('div'); hint.className = 'maphint'; box.appendChild(hint);
  function blik(p, cls, ms) { if (!p) return; p.classList.add(cls); setTimeout(() => p.classList.remove(cls), ms || 800); }
  function kolo() {
    if (i >= cile.length) { mapHra = null; box.classList.remove('hra'); zvyrazniOblast(null); hint.remove(); hotovo(body, max); return; }
    pokusy = 0; hint.textContent = `Klikni na: ${nazev(cile[i])}`;
    el.innerHTML = `<div class="krok">Hra 4 ze 4 · Najdi na slepé mapě · ${i + 1} ${cile.length === 5 ? 'z' : 'ze'} ${cile.length}</div>
      <p class="q">Klikni na mapě na zemi <b>${esc(nazev(cile[i]))}</b>.</p>
      <p>Trasa i tvůj parťák jsou teď schovaní, oblast je vybarvená. Napoprvé 5 bodů, napodruhé 2.</p><span class="krok">Body: ${body} / ${max}</span>`;
  }
  mapHra = (k, p) => {
    if (k === cile[i]) { body += pokusy === 0 ? 5 : pokusy === 1 ? 2 : 0; blik(p, 'trefa'); i++; mapHra = () => {}; setTimeout(() => { mapHra = hraj; kolo(); }, 700); return; }
    pokusy++; blik(p, 'vedle');
    toast(k ? `Tohle je ${nazev(k)}.` : 'Tohle není země z naší cesty.');
    if (pokusy >= 3) { blik(document.querySelector(`.zeme[data-k="${cile[i]}"]`), 'ukaz', 1500); toast(`${nazev(cile[i])} je tady.`);
      i++; mapHra = () => {}; setTimeout(() => { mapHra = hraj; kolo(); }, 1600); }
  };
  const hraj = mapHra;
  box.scrollIntoView({behavior: 'smooth', block: 'center'});
  kolo();
}


// ── hry navíc (odkazy ven, otevírají se v nové záložce) ──
function hryNavic(skupiny) {
  const seznam = skupiny.flatMap(g => (HRY[g] || []).map(h => ({...h, g}))).filter((h, i, a) => a.findIndex(x => x.url === h.url) === i);
  if (!seznam.length) return '';
  return `<section class="hrynavic"><h3>Zahraj si víc</h3><p>Hry se otevřou v nové záložce. Do bodů se nepočítají – jsou na trénink.</p>
    <ul>${seznam.map(h => `<li><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.nazev)}</a> <span class="krok">${esc(h.typ)}${h.web ? ' · ' + esc(h.web) : ''}</span></li>`).join('')}</ul></section>`;
}

function vysledkovaKarta() {
  const odz = OBL.filter(o => st.odznak[o.id]);
  return `<section class="vkarta" aria-label="Výsledková karta"><div class="krok">Výsledková karta · jsi v cíli!</div>
    <div class="vk-cislo">Cestující č. ${st.c}</div>
    <div class="vk-body">${celkem()} <small>bodů</small></div>
    <div class="vk-titul">${esc(titul())}</div>
    <div class="vk-suv" title="Suvenýry">${S.map(x => `<span class="${st.done[x.k] ? 'ma' : ''}" title="${esc(x.n)}">${st.done[x.k] ? SUVENYR[x.k][0] : '·'}</span>`).join('')}</div>
    <div class="vk-odznaky">${OBL.map(o => `<span class="${st.odznak[o.id] ? 'ma' : ''}">${st.odznak[o.id] ? '🏅' : '○'} ${esc(o.odznak)}</span>`).join('')}</div>
    <p><b>Opiš body a titul do Cestovního deníku a zvedni ruku</b> – učitel kartu zkontroluje. Máš-li čas, projeď bonusové odbočky nebo si zahraj hry níž.</p></section>`;
}

function vyzvaKonec(o, body, max) {
  const pred = st.vyzva[o.id]; const proc = max ? Math.round(100 * body / max) : 0;
  st.vyzva[o.id] = {body: Math.max(body, pred ? pred.body : 0), max};
  if (proc >= 70) st.odznak[o.id] = 1;
  save(); kresliStav();
  const n = OBL.indexOf(o) + 1, posl = S[byK[poslPovinny(o)]], heslo = posl.hesla[st.c - 1];
  const next = dalsiPovinny(posl.k), konec = !next;
  let tl = '';
  if (next) tl += `<button class="btn" type="button" data-k="${next}">Jedeme do další oblasti${znam(next) ? ': ' + esc(nazev(next)) : ''} ▶</button>`;
  for (const [r, seq] of Object.entries(ODB)) {
    if (!konec && oblast(r).id !== o.id) continue;
    const k = seq.find(x => !st.done[x] && odemceno(x));
    if (k) tl += `<button class="btn sec" type="button" data-k="${k}">Bonusová odbočka (${seq.length} země)</button>`;
  }
  tl += `<button class="btn sec" type="button" data-znovu="1">Zkusit výzvu znovu</button>`;
  $('#karta').innerHTML = `<div class="eyebrow"><span class="tag b">Výzva oblasti</span><span>${esc(o.nazev)}</span></div><h2>${proc >= 70 ? 'Výzva splněna!' : 'Výzva dokončena'}</h2>
    <div><div class="skore">${body} / ${max} b</div><div class="krok">${proc} %${pred && pred.body > body ? ` · tvůj lepší pokus: ${pred.body} b` : ''}</div></div>
    <div class="odznak"><div class="medaile ${st.odznak[o.id] ? '' : 'ne'}">${esc(o.odznak)}</div>
      <p>${st.odznak[o.id] ? `Získal(a) jsi odznak <b>${esc(o.odznak)}</b>! Zaškrtni si ho v Cestovním deníku.` : 'Na odznak potřebuješ aspoň 70 % bodů. Výzvu můžeš zkusit znovu – počítá se lepší pokus.'}</p></div>
    ${kodRadek()}<div class="prechod">Hraniční přechod ${n} ze ${OBL.length}: zvedni ruku a řekni učiteli „Cestující ${st.c}, heslo ${esc(heslo)}, výzva ${st.vyzva[o.id].body} ${bodu(st.vyzva[o.id].body)}“.</div>
    ${konec ? vysledkovaKarta() : ''}
    ${hryNavic(konec ? ['cela', o.id] : [o.id, 'cela'])}
    <div class="dal">${tl}</div>`;
  document.querySelectorAll('#karta .dal button[data-k]').forEach(b => b.addEventListener('click', () => jed(b.dataset.k)));
  document.querySelector('#karta .dal button[data-znovu]').addEventListener('click', () => vyzva(o));
  konfety();
}

// ── start ──
function start() {
  if (st.c) {
    const hotovo = POVINNE.filter(k => st.done[k]).length;
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Vítejte zpátky</h2>
      ${ikona(st.vuz || 'lama', 110)}<p>Na tomhle zařízení je rozjetá cesta: <b>Cestující č. ${st.c}</b> (${esc(vuz().n)}), hotovo ${hotovo} z ${POVINNE.length} povinných zemí, ${celkem()} bodů.</p>
      <div class="row"><button class="btn" type="button" id="pokr">To jsem já – pokračovat</button>
      ${st.zamek ? '' : '<button class="btn sec" type="button" id="znovu">Nejsem to já – nová cesta</button>'}</div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#pokr').addEventListener('click', () => ov.remove());
    ov.querySelector('#znovu')?.addEventListener('click', () => { st = NOVY(); save(); ov.remove(); start(); });
    ov.querySelector('#pokr').focus();
  }
  if (!st.c) uvod();
  place(S[byK[st.cur]].x, S[byK[st.cur]].y); kresliStav();
  if (znam(st.cur)) karta(st.cur); else poznej(st.cur, () => { kresliStav(); karta(st.cur, true); });
}

// ── úvod: 1) vítej, 2) parťák (postava), 3) číslo Cestujícího ──
function uvod() {
  const ov = document.createElement('div'); ov.className = 'overlay';
  const d = document.createElement('div'); d.className = 'dialog intro'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  ov.appendChild(d); document.body.appendChild(ov);
  const kroky = n => `<div class="kroky">${[0, 1, 2].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
  const pruvod = Object.keys(VOZY).map((k, i) => `<g transform="translate(${60 + i * 110} 96) scale(1.35)"><g class="hup" style="animation-delay:${i * .07}s">${VOZY[k].svg}</g></g>`).join('');
  function krok1() {
    d.innerHTML = `${kroky(0)}<h2>Ahoj! Vítej na cestě po Jižní Americe</h2>
      <div class="scena"><svg viewBox="0 0 700 130" aria-hidden="true"><rect x="0" y="100" width="700" height="30" fill="#E7E1D3"/>
        <line x1="0" y1="116" x2="700" y2="116" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="18 14"/><g class="pruvod">${pruvod}</g></svg></div>
      <ol>
        <li style="--i:0">Projedeš <b>3 oblasti</b>: Andské státy, Země jižního cípu a Brazílii s okolními státy. Povinných zemí je 8, rychlejší můžou odbočit do dalších 5.</li>
        <li style="--i:1">Než do země dojedeš, musíš ji poznat na <b>slepé mapě</b> a napsat její název – pomůže atlas. V zemi si přečteš krátký text „Ve zkratce“ a zahraješ <b>minihru</b> – v každé zemi jinou (pexeso, spojovačka, slož slovo, rychlovka…). Po ní si opíšeš zápis do deníku a za projetou zemi dostaneš <b>suvenýr</b> do pasu. Kdo chce víc, otevře rozšiřující témata.</li>
        <li style="--i:2">Každou zemi zakončí <b>pasová kontrola</b> (3 otázky) – dostaneš razítko, heslo a body. Neklikej naslepo: po ${LIMIT} chybách se kontrola zastaví a musí přijít učitel. Na konci oblasti tě čeká <b>výzva</b> – čtyři hry: „Popisky na obrázku“, „Odkryj obrázek“, „Hádej zemi“ a „Najdi na mapě“.</li>
        <li style="--i:3">Sbíráš body a odznaky. Po každé oblasti se hlásíš učiteli s heslem a body.</li>
      </ol>
      <p><b>Pro dvojici:</b> jeden ovládá tablet, druhý píše do deníku – po každé zemi se vyměňte. Na konci hodiny si opište <b>kód cesty</b> z horní lišty, příště s ním pokračujete i na jiném tabletu.</p>
      <div class="row"><button class="btn" type="button" id="u1">Dál: vyber si, s kým pojedeš ▶</button><button class="btn sec" type="button" id="uK">Pokračujeme z minulé hodiny (máme kód cesty)</button></div>`;
    d.querySelector('#u1').addEventListener('click', krok2); d.querySelector('#u1').focus();
    d.querySelector('#uK').addEventListener('click', krokKod);
  }
  function krokKod() {
    d.innerHTML = `<h2>Pokračujeme z minulé hodiny</h2><p>Napište kód cesty z Cestovního deníku (9 znaků, třeba 4KQ-7MZ-2PX). Hra vás vrátí do poslední země i s body a odznaky.</p>
      <form class="poznej" id="kodF" autocomplete="off"><label for="kodIn">Kód cesty</label><div class="row"><input id="kodIn" spellcheck="false" autocapitalize="characters" maxlength="13">
      <button class="btn" type="submit">Pokračovat ▶</button></div><p class="napoveda" id="kodE" hidden></p></form>
      <div class="row"><button class="btn sec" type="button" id="kodZpet">◀ Zpět – začínáme novou cestu</button></div>`;
    d.querySelector('#kodIn').focus(); d.querySelector('#kodZpet').addEventListener('click', krok1);
    d.querySelector('#kodF').addEventListener('submit', e => { e.preventDefault();
      const k = nactiKod(d.querySelector('#kodIn').value);
      if (!k) { const er = d.querySelector('#kodE'); er.hidden = false; er.textContent = 'Kód nesedí. Zkontrolujte ho v deníku – hlavně podobná písmena a čísla (0 je nula).'; return; }
      obnovZKodu(k); krok2(() => { ov.remove(); nasadVuz(); kresliStav(); place(S[byK[st.cur]].x, S[byK[st.cur]].y); karta(st.cur);
        toast(`Vítejte zpátky, Cestující č. ${st.c}! Pokračujete ze země ${nazev(st.cur)}.`); }); });
  }
  function krok2(potom) {
    let vyber = VOZY[st.vuz] ? st.vuz : 'lama';
    d.innerHTML = `${kroky(1)}<h2>S kým pojedeš?</h2><p>Vyber si parťáka – typickou postavu Jižní Ameriky. Bude s tebou putovat po mapě celou cestu.</p>
      <div class="vozy">${Object.entries(VOZY).map(([k, v]) => `<button type="button" data-k="${k}" aria-pressed="${k === vyber}">${ikona(k, 110)}<span>${v.n}</span></button>`).join('')}</div>
      <div class="row"><button class="btn" type="button" id="u2">Vybrat a pokračovat ▶</button></div>`;
    d.querySelectorAll('.vozy button').forEach(b => b.addEventListener('click', () => {
      vyber = b.dataset.k; d.querySelectorAll('.vozy button').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    d.querySelector('#u2').addEventListener('click', () => { st.vuz = vyber; nasadVuz(); if (typeof potom === 'function') { save(); potom(); } else krok3(); });
    d.querySelector('.vozy button[aria-pressed="true"]').focus();
  }
  function krok3() {
    let c = 0;
    d.innerHTML = `${kroky(2)}<h2>Vaše číslo Cestujícího</h2>
      <p>Číslo vaší dvojici přidělí učitel. Vyberte ho a zapište si ho oba do Cestovního deníku – podle něj dostanete svá hesla.</p>
      <div class="cisla">${Array.from({length: POCET}, (_, i) => `<button type="button" data-c="${i + 1}" aria-pressed="false">${i + 1}</button>`).join('')}</div>
      <div class="row"><button class="btn" type="button" id="u3" disabled>Vyrazit ▶</button><span class="krok" id="cisV"></span></div>`;
    d.querySelectorAll('.cisla button').forEach(b => b.addEventListener('click', () => {
      c = +b.dataset.c; d.querySelectorAll('.cisla button').forEach(x => x.setAttribute('aria-pressed', x === b));
      d.querySelector('#cisV').textContent = `Jste Cestující č. ${c}`; d.querySelector('#u3').disabled = false; }));
    d.querySelector('#u3').addEventListener('click', () => { if (!c) return; st.c = c; save(); ov.remove(); kresliStav();
      poznej(st.cur, () => { kresliStav(); karta(st.cur, true); prijezdStart(); }); });
  }
  krok1();
}
function prijezdStart() {           // vůz „přijede“ zleva do Kolumbie
  const b = S[byK[st.cur]];
  if (reduce()) { place(b.x, b.y); return; }
  const a = {x: b.x - 260, y: b.y + 40}; const t0 = performance.now(), T = 1300; car.classList.add('jede');
  (function krok(now) { const t = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - t, 3);
    place(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e); if (t < 1) requestAnimationFrame(krok); else car.classList.remove('jede'); })(t0);
  setTimeout(() => { place(b.x, b.y); car.classList.remove('jede'); }, T + 400);
}

// ── učitel (#ucitel) ──
function ucitel(odemceno) {
  const o = document.createElement('div'); o.className = 'overlay';
  if (!odemceno) {
    o.innerHTML = `<form class="dialog" id="pinf"><h2>Učitel</h2><label for="pin">PIN k hesláři</label>
      <input id="pin" inputmode="numeric" autocomplete="off" style="font-size:24px;padding:8px;width:8em">
      <p class="napoveda" id="pinerr" hidden>Špatný PIN.</p>
      <div class="row"><button class="btn" type="submit">Otevřít</button><button class="btn sec" type="button" id="pinz">Zavřít</button></div></form>`;
    document.body.appendChild(o); o.querySelector('#pin').focus();
    o.querySelector('#pinz').addEventListener('click', () => { o.remove(); history.replaceState(null, '', location.pathname); });
    o.querySelector('#pinf').addEventListener('submit', e => { e.preventDefault();
      if (o.querySelector('#pin').value.trim() === '8342') { o.remove(); ucitel(true); } else o.querySelector('#pinerr').hidden = false; });
    return;
  }
  const hl = S.map(s => `<th class="${s.prechod ? 'p' : ''}">${esc(s.n)}${s.povinny ? '' : ' (b)'}${s.prechod ? ` · přechod ${s.prechod}` : ''}</th>`).join('');
  const rows = Array.from({length: POCET}, (_, i) => `<tr><td>${i + 1}</td>${S.map(s => `<td class="${s.prechod ? 'p' : ''}">${esc(s.hesla[i])}</td>`).join('')}</tr>`).join('');
  o.innerHTML = `<div class="dialog ucitel" role="dialog" aria-modal="true"><h2>Heslář pro učitele</h2>
    <p>Řádek = číslo Cestujícího. Zvýrazněné sloupce jsou hraniční přechody, kde se žáci hlásí. (b) = bonusová země.</p>
    <div class="tabwrap"><table class="hes"><thead><tr><th>Č.</th>${hl}</tr></thead><tbody>${rows}</tbody></table></div>
    <h3>Tohle zařízení</h3><p>Kód k odemčení zastavené pasové kontroly: <b>5917</b></p>
    <div class="row"><label for="setc">Nastavit Cestujícího:</label><select id="setc">${Array.from({length: POCET}, (_, i) => `<option ${st.c === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>
      <button class="btn sec" type="button" id="nastav">Nastavit</button>
      <button class="btn sec" type="button" id="smaz">Smazat postup</button><span id="potvrd"></span></div>
    <div><button class="btn" type="button" id="zavri">Zavřít</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#nastav').addEventListener('click', () => { st.c = +o.querySelector('#setc').value; save(); mapHra = null; $('.mapbox').classList.remove('hra'); zvyrazniOblast(null); uklidMapu(); document.querySelectorAll('.overlay').forEach(x => { if (x !== o) x.remove(); }); kresliStav(); if (znam(st.cur)) karta(st.cur); else poznej(st.cur, () => { kresliStav(); karta(st.cur, true); }); toast('Nastaveno: Cestující ' + st.c); });
  o.querySelector('#smaz').addEventListener('click', () => {
    o.querySelector('#potvrd').innerHTML = `<button class="btn" type="button" id="ano">Opravdu smazat</button>`;
    o.querySelector('#ano').addEventListener('click', () => { st = NOVY(); save(); history.replaceState(null, '', location.pathname); location.reload(); });
  });
  o.querySelector('#zavri').addEventListener('click', () => { o.remove(); if (location.hash === '#ucitel') history.replaceState(null, '', location.pathname); });
}

start();
if (location.hash === '#ucitel') ucitel();
window.addEventListener('hashchange', () => { if (location.hash === '#ucitel') ucitel(); });
</script>

<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Filip Cihlář">
<title>Asie – vodstvo</title>
<style>
  :root{--text:#1d2430;--seda:#5d6675;--akcent:#1f5fa8}
  html,body{margin:0;min-height:100%;background:#e9eef3;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 16px}
  h1{font-size:40px;margin:0 0 6px}
  p.pod{font-size:20px;color:var(--seda);margin:0 0 28px}
  a.k{display:block;background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:16px;text-decoration:none;color:var(--text);
    box-shadow:0 4px 16px rgba(0,0,0,.08);border:2px solid transparent}
  a.k:hover{border-color:var(--akcent)}
  a.k b{display:block;font-size:30px;margin-bottom:4px}
  a.k span{font-size:18px;color:var(--seda)}
  a.k.brzy{opacity:.55;pointer-events:none}
  a.k.brzy b::after{content:"  · připravuje se";font-size:18px;color:var(--seda);font-weight:400}
  footer{font-size:14px;color:var(--seda);margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>Asie – vodstvo</h1>
  <p class="pod">zeměpis · 8. ročník</p>
  <a class="k" href="hra/"><b>🗺️ Hra: Najdi v Asii</b><span>Klikej do mapy: řeky, pohoří, moře, poloostrovy, jezera.</span></a>
  <a class="k brzy" id="kviz" href="#"><b>✅ Kvíz</b><span>15 otázek, každý má jiné pořadí. Odeslat jde jen jednou.</span></a>
  <a class="k brzy" id="wordwall" href="#"><b>📌 Wordwall</b><span>Přetáhni názvy řek a jezer na mapu.</span></a>
  <footer>Mapa: Natural Earth.</footer>
</main>
</body>
</html>

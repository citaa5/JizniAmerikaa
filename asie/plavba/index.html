<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Filip Cihlář">
<title>Plavba Asií</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#22314a;--tx:#e6edf3;--mut:#93a4bd;--sea:#08111f;--land:#212c3d;--edge:#43556f;--hranice:#2a3649;--jemne:#ffffff0d;--rvpod:#24405f;--zluta:#ffd54a;--zel:#3ddc84;--mod:#7fd3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 420px;height:100vh}
#mapa{position:relative;overflow:hidden;min-width:0}
svg{width:100%;height:100%;display:block;background:var(--sea)}
#karta{background:var(--panel);border-left:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:8px;height:100vh;overflow:hidden}
#hlava{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--mut)}
#hlava b{color:var(--zluta)}
#lista{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
#lista i{display:block;height:100%;width:0;background:var(--zel);transition:width .3s}
#obsah{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:7px}
h1{font-size:34px;line-height:1.1;margin:2px 0;font-weight:800}
h2{font-size:21px;line-height:1.2;margin:0;font-weight:800}
.text{font-size:16px;line-height:1.35;margin:0}
.mut{color:var(--mut)}
ul.pravidla{margin:0;padding-left:20px;font-size:16px;line-height:1.4}
.nap{display:flex;gap:10px;align-items:flex-start;font-size:16.5px;line-height:1.27;background:var(--jemne);border-left:4px solid var(--mod);border-radius:6px;padding:6px 10px}
.nap b{flex:0 0 auto;color:var(--mod);font-size:14px;line-height:21px;white-space:nowrap}
.nap.nova{animation:in .3s}
.pismeno{font-size:18px;font-weight:800;color:var(--zluta)}
.vysl{font-size:18px;font-weight:800}
.vysl.ok{color:var(--zel)}.vysl.ne{color:#ffa94d}
.jmeno{font-size:32px;line-height:1.12;font-weight:800;color:var(--zluta)}
.zaj{font-size:17px;line-height:1.35;background:var(--jemne);border-radius:6px;padding:9px 12px}
.zaj::before{content:"💡 "}
.skore{font-size:58px;line-height:1;font-weight:800;color:var(--zluta)}
.skore small{font-size:26px;color:var(--mut)}
.seznam{columns:2;column-gap:14px;margin:0;padding:0;list-style:none;font-size:15px;line-height:1.32}
.seznam li{break-inside:avoid}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#dole{display:flex;flex-direction:column;gap:6px}
#zprava{min-height:21px;font-size:15px;line-height:21px;font-weight:700;color:#ffa94d}
#vstup{width:100%;height:46px;font:600 21px "Segoe UI",Roboto,system-ui,sans-serif;color:var(--tx);background:#0b1220;border:2px solid var(--mod);border-radius:8px;padding:0 12px;outline:none}
#vstup[readonly]{border-color:var(--line);color:var(--mut)}
#vstup::placeholder{color:var(--mut);font-weight:500;font-size:17px}
#tlac{display:flex;gap:8px;min-height:36px}
button{flex:1;height:36px;font:700 15px "Segoe UI",Roboto,system-ui,sans-serif;color:var(--tx);background:#1a2740;border:1px solid var(--edge);border-radius:7px;cursor:pointer}
button:hover{background:#24344f}
button[hidden]{display:none}
.oblast{fill:var(--mod);fill-opacity:.42;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.linie{fill:none;stroke:var(--zluta);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hotovo.oblast{fill:var(--zel)}.hotovo.linie{stroke:var(--zel)}
.lod{fill:none;stroke:var(--mod);stroke-opacity:.55;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.let{fill:none;stroke:var(--zluta);stroke-width:2;stroke-dasharray:8 7;vector-effect:non-scaling-stroke}
#popis{fill:var(--zluta);font-weight:800;paint-order:stroke;stroke:#0b1220;stroke-linejoin:round;pointer-events:none}
#znacka text{font-family:"Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:30px;text-anchor:middle}
#boure{position:absolute;inset:0;background:#070b14;display:flex;flex-direction:column;gap:12px;padding:16px 18px}
#boure[hidden]{display:none}
#boure .bText{font-size:22px;line-height:1.2;font-weight:800;color:var(--zluta)}
#boure .fotky{display:flex;gap:14px;flex:1;min-height:0}
#boure figure{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
#boure img{width:100%;max-height:calc(100% - 22px);object-fit:contain;border-radius:8px}
#boure figcaption{font-size:12px;line-height:1.2;color:var(--mut);text-align:center}
</style></head>

function hlava(){$("#kde").textContent=i<0?"Plavba Asií":`Zastávka ${i+1} / ${D.st.length}`;$("#body").textContent=body;
  $("#lista i").style.width=((i+(faze=="odpoved"||faze=="konec"?1:0))/D.st.length*100)+"%"}
function ovladani(misto,nap,vzdat,dal){vstup.readOnly=faze!="otazka"&&faze!="zamek";vstup.placeholder=misto;$("#bNap").hidden=!nap;$("#bVzdat").hidden=!vzdat;$("#bDal").hidden=!dal;$("#bZpet").hidden=faze!="zamek";
  $("#bVzdat").textContent=zolici>0?`Vzdát to (0 bodů) · zbývá ${zolici}×`:"Vzdát to (heslo od učitele)"}
function zprava(t){$("#zprava").textContent=t||""}
function kresliStart(){$("#obsah").innerHTML=`<h1>Plavba Asií</h1><p class="text">Popluješ kolem Asie od moře k moři a vjedeš do řek. Na mapě se rozsvítí, kde loď je, a ty napíšeš, jak se to místo jmenuje.</p>
<ul class="pravidla"><li>Jméno po 1. nápovědě: <b>3&nbsp;body</b></li><li>po 2. nápovědě: <b>2&nbsp;body</b></li><li>po 3. nápovědě: <b>1&nbsp;bod</b>, ukáže se i první písmeno</li><li>po 3. nápovědě to můžeš vzdát za 0&nbsp;bodů, ale jen 3×; pak už jen s heslem od učitele</li></ul>
<p class="text mut">Špatná odpověď nebo prázdný Enter otevře další nápovědu. Pravopis stačí přibližně. Třikrát tě chytí bouřka: loď zmizí z mapy a kde jsi, poznáš jen podle fotek.</p>`;
  ovladani("Stiskni Enter a vyplouváme",false,false,false);hlava()}
function kresliCestu(u){const t=u.t=="let"?"✈️ Tady to po vodě nejde, letíme.":u.t=="reka"?"⛵ Plujeme proti proudu.":"⛵ Plujeme dál.";
  $("#obsah").innerHTML=`<h2>${t}</h2>`;zprava("");ovladani("Loď je na cestě…",false,false,false);hlava()}
function kresliOtazku(){const z=D.st[i];let s=`<h2>${z.boure?"⛈️ Bouřka! Kde jsi? ":""}Jak se jmenuje ${TVAR[z.typ]}?</h2>`;
  for(let k=0;k<h;k++)s+=`<div class="nap${nov&&k==h-1?" nova":""}"><b>${k+1}. · za ${BODY[k]}&nbsp;b.</b><span>${esc(z.o[k])}</span></div>`;
  if(h==3)s+=`<div class="pismeno">Začíná: ${esc(z.zac)}…</div>`;
  $("#obsah").innerHTML=s;ovladani("Napiš jméno a stiskni Enter",h<3,h==3,false);hlava()}
function ukazPopis(){const z=D.st[i],k=meritko(),f=23*k,y=Math.hypot(z.lb.x-pol[0],z.lb.y-pol[1])<70*k?pol[1]+44*k:z.lb.y;popis.textContent=z.n;popis.setAttribute("x",z.lb.x);popis.setAttribute("y",y);popis.setAttribute("text-anchor",z.lb.a);
  popis.setAttribute("font-size",f);popis.setAttribute("stroke-width",f*.28)}
function vyres(ok){const z=D.st[i],b=ok?BODY[h-1]:0;body+=b;if(!ok)neuhodnuto.push(z.n);faze="odpoved";vstup.value="";zprava("");
  if(z.boure){const L=D.legs[i];$("#boure").hidden=true;L.c.forEach(stopa);pol=L.c[L.c.length-1].p.slice(-1)[0];znacka.style.display="";polozZnacku();   // bouřka přešla: ukázat, kde jsme
    cil.setAttribute("d",z.d);cil.setAttribute("class",z.typ=="reka"?"linie":"oblast");kamera(z.zoom,900)}
  cil.classList.add("hotovo");ukazPopis();
  $("#obsah").innerHTML=`<div class="vysl ${ok?"ok":"ne"}">${ok?`✔ Správně, +${b}&nbsp;${b==1?"bod":"body"}`:"Vzdáno, 0&nbsp;bodů"}</div>
<div class="text mut">Správně se píše:</div><div class="jmeno">${esc(z.n)}</div><div class="zaj">${esc(z.zaj)}</div>`;
  ovladani(i+1<D.st.length?"Stiskni Enter a plujeme dál":"Stiskni Enter a uvidíš výsledek",false,false,true);
  $("#bDal").textContent=i+1<D.st.length?"Pluj dál":"Výsledek";hlava()}
function dalsiNapoveda(){if(faze=="otazka"&&h<3){h++;nov=true;zprava("");kresliOtazku();zamer()}}
// zámek: po 3 vzdáních hra řekne číslo hesla, učitel položí otázku s tím číslem a žák napíše odpověď (ve stránce jen otisky SHA-256)
async function sha(t){const n=t.trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(n));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function zamkni(){faze="zamek";slot=1+Math.floor(Math.random()*D.hesla.length);vstup.value="";
  zprava(`🔒 Vzdání už nemáš. Řekni si učiteli o heslo č. ${slot} a napiš ho sem.`);ovladani(`Heslo č. ${slot} a Enter`,false,false,false);zamer()}
function zpet(){if(faze!="zamek")return;faze="otazka";zprava("");vstup.value="";kresliOtazku();zamer()}
async function zkusHeslo(){const t=vstup.value.trim();if(!t)return;
  if(!crypto.subtle){zprava("Heslo jde ověřit jen u souboru otevřeného přímo z disku nebo přes https.");return}
  if(D.hesla[slot-1].includes(await sha(t)))vyres(false);else{zprava(`To není heslo č. ${slot}. Zkus to znovu, nebo se vrať k hádání.`);vstup.select()}}
function spatne(){chyb++;const mohu=h<3;if(mohu){h++;nov=true;kresliOtazku();zprava("Tak se to nejmenuje. Přidávám nápovědu.")}else zprava("Tak se to nejmenuje. Zkus to znovu, nebo to vzdej.");vstup.select()}
async function plav(n){i=n;faze="cesta";h=1;nov=false;cil.setAttribute("d","");cil.removeAttribute("class");popis.textContent="";
  const L=D.legs[n],z=D.st[n];kresliCestu(L.c[L.c.length-1]);
  if(z.boure){const u=L.c[0];kresliCestu(u);await kamera(L.zoomB,600);druhZnacky(u.t);pol=u.p[0];polozZnacku();await pohyb(u,.4);   // kus cesty a pak bouřka
    znacka.style.display="none";$("#boure .fotky").innerHTML=z.boure.map(f=>`<figure><img src="${f.src}" alt=""><figcaption>${esc(f.autor)}</figcaption></figure>`).join("");
    $("#boure").hidden=false;faze="otazka";kresliOtazku();zamer();return}
  await kamera(L.zoom,600);L.c.forEach(stopa);
  for(const u of L.c){kresliCestu(u);druhZnacky(u.t);pol=u.p[0];polozZnacku();await pohyb(u)}
  cil.setAttribute("d",z.d);cil.setAttribute("class",z.typ=="reka"?"linie":"oblast");
  faze="otazka";kresliOtazku();zamer();kamera(z.zoom,600)}
function konec(){faze="konec";token++;cil.setAttribute("d","");popis.textContent="";znacka.style.display="none";$("#dole").style.display="none";hlava();
  const sek=Math.round((performance.now()-start)/1000),cas=sek<60?`${sek} s`:`${Math.floor(sek/60)} min ${sek%60} s`,
    veta=`Povedlo se ti proplout Asii za ${cas} `+(chyb==0?"a neudělat při tom jedinou chybu.":`a udělat při tom ${chyb} ${chyb==1?"chybu":chyb<5?"chyby":"chyb"}.`);
  const s=neuhodnuto.length?`<div class="text mut">Neuhodnuté (${neuhodnuto.length}):</div><ul class="seznam">${neuhodnuto.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:`<div class="vysl ok">Žádná neuhodnutá zastávka.</div>`;
  $("#obsah").innerHTML=`<h1>Doplouváme</h1><div class="skore">${body} <small>/ 84&nbsp;bodů</small></div><p class="text">${veta}</p>${s}`;
  kamera(D.konec,900)}
function potvrd(){
  if(faze=="start"){vstup.value="";start=performance.now();plav(0)}
  else if(faze=="otazka"){const t=vstup.value.trim();if(!t)dalsiNapoveda();else if(uznej(t,i))vyres(true);else spatne()}
  else if(faze=="zamek")zkusHeslo();
  else if(faze=="odpoved"){if(i+1<D.st.length)plav(i+1);else konec()}}
vstup.addEventListener("keydown",e=>{if(e.key=="Enter"){e.preventDefault();if(!e.repeat)potvrd()}});
$("#bNap").onclick=dalsiNapoveda;
$("#bVzdat").onclick=()=>{if(faze=="otazka"&&h==3){if(zolici>0){zolici--;vyres(false)}else zamkni()}};
$("#bZpet").onclick=zpet;
$("#bDal").onclick=potvrd;
// pole je pořád zaměřené: klik mimo něj focus nebere, a když ho ztratí, hned se vrátí
document.addEventListener("mousedown",e=>{if(e.target!=vstup)e.preventDefault()});
vstup.addEventListener("blur",()=>setTimeout(zamer));
window.addEventListener("focus",zamer);
window.addEventListener("resize",()=>{nastavVb(sedni(vb));if(popis.textContent)ukazPopis()});
nastavVb(sedni(D.pohled));pol=D.legs[0].c[0].p[0];polozZnacku();kresliStart();zamer();
</script></body></html>
